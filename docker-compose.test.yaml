# Test dependencies only. Application tests run through Cargo.
services:
  testdb:
    image: pgvector/pgvector:pg18
    shm_size: 1gb
    init: true
    container_name: testdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - test_pgdata:/var/lib/postgresql
      - ./scripts/init-test-postgres.sql:/docker-entrypoint-initdb.d/init-test-postgres.sql:ro
    healthcheck:
      # Do not accept an existing volume initialized with a superuser test role.
      test: ["CMD-SHELL", "PGPASSWORD=yorishiro psql -XAt -h 127.0.0.1 -U yorishiro -d yorishiro -c 'SELECT NOT (rolsuper OR rolbypassrls) FROM pg_roles WHERE rolname = current_user' | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    image: valkey/valkey:9.1.3
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  test_pgdata:
