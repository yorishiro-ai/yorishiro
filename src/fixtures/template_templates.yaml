- id: 11111111-1111-1111-1111-111111111111
  tenant_id: 00000000-0000-0000-0000-000000000000
  name: general-notes
  description: "A general-purpose note-taking schema with tags and links"
  definition:
    id: general-notes
    name: general-notes
    description: "A general-purpose note-taking schema with tags and links"
    entity_types:
      note:
        description: "A free-form note with optional tags for categorization"
        fields:
          title:
            type: string
            required: true
            description: "Short title summarizing the note"
            x-embed: true
            maxLength: 200
          body:
            type: string
            description: "The main content of the note"
            x-embed: true
            x-ui:
              widget: textarea
          tags:
            type: array
            items:
              type: string
            description: "Tags for categorization and filtering"
            uniqueItems: true
          source_url:
            type: string
            format: uri
            description: "URL of the original source, if applicable"
          status:
            type: string
            enum:
              - draft
              - active
              - archived
            default: active
            description: "Lifecycle status of the note"
    relation_types:
      references:
        source: note
        target: note
        description: "This note references or cites another note"
  author: Yorishiro
  visibility: community
  tags: []
  created_at: "2024-01-01T00:00:00.000000Z"
  updated_at: "2024-01-01T00:00:00.000000Z"
- id: 22222222-2222-2222-2222-222222222222
  tenant_id: 00000000-0000-0000-0000-000000000000
  name: task-management
  description: "Personal tasks and projects with deadlines and dependencies"
  definition:
    id: task-management
    name: task-management
    description: "Personal tasks and projects with deadlines and dependencies"
    entity_types:
      project:
        description: "A project grouping related tasks"
        fields:
          title:
            type: string
            required: true
            description: "Project name"
            x-embed: true
            maxLength: 200
          status:
            type: string
            enum:
              - active
              - on_hold
              - done
            required: true
            description: "Current project status"
          due:
            type: string
            format: date
            description: "Target completion date"
          description:
            type: string
            description: "What this project is about"
            x-embed: true
            x-ui:
              widget: textarea
      task:
        description: "A single work item"
        fields:
          title:
            type: string
            required: true
            description: "What needs to be done"
            x-embed: true
            maxLength: 200
          note:
            type: string
            description: "Additional details or context"
            x-embed: true
            x-ui:
              widget: textarea
          done:
            type: boolean
            default: false
            description: "Whether the task is completed"
          priority:
            type: string
            enum:
              - low
              - medium
              - high
              - urgent
            default: medium
            description: "Task priority level"
          due:
            type: string
            format: date
            description: "Deadline for the task"
          tags:
            type: array
            items:
              type: string
            description: "Labels for categorization"
            uniqueItems: true
    relation_types:
      belongs_to:
        source: task
        target: project
        description: "Task belongs to this project"
      depends_on:
        source: task
        target: task
        description: "This task depends on another task being completed first"
      blocks:
        source: task
        target: task
        description: "This task blocks another task from starting"
  author: Yorishiro
  visibility: community
  tags: []
  created_at: "2024-01-01T00:00:00.000000Z"
  updated_at: "2024-01-01T00:00:00.000000Z"
- id: 33333333-3333-3333-3333-333333333333
  tenant_id: 00000000-0000-0000-0000-000000000000
  name: worldbuilding
  description: "Characters, locations, factions, and items for creative writing and TRPG worldbuilding"
  definition:
    id: worldbuilding
    name: worldbuilding
    description: "Characters, locations, factions, and items for creative writing and TRPG worldbuilding"
    entity_types:
      character:
        description: "A person or creature in the world"
        fields:
          name:
            type: string
            required: true
            description: "Full name or alias"
            x-embed: true
            maxLength: 100
          description:
            type: string
            description: "Appearance, personality, background"
            x-embed: true
            x-ui:
              widget: textarea
          traits:
            type: array
            items:
              type: string
            description: "Personality traits, abilities, or notable features"
            uniqueItems: true
          status:
            type: string
            enum:
              - alive
              - deceased
              - unknown
            default: alive
            description: "Current status in the story"
          profile:
            type: object
            description: "Structured profile data"
            properties:
              age:
                type: integer
                minimum: 0
                description: "Age in years"
              gender:
                type: string
                description: "Gender identity"
              occupation:
                type: string
                description: "Role or profession"
      location:
        description: "A place in the world: city, dungeon, landmark, etc."
        fields:
          name:
            type: string
            required: true
            description: "Name of the location"
            x-embed: true
            maxLength: 100
          description:
            type: string
            description: "What the place looks like, its atmosphere, history"
            x-embed: true
            x-ui:
              widget: textarea
          type:
            type: string
            enum:
              - city
              - village
              - dungeon
              - wilderness
              - landmark
              - building
              - other
            description: "Category of location"
      faction:
        description: "An organization, group, or political entity"
        fields:
          name:
            type: string
            required: true
            description: "Name of the faction"
            x-embed: true
            maxLength: 100
          description:
            type: string
            description: "Goals, beliefs, structure"
            x-embed: true
            x-ui:
              widget: textarea
          alignment:
            type: string
            description: "Moral alignment or disposition"
      item:
        description: "A notable object: weapon, artifact, document, etc."
        fields:
          name:
            type: string
            required: true
            description: "Name of the item"
            x-embed: true
            maxLength: 100
          description:
            type: string
            description: "What it is, what it does, its history"
            x-embed: true
            x-ui:
              widget: textarea
          type:
            type: string
            enum:
              - weapon
              - armor
              - artifact
              - document
              - consumable
              - other
            description: "Category of item"
          properties:
            type: object
            description: "Game-mechanical properties (damage, weight, etc.)"
            properties:
              weight:
                type: number
                minimum: 0
                description: "Weight in arbitrary units"
              value:
                type: integer
                minimum: 0
                description: "Monetary value"
              rarity:
                type: string
                enum:
                  - common
                  - uncommon
                  - rare
                  - legendary
                description: "Rarity tier"
    relation_types:
      knows:
        source: character
        target: character
        description: "These characters know each other"
      member_of:
        source: character
        target: faction
        description: "Character belongs to this faction"
      located_in:
        source: character
        target: location
        description: "Character is currently at this location"
      controls:
        source: faction
        target: location
        description: "Faction controls or occupies this location"
      possesses:
        source: character
        target: item
        description: "Character owns or carries this item"
      found_at:
        source: item
        target: location
        description: "Item can be found at this location"
  author: Yorishiro
  visibility: community
  tags: []
  created_at: "2024-01-01T00:00:00.000000Z"
  updated_at: "2024-01-01T00:00:00.000000Z"
- id: 44444444-4444-4444-4444-444444444444
  tenant_id: 00000000-0000-0000-0000-000000000000
  name: software-adr
  description: "Architecture Decision Records, service catalog, and tech stack documentation for software projects"
  definition:
    id: software-adr
    name: software-adr
    description: "Architecture Decision Records, service catalog, and tech stack documentation for software projects"
    entity_types:
      decision:
        description: "An architecture or design decision with context, rationale, and consequences"
        fields:
          title:
            type: string
            required: true
            description: "Short title of the decision (e.g. 'Use PostgreSQL RLS for tenant isolation')"
            x-embed: true
            maxLength: 200
          status:
            type: string
            enum:
              - proposed
              - accepted
              - deprecated
              - superseded
            required: true
            description: "Current status of this decision"
          context:
            type: string
            required: true
            description: "What is the issue that we're seeing that is motivating this decision?"
            x-embed: true
            x-ui:
              widget: textarea
          decision:
            type: string
            required: true
            description: "What is the change that we're proposing and/or doing?"
            x-embed: true
            x-ui:
              widget: textarea
          consequences:
            type: string
            description: "What becomes easier or more difficult to do because of this change?"
            x-embed: true
            x-ui:
              widget: textarea
          date:
            type: string
            format: date
            description: "Date when the decision was made"
          tags:
            type: array
            items:
              type: string
            description: "Categories (e.g. 'database', 'security', 'api')"
            uniqueItems: true
      service:
        description: "A service, component, or crate in the system"
        fields:
          name:
            type: string
            required: true
            description: "Service or crate name"
            x-embed: true
            maxLength: 100
          description:
            type: string
            description: "What this service does"
            x-embed: true
            x-ui:
              widget: textarea
          tech_stack:
            type: array
            items:
              type: string
            description: "Technologies used (e.g. 'Rust', 'axum', 'sqlx')"
            uniqueItems: true
          status:
            type: string
            enum:
              - active
              - deprecated
              - planned
            default: active
            description: "Current lifecycle status"
          repo_url:
            type: string
            format: uri
            description: "Repository URL"
      incident:
        description: "A post-mortem record for a production incident or significant bug"
        fields:
          title:
            type: string
            required: true
            description: "Brief description of what happened"
            x-embed: true
            maxLength: 200
          severity:
            type: string
            enum:
              - critical
              - high
              - medium
              - low
            required: true
            description: "Impact severity"
          root_cause:
            type: string
            description: "What caused the incident"
            x-embed: true
            x-ui:
              widget: textarea
          resolution:
            type: string
            description: "How it was fixed"
            x-embed: true
            x-ui:
              widget: textarea
          date:
            type: string
            format: date
            description: "Date of the incident"
          tags:
            type: array
            items:
              type: string
            description: "Categories (e.g. 'security', 'performance', 'data-loss')"
            uniqueItems: true
    relation_types:
      supersedes:
        source: decision
        target: decision
        description: "This decision supersedes an earlier one"
      affects:
        source: decision
        target: service
        description: "This decision affects this service's design or behavior"
      depends_on:
        source: service
        target: service
        description: "This service depends on another service"
      caused_by:
        source: incident
        target: decision
        description: "This incident was caused by (or related to) a decision"
      resolved_by:
        source: incident
        target: decision
        description: "This incident led to a new decision"
  author: Yorishiro
  visibility: community
  tags: []
  created_at: "2024-01-01T00:00:00.000000Z"
  updated_at: "2024-01-01T00:00:00.000000Z"
