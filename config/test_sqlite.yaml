# Test environment for the SQLite backend (see docs/sqlite.md): boots the app against a
# SQLite file directly, LOCO_ENV=test_sqlite. Not wired into any test suite — `tests/` stays
# PostgreSQL-only (request_with_create_db issues `CREATE DATABASE`, which SQLite has no
# equivalent for) — this file exists for `cargo loco start -e test_sqlite`-style manual
# verification and for whenever a SQLite-boot test suite gets written later.
#
# YORISHIRO_MAX_TENANTS must still be set (to any value) for POST /setup to answer as enabled:
# setup.rs's wizard_enabled() checks only that the variable is set, not its value: the SQLite cap
# of 1 is enforced separately by tenancy::create_tenant regardless of what this variable says.

logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost
  middlewares:
    request_id:
      enable: true
    logger:
      enable: true

# BackgroundQueue, matching development.yaml/production.yaml: loco-rs's SQLite queue provider
# (bgworker::sqlt) is under the same `worker` feature as the Postgres provider (`pg.rs`).
# Empirically confirmed (`sqlt_loco_queue` auto-creates on `setup()`, enqueue/dequeue round-trip)
# against a real SQLite file, including the contention case: this provider opens its own
# `sqlx::SqlitePool` independent of the application's own SQLite connection (`ctx.db`), so
# writing a job while the app holds an open write transaction on the same file is a real
# possibility. A concurrent write from the queue pool waits out sqlx's 5-second `busy_timeout`
# and succeeds once the app's transaction releases the lock. In this codebase specifically, the
# actual call site (`controllers::entities::enqueue_embedding_sync`) runs after
# `Authorized::commit()` has already returned, so the write it triggers never overlaps a still-open
# app transaction from the same request.
workers:
  mode: BackgroundQueue

# Queue Configuration
#
# YORISHIRO_QUEUE_KIND picks which of loco-rs's three queue providers boots (Postgres/Sqlite/Redis, QueueConfig's #[serde(tag = "kind")] variants, config/queue.rs): each needs a different set of fields (RedisQueueConfig alone has `queues`; Postgres/SqliteQueueConfig share the SQL-pool knobs but point at different URIs), so a template conditional renders one whole alternative block rather than templating individual fields inside a single fixed shape.
# Derives from DATABASE_URL's scheme so the queue follows the database when neither is set.
# With DATABASE_URL unset (defaults to `sqlite://`) or naming PostgreSQL, the queue
# defaults to the same backend and QUEUE_URL falls back to DATABASE_URL.
# QUEUE_URL takes no default when an external backend is required (Redis, or explicit
# non-SQLite queue), matching this file's own no-silent-fallback convention.
queue:
  kind: Sqlite
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="sqlite:///var/lib/yorishiro/yorishiro.sqlite3?mode=rwc")) %>
  dangerously_flush: false
  num_workers: <%= get_env(name="YORISHIRO_QUEUE_WORKERS", default="2") %>
  reaper:
    age_minutes: <%= get_env(name="YORISHIRO_QUEUE_REAPER_AGE_MINUTES", default="30") %>
    interval_seconds: 60

mailer:
  stub: true
  smtp:
    enable: true
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    port: 1025
    secure: false

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite:///var/lib/yorishiro/yorishiro.sqlite3?mode=rwc") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: <%= get_env(name="DANGEROUSLY_TRUNCATE", default="false") %>
  dangerously_recreate: <%= get_env(name="DANGEROUSLY_RECREATE", default="false") %>

auth:
  jwt:
    secret: sqliteTierManualVerification
    expiration: 604800
