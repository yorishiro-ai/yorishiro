# Loco configuration file documentation
#
# This is the production environment.
#
# Yorishiro supports SQLite or PostgreSQL for application data.
# Queue storage is configured independently through Loco's queue provider.
# This release supports SQLite, PostgreSQL, and the Redis-compatible provider.
# An unconfigured start uses local SQLite files and serves a single-tenant trial instance.
# The default database is `sqlite:///var/lib/yorishiro/yorishiro.sqlite3?mode=rwc` (an
# absolute path, independent of the process's CWD), while SQLite jobs use the separate
# `sqlite:///var/lib/yorishiro/yorishiro_queue.sqlite3?mode=rwc` file.
# `HOST` defaults to `http://localhost`, which is enough for a trial instance that nobody
# needs to reach externally.
#
# To use PostgreSQL for application data, set `DATABASE_URL` to a `postgres://` URI.
# When you do, `YORISHIRO_QUEUE_KIND` defaults to `Postgres` and the queue uses `DATABASE_URL`
# as its connection URI (the same instance), so you need only one database running.
# Set `YORISHIRO_QUEUE_KIND=Redis` and a `redis://` or `rediss://` `QUEUE_URL` to use the Redis-compatible provider independently of the application database.
#
# The enterprise edition variables below are not rendered by this file (they are read
# directly via `std::env::var` in `ee/`), but listed here for completeness so this
# document is the single reference for every configuration option:
#   YORISHIRO_BIND          - Network bind address used by `ee/`'s OAuth redirect URI logic
#   YORISHIRO_LICENSE_KEY   - RSA256-signed licence key for enterprise features (see `ee/services/licence.rs`)

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1). Off in production: it
  # costs performance and puts source paths into your logs.
  pretty_backtrace: false
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Define the logging format. options: compact, pretty or json
  # `json` is the machine-readable one, for a log aggregator.
  format: json

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to).
  # `0.0.0.0`, not `localhost`: inside a container or a VM, a server bound to
  # loopback is unreachable from outside it.
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  # The UI hostname or IP address that mailers will point to.
  # Defaults to localhost for an unconfigured trial instance.
  host: <%= get_env(name="HOST", default="http://localhost") %>
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    # Stamps every request/response with an `x-request-id` header, generating one if the caller sent none.
    # This is the correlation ID that ties a log line to a response.
    request_id:
      enable: true
    # Access logging: method, URI, status, latency, and the request ID above.
    logger:
      enable: true

# Loco's scheduler executes registered tasks as separate processes.
# Run `cargo loco scheduler` in a dedicated process to recover durable dispatch records and interrupted reindexes.
scheduler:
  output: stdout
  jobs:
    worker_dispatch_recovery:
      run: "recover_worker_dispatches"
      schedule: "0 * * * * *"
      run_on_start: true
# SQLite scheduler ownership uses a non-blocking lock file beside the configured database.
# PostgreSQL scheduler replicas use a detached session advisory lock and may run concurrently.
# YORISHIRO_SCHEDULER_REPLICAS is diagnostic compatibility metadata only and is not enforced.

# Yorishiro's registered jobs use tags. Run HTTP and worker processes separately, and start
# workers with the tags they should consume: worker-class:tenant-private, worker-class:official,
# worker-class:shared, and/or infer-fill. Bare --worker, --server-and-worker, and --all pass an
# empty tag list and are unsupported for these jobs.

  
# Queue Configuration
#
# YORISHIRO_QUEUE_KIND picks which of loco-rs's three queue providers boots (Postgres/Sqlite/Redis, QueueConfig's #[serde(tag = "kind")] variants, config/queue.rs): each needs a different set of fields (RedisQueueConfig alone has `queues`; Postgres/SqliteQueueConfig share the SQL-pool knobs but point at different URIs), so a template conditional renders one whole alternative block rather than templating individual fields inside a single fixed shape.
# Derives from DATABASE_URL's scheme so the queue follows the database when neither is set.
# With DATABASE_URL unset, SQLite uses a separate queue file.
# PostgreSQL continues to use DATABASE_URL unless QUEUE_URL is set.
# `Redis` is Loco's provider variant name for Redis-compatible queue services.
# QUEUE_URL takes no default when an external backend is required (Redis, or explicit
# non-SQLite queue), matching this file's own no-silent-fallback convention.
<% if get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Redis" %>
queue:
  kind: Redis
  uri: <%= get_env(name="QUEUE_URL") %>
  dangerously_flush: false
  num_workers: <%= get_env(name="YORISHIRO_QUEUE_WORKERS", default="2") %>
  reaper:
    age_minutes: <%= get_env(name="YORISHIRO_QUEUE_REAPER_AGE_MINUTES", default="30") %>
    interval_seconds: 60
<% elif get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Sqlite" %>
queue:
  kind: Sqlite
  uri: <%= get_env(name="QUEUE_URL", default="sqlite:///var/lib/yorishiro/yorishiro_queue.sqlite3?mode=rwc") %>
  dangerously_flush: false
  num_workers: <%= get_env(name="YORISHIRO_QUEUE_WORKERS", default="1") %>
  reaper:
    age_minutes: <%= get_env(name="YORISHIRO_QUEUE_REAPER_AGE_MINUTES", default="30") %>
    interval_seconds: 60
<% else %>
queue:
  kind: Postgres

  # Postgres connection URI. Commonly the same value as DATABASE_URL.
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="postgres://localhost:5432/yorishiro")) %>
  # Dangerously flush all data in the queue table on startup. dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_flush: false

  # Workers dequeuing in parallel, tunable per deployment.
  # Postgres claims rows with `FOR UPDATE SKIP LOCKED`, so raising this genuinely adds parallelism, and a `--worker` process on another host adds more.
  num_workers: <%= get_env(name="YORISHIRO_QUEUE_WORKERS", default="2") %>

  # Requeues jobs left in `processing` by a worker that died before completing or failing them.
  # Off by default in Loco, which leaves such a job stuck forever: nothing else moves it, since `fail_job` only runs when `perform` actually returns an error.
  # `age_minutes` must exceed the longest a healthy job can legitimately take, or the reaper requeues work still in progress.
  reaper:
    age_minutes: <%= get_env(name="YORISHIRO_QUEUE_REAPER_AGE_MINUTES", default="30") %>
    interval_seconds: 60
<% endif %>

workers:
  mode: BackgroundQueue

settings:
  max_tenants: <%= get_env(name="YORISHIRO_MAX_TENANTS", default="1") %>
  embedding:
    provider: <%= get_env(name="YORISHIRO_EMBEDDING_PROVIDER", default="local") %>
    dimensions: <%= get_env(name="YORISHIRO_EMBEDDING_DIMENSIONS", default="768") %>
    base_url: <%= get_env(name="YORISHIRO_EMBEDDING_BASE_URL", default="") %>
    api_key: '<%= get_env(name="YORISHIRO_EMBEDDING_API_KEY", default="") %>'
    model: <%= get_env(name="YORISHIRO_EMBEDDING_MODEL", default="") %>
    send_dimensions_param: <%= get_env(name="YORISHIRO_EMBEDDING_SEND_DIMENSIONS_PARAM", default="false") %>
    local_model: <%= get_env(name="YORISHIRO_LOCAL_MODEL", default="multilingual-e5-base") %>
    local_max_sequence_length: <%= get_env(name="YORISHIRO_LOCAL_MAX_SEQUENCE_LENGTH", default="512") %>
  rate_limit:
    auth_max_requests: <%= get_env(name="YORISHIRO_AUTH_RATE_LIMIT_MAX", default="10") %>
    auth_window_seconds: <%= get_env(name="YORISHIRO_AUTH_RATE_LIMIT_WINDOW_SECS", default="60") %>
    search_tokens_per_minute: <%= get_env(name="YORISHIRO_SEARCH_TOKENS_PER_MINUTE", default="100000") %>
  db_load_guard:
    threshold: <%= get_env(name="YORISHIRO_DB_LOAD_THRESHOLD", default="0") %>
    sustain_seconds: <%= get_env(name="YORISHIRO_DB_LOAD_SUSTAIN_SECS", default="30") %>
    poll_seconds: <%= get_env(name="YORISHIRO_DB_LOAD_POLL_SECS", default="5") %>
  query_embedding:
    timeout_ms: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_TIMEOUT_MS", default="15000") %>
    poll_interval_ms: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_POLL_INTERVAL_MS", default="100") %>
    retention_seconds: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_RETENTION_SECS", default="300") %>


# Mailer Configuration.
#
# Opt-in: the whole block renders only when MAILER_HOST is set to something non-empty.
# Nothing in this application sends mail today, and `Config.mailer` is an `Option`, so an absent block is a supported state rather than a missing one.
# It has to be a template conditional rather than variables with defaults: `boot.rs` builds an `EmailSender` from this block whenever `smtp.enable` is true and propagates the failure, so a rendered block pointing at a placeholder host would fail the boot immediately.
<% if get_env(name="MAILER_HOST", default="") != "" %>
mailer:
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: <%= get_env(name="MAILER_HOST") %>
    # SMTP server port
    port: <%= get_env(name="MAILER_PORT", default="587") %>
    # Use secure connection (SSL/TLS).
    secure: true
    auth:
      user: <%= get_env(name="MAILER_USER") %>
      password: <%= get_env(name="MAILER_PASSWORD") %>
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:
<% endif %>

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI.
  # Defaults to a local SQLite file for an unconfigured trial instance.
  # Point at PostgreSQL when you need RLS, multi-tenancy, or vector search.
  uri: <%= get_env(name="DATABASE_URL", default="sqlite:///var/lib/yorishiro/yorishiro.sqlite3?mode=rwc") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool. SQLite has a single writer, so it defaults to 10 rather than 100.
  # Serving real traffic on the
  # development default of 1 serializes every request behind one connection.
<% if (get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first) == "sqlite" %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
<% else %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="100") %>
<% endif %>
  # Run migration up when application loaded.
  # Convenient for single-instance deploys. Turn it off if you run more than
  # one instance or migrate as a separate release step, so instances do not
  # race to migrate the same database.
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
#
# Deliberately absent, not merely unset.
# This block configures loco-rs's own JWT support, and this application issues no JWTs: `POST /auth/login` returns a Yorishiro API key, and every authenticated path resolves it through `services::auth`, which never reads `Config.auth`.
# A `JWT_SECRET` here would therefore be a required secret configuring a token type nothing mints or verifies.
# Restore this block only alongside code that actually issues a JWT.
