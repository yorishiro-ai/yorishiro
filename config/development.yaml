# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  # Define the logging format. options: compact, pretty or json
  format: compact
  # `override_filter` rather than loco's default, because this workspace has two application crates and the default admits exactly one.
  # loco builds its filter from a fixed module whitelist plus a single `H::app_name()` entry (`loco-rs-1.1.0/src/logger.rs:192-210`), and both `Hooks` impls return their own `env!("CARGO_CRATE_NAME")`.
  # `yorishiro-server` boots `HostedApp`, so that filter named `yorishiro_hosted` and nothing for `yorishiro_core`: every event from the base crate was dropped, including the embedding worker's warnings and the auth paths, on every paid-edition deployment.
  # Naming only `yorishiro_core` instead is not a fix but the same defect reversed, and it loses the licence line that tells an operator whether their key validated.
  #
  # This replaces loco's whitelist rather than extending it, so the framework's own modules are repeated here: drop `loco_rs` and the queue, routing and `listening on` lines go with it, drop `sea_orm_migration` and migration progress does.
  # It also replaces `level:` above, which loco does not read at all when this is set, so the level is written here per environment rather than templated.
  # Add a crate to this workspace and its name belongs on this line, or it is silent for the same reason with nothing in the symptom to suggest why.
  override_filter: loco_rs=debug,sea_orm_migration=debug,tower_http=debug,sqlx::query=debug,yorishiro_core=debug,yorishiro_hosted=debug

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  # Every Loco app defaults to 5150, so a second one on this machine will
  # collide. Override without editing this file: `PORT=5151 cargo loco start`.
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to)
  binding: <%= get_env(name="BINDING", default="localhost") %>
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    # Stamps every request/response with an `x-request-id` header, generating one if the caller sent none.
    # This is the correlation ID that ties a log line to a response.
    request_id:
      enable: true
    # Access logging: method, URI, status, latency, and the request ID above.
    logger:
      enable: true

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundQueue

  
# Queue Configuration
#
# YORISHIRO_QUEUE_KIND picks which of loco-rs's three queue providers boots (Postgres/Sqlite/Redis, QueueConfig's #[serde(tag = "kind")] variants, config/queue.rs): each needs a different set of fields (RedisQueueConfig alone has `queues`; Postgres/SqliteQueueConfig share the SQL-pool knobs but point at different URIs), so a template conditional renders one whole alternative block rather than templating individual fields inside a single fixed shape.
# The default is derived from DATABASE_URL's scheme rather than fixed, so the queue follows the database whichever one an operator points at.
# Unset, that is SQLite on both sides and an unconfigured start needs nothing installed.
# With DATABASE_URL naming a PostgreSQL instance, the queue defaults to Postgres too.
# Fixing it to Sqlite instead would have silently moved every existing PostgreSQL deployment's queue to a local file, since none of the launch paths here set YORISHIRO_QUEUE_KIND: not the Makefile, not ci.yml, not test/'s compose.
# Setting the variable explicitly still overrides the derivation in either direction.
#
# The chain converts only `postgres` and `sqlite`, and that asymmetry is deliberate rather than an omission to tidy up.
# With YORISHIRO_QUEUE_KIND unset, reaching the SQLite branch requires the derived value to equal `Sqlite` exactly, so every scheme the chain does not convert falls through to Postgres: `postgresql://` renders `Postgresql`, `mysql://` renders `mysql`, an unset DATABASE_URL renders `sqlite` from its own default, and only the last of those reaches SQLite.
# Verified by boot rather than by reading: `postgresql://` and `mysql://` each create no SQLite queue file.
# So adding `postgresql` to the conversion would change nothing, and the fallthrough is what makes an unanticipated scheme fail towards the shared backend rather than towards a local file no separate worker can see.
<% if get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Redis" %>
queue:
  kind: Redis
  uri: <%= get_env(name="QUEUE_URL", default="redis://localhost:6379") %>
  dangerously_flush: false
  num_workers: 2
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% elif get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Sqlite" %>
queue:
  kind: Sqlite

  # Shares DATABASE_URL's file rather than taking one of its own, so an unconfigured start leaves one file behind instead of two.
  # Safe rather than merely tidy: both providers open independent connection pools whether or not they name the same file, so sharing costs nothing (config/sqlite.yaml carries the lock-contention measurement).
  # Falling back to DATABASE_URL also means pointing the database somewhere else moves the queue with it, the same way the Postgres branch below already behaves.
  #
  # The fallback is guarded on DATABASE_URL naming SQLite, because reaching this branch does not imply that it does: YORISHIRO_QUEUE_KIND=Sqlite selects it whatever the database is.
  # Unguarded, that pairing handed a `postgres://` URI to SqliteConnectOptions and boot died with `SqliteError code 14: unable to open database file`, which is a combination that worked before the fallback existed.
  # The Postgres branch needs no such guard only because its own literal is a `postgres://` one; the symmetry between the branches is in their shape, not in their safety.
  # An `if`/`else` rather than a conditional expression because Tera here has no ternary filter, not because the branch needed four lines.
  # Reproducing this needs a *reachable* PostgreSQL: pointed at an unreachable one, boot dies on the database with `PoolTimedOut` before the queue provider is built at all, so guarded and unguarded look identical.
<% if get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first == "sqlite" %>
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="sqlite://yorishiro.sqlite3?mode=rwc")) %>
<% else %>
  uri: <%= get_env(name="QUEUE_URL", default="sqlite://yorishiro.sqlite3?mode=rwc") %>
<% endif %>
  dangerously_flush: false
  num_workers: 2
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% else %>
queue:
  kind: Postgres

  # QUEUE_URL overrides where this reads; unset, it falls back to the same DATABASE_URL the application itself connects to (database.uri below), so a deployment that sets DATABASE_URL needs only one database running.
  #
  # The innermost literal no longer matches database.uri's, and cannot: this file's database default is SQLite and a Postgres queue cannot use a `sqlite://` URI.
  # An earlier version of this comment required the two literals to match, after they drifted apart once (queue.uri kept an unrenamed `loco_development` scaffold default while database.uri had been renamed), pointing the queue at a database the application never connected to.
  # That requirement described a file where both sides defaulted to Postgres, and it stopped being satisfiable when the database side moved to SQLite.
  #
  # This branch itself is an ordinary path, reached whenever DATABASE_URL names a PostgreSQL instance, whether or not YORISHIRO_QUEUE_KIND is set: the derivation above sends the queue wherever the database went, and QUEUE_URL then falls back to DATABASE_URL, so both sides land on the same instance and this literal is never consulted.
  # Reaching the literal takes YORISHIRO_QUEUE_KIND=Postgres set deliberately while DATABASE_URL is left unset, which asks for a Postgres queue alongside a SQLite database and is a misconfiguration rather than a supported path.
  # That is left failing rather than papered over, matching production.yaml's own no-silent-fallback stance.
  # Measured: the boot dies on `Any(Sqlx(PoolTimedOut))` when the queue cannot reach Postgres, and leaves an empty `yorishiro.sqlite3` behind (4 KiB, zero tables): the queue pool is built before migrations run, so the file is created by opening a connection and nothing is written into it.
  # It is a harmless artifact to delete rather than a half-initialized database, and a corrected boot migrates it from scratch.
  # Set DATABASE_URL alongside YORISHIRO_QUEUE_KIND=Postgres, which is what any deployment actually using a Postgres queue already does.
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/yorishiro-core_development")) %>
  # Dangerously flush all data in the queue table on startup. dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_flush: false

  # Workers dequeuing in parallel. Postgres claims rows with `FOR UPDATE SKIP LOCKED`, so raising this genuinely adds parallelism here, unlike on SQLite where `BEGIN IMMEDIATE` serializes every dequeue regardless of this number.
  num_workers: 2

  # Requeues jobs left in `processing` by a worker that died before completing or failing them.
  # Off by default in Loco, which leaves such a job stuck forever: nothing else moves it, since `fail_job` only runs when `perform` actually returns an error.
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% endif %>


# Mailer Configuration.
mailer:
  # Sending mail in development needs something listening on the port below.
  # Run a local catcher — mailpit, MailHog or maildev all default to SMTP on
  # 1025 with a web inbox on 8025 — e.g. `docker run -p 1025:1025 -p 8025:8025
  # axllent/mailpit`, then read the mail at http://localhost:8025.
  # Prefer not to run one? Set `stub: true` here (as `config/test.yaml` does)
  # to record deliveries in memory instead of sending them.
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    # SMTP server port
    port: 1025
    # Use secure connection (SSL/TLS).
    secure: false
    # auth:
    #   user:
    #   password:
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI
  # SQLite by default so a clone with nothing configured boots and works.
  # Point DATABASE_URL at Postgres for anything needing RLS, multi-tenancy or vector search, none of which this backend has; docs/sqlite.md has the boundary.
  # Every existing Postgres consumer already sets DATABASE_URL explicitly (the Makefile, ci.yml, test/'s compose, the release smoke job), so this default lands on none of them.
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://yorishiro.sqlite3?mode=rwc") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="50") %>
  # Run migration up when application loaded
  auto_migrate: true
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification
    secret: p61ncQ4lhkoRR923aP7b
    # Token expiration time in seconds
    expiration: 604800 # 7 days
    # Where to read the token from. Omitted => `Authorization: Bearer <token>`.
    # A cookie or query parameter is a single map with a `from:` tag:
    #
    # location:
    #   from: Cookie
    #   name: auth_token
    #
    # `from:` is one of Bearer, Cookie, Query. Cookie and Query also take a
    # `name:`. A YAML list of these tries each in order and uses the first
    # that yields a token. See https://loco.rs/docs/how-to/jwt-locations
