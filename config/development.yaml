# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  # loco applies this to its own module whitelist plus this application, which its default filter
  # admits because there is one application crate. Setting `override_filter` below would make this
  # key inert: loco does not read `level` at all when that is set.
  # `RUST_LOG` overrides everything here when set: loco tries `EnvFilter::try_from_default_env()`
  # before reading this file at all (`logger.rs:193`), so a platform that injects `RUST_LOG` silences
  # this application unless that variable names it too.
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Define the logging format. options: compact, pretty or json
  format: compact

# Web server configuration
server:
  # Port on which the server listens, on the interface selected by BINDING.
  # Every Loco app defaults to 5150, so a second one on this machine will
  # collide. Override without editing this file: `PORT=5151 cargo loco start`.
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to)
  binding: <%= get_env(name="BINDING", default="localhost") %>
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    cors:
      enable: true
      # JSON array of exact browser origins, shared by REST and MCP.
      allow_origins: <%= get_env(name="YORISHIRO_ALLOWED_ORIGINS", default="[]") %>
      allow_headers: [Authorization, Content-Type, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID]
      allow_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      expose_headers: [Mcp-Session-Id, MCP-Protocol-Version, X-Request-Id]
    # Stamps every request/response with an `x-request-id` header, generating one if the caller sent none.
    # This is the correlation ID that ties a log line to a response.
    request_id:
      enable: true
    # Access logging: method, URI, status, latency, and the request ID above.
    logger:
      enable: true

# Scheduler Configuration
#
# Runs registered tasks or shell commands on a recurring schedule.
# `cargo loco scheduler` starts the scheduler daemon.
# English syntax ("every 15 seconds") and cron expressions are both supported.
# PostgreSQL scheduler replicas coordinate with a detached session advisory lock.
# SQLite uses a non-blocking `.scheduler.lock` file beside the database URI's file.
scheduler:
  output: stdout      # stdout | silent (default for all jobs)
  jobs:
    tenant_reindex_scheduler:
      run: "tenant_reindex_scheduler"
      schedule: "0 * * * * *"
      run_on_start: true
    worker_dispatch_recovery:
      run: "recover_worker_dispatches"
      schedule: "0 * * * * *"
      run_on_start: true

# Run HTTP and worker processes separately. Start a worker with an explicit target, such as
# --worker=worker-target:shared. Official and tenant workers need their own selected targets.
# Bare --worker, --server-and-worker, and --all are rejected.

  
# Queue Configuration
#
# YORISHIRO_QUEUE_KIND selects Redis, Sqlite or Postgres.
# Without an explicit kind, the template selects SQLite for sqlite:// and PostgreSQL otherwise.
# SQL queue pool settings are declared explicitly alongside database settings.
<% if get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Redis" %>
queue:
  kind: Redis
  uri: <%= get_env(name="QUEUE_URL", default="redis://localhost:6379") %>
  dangerously_flush: false
  num_workers: 2
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% elif get_env(name="YORISHIRO_QUEUE_KIND", default=(get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first | replace(from="postgres", to="Postgres") | replace(from="sqlite", to="Sqlite"))) == "Sqlite" %>
queue:
  kind: Sqlite

  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="50") %>

  # Keep the queue in a separate file from the application database.
  # Two SQLite connection pools sharing one file can block dequeue transactions.
  uri: <%= get_env(name="QUEUE_URL", default="sqlite://yorishiro_queue.sqlite3?mode=rwc") %>

  dangerously_flush: false
  num_workers: 1
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% else %>
queue:
  kind: Postgres

  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="50") %>

  # Use QUEUE_URL when set, otherwise use the application DATABASE_URL.
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/yorishiro_development")) %>
  # Dangerously flush all data in the queue table on startup. dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_flush: false

  # Workers dequeuing in parallel. Postgres claims rows with `FOR UPDATE SKIP LOCKED`, so raising this genuinely adds parallelism here, unlike on SQLite where `BEGIN IMMEDIATE` serializes every dequeue regardless of this number.
  num_workers: 2

  # Requeues jobs left in `processing` by a worker that died before completing or failing them.
  # Off by default in Loco, which leaves such a job stuck forever: nothing else moves it, since `fail_job` only runs when `perform` actually returns an error.
  reaper:
    age_minutes: 10
    interval_seconds: 60
<% endif %>

workers:
  mode: BackgroundQueue

settings:
  # Deployment routing declaration, not live worker discovery.
  worker_targets: <%= get_env(name="YORISHIRO_WORKER_TARGETS", default='["worker-target:shared"]') %>
  timezone: <%= get_env(name="YORISHIRO_TIMEZONE", default="UTC") %>
  max_tenants: <%= get_env(name="YORISHIRO_MAX_TENANTS", default="1") %>
  mcp:
    allowed_hosts: "<%= get_env(name="YORISHIRO_MCP_ALLOWED_HOSTS", default="") %>"
  embedding:
    provider: <%= get_env(name="YORISHIRO_EMBEDDING_PROVIDER", default="local") %>
    dimensions: <%= get_env(name="YORISHIRO_EMBEDDING_DIMENSIONS", default="768") %>
    base_url: <%= get_env(name="YORISHIRO_EMBEDDING_BASE_URL", default="") %>
    api_key: '<%= get_env(name="YORISHIRO_EMBEDDING_API_KEY", default="") %>'
    model: <%= get_env(name="YORISHIRO_EMBEDDING_MODEL", default="") %>
    send_dimensions_param: <%= get_env(name="YORISHIRO_EMBEDDING_SEND_DIMENSIONS_PARAM", default="false") %>
    provider_concurrency: <%= get_env(name="YORISHIRO_EMBEDDING_PROVIDER_CONCURRENCY", default="1") %>
    local_model: <%= get_env(name="YORISHIRO_LOCAL_MODEL", default="multilingual-e5-base") %>
    local_max_sequence_length: <%= get_env(name="YORISHIRO_LOCAL_MAX_SEQUENCE_LENGTH", default="512") %>
  rate_limit:
    auth_max_requests: <%= get_env(name="YORISHIRO_AUTH_RATE_LIMIT_MAX", default="10") %>
    auth_window_seconds: <%= get_env(name="YORISHIRO_AUTH_RATE_LIMIT_WINDOW_SECS", default="60") %>
    search_tokens_per_minute: <%= get_env(name="YORISHIRO_SEARCH_TOKENS_PER_MINUTE", default="100000") %>
  db_load_guard:
    threshold: <%= get_env(name="YORISHIRO_DB_LOAD_THRESHOLD", default="0") %>
    sustain_seconds: <%= get_env(name="YORISHIRO_DB_LOAD_SUSTAIN_SECS", default="30") %>
    poll_seconds: <%= get_env(name="YORISHIRO_DB_LOAD_POLL_SECS", default="5") %>
  dispatch:
    poll_interval_ms: <%= get_env(name="YORISHIRO_DISPATCH_POLL_INTERVAL_MS", default="500") %>
    claim_lease_seconds: <%= get_env(name="YORISHIRO_DISPATCH_CLAIM_LEASE_SECS", default="30") %>
    enqueue_timeout_ms: <%= get_env(name="YORISHIRO_DISPATCH_ENQUEUE_TIMEOUT_MS", default="5000") %>
  query_embedding:
    timeout_ms: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_TIMEOUT_MS", default="15000") %>
    poll_interval_ms: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_POLL_INTERVAL_MS", default="100") %>
    retention_seconds: <%= get_env(name="YORISHIRO_QUERY_EMBEDDING_RETENTION_SECS", default="300") %>


# Mailer Configuration.
mailer:
  # Sending mail in development needs something listening on the port below.
  # Run a local catcher — mailpit, MailHog or maildev all default to SMTP on
  # 1025 with a web inbox on 8025 — e.g. `docker run -p 1025:1025 -p 8025:8025
  # axllent/mailpit`, then read the mail at http://localhost:8025.
  # Test environments omit this provider block rather than sending mail.
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    # SMTP server port
    port: 1025
    # Use secure connection (SSL/TLS).
    secure: false
    # auth:
    #   user:
    #   password:
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI
  # SQLite by default so a clone with nothing configured boots and works.
  # Point DATABASE_URL at Postgres for anything needing RLS, multi-tenancy or vector search, none of which this backend has.
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://yorishiro.sqlite3?mode=rwc") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="50") %>
  # Run migration up when application loaded
  auto_migrate: true
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification
    secret: p61ncQ4lhkoRR923aP7b
    # Token expiration time in seconds
    expiration: 604800 # 7 days
    # Where to read the token from. Omitted => `Authorization: Bearer <token>`.
    # A cookie or query parameter is a single map with a `from:` tag:
    #
    # location:
    #   from: Cookie
    #   name: auth_token
    #
    # `from:` is one of Bearer, Cookie, Query. Cookie and Query also take a
    # `name:`. A YAML list of these tries each in order and uses the first
    # that yields a token. See https://loco.rs/docs/how-to/jwt-locations

initializers:
  plan_policy_enabled: '<%= get_env(name="YORISHIRO_PLAN_POLICY_ENABLED", default="false") %>'
  worker_admission:
    shared: '<%= get_env(name="YORISHIRO_WORKER_CLASS_SHARED_LIMIT", default="") %>'
    tenant_private: '<%= get_env(name="YORISHIRO_WORKER_CLASS_TENANT_PRIVATE_LIMIT", default="") %>'
    official: '<%= get_env(name="YORISHIRO_WORKER_OFFICIAL_LIMIT", default="") %>'
  stripe:
    webhook_secret: '<%= get_env(name="YORISHIRO_STRIPE_WEBHOOK_SECRET", default="") %>'
    price_pro: '<%= get_env(name="YORISHIRO_STRIPE_PRICE_PRO", default="") %>'
    price_team: '<%= get_env(name="YORISHIRO_STRIPE_PRICE_TEAM", default="") %>'
  oauth:
    issuer_url: '<%= get_env(name="YORISHIRO_OAUTH_ISSUER_URL", default="") %>'
    client_id: '<%= get_env(name="YORISHIRO_OAUTH_CLIENT_ID", default="") %>'
    client_secret: '<%= get_env(name="YORISHIRO_OAUTH_CLIENT_SECRET", default="") %>'
    redirect_uri: '<%= get_env(name="YORISHIRO_OAUTH_REDIRECT_URI", default="") %>'
  licence_key: '<%= get_env(name="YORISHIRO_LICENSE_KEY", default="") %>'
