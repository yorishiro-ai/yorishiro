# Manual acceptance environment for the SQLite tier (see docs/sqlite.md): boots the app against a
# SQLite file directly, LOCO_ENV=sqlite. Not wired into any test suite — `tests/` stays
# PostgreSQL-only (request_with_create_db issues `CREATE DATABASE`, which SQLite has no
# equivalent for) — this file exists for `cargo loco start -e sqlite`-style manual verification.
#
# YORISHIRO_MAX_TENANTS must still be set (to any value) for POST /setup to answer as enabled:
# setup.rs's wizard_enabled() checks only that the variable is set, not its value: the SQLite cap
# of 1 is enforced separately by tenancy::create_tenant regardless of what this variable says.

logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact
  # `override_filter` rather than loco's default, because this workspace has two application crates and the default admits exactly one.
  # loco builds its filter from a fixed module whitelist plus a single `H::app_name()` entry (`loco-rs-1.1.0/src/logger.rs:192-210`), and both `Hooks` impls return their own `env!("CARGO_CRATE_NAME")`.
  # `yorishiro-server` boots `HostedApp`, so that filter named `yorishiro_hosted` and nothing for `yorishiro_core`: every event from the base crate was dropped, including the embedding worker's warnings and the auth paths, on every paid-edition deployment.
  # Naming only `yorishiro_core` instead is not a fix but the same defect reversed, and it loses the licence line that tells an operator whether their key validated.
  #
  # This replaces loco's whitelist rather than extending it, so the framework's own modules are repeated here: drop `loco_rs` and the queue, routing and `listening on` lines go with it, drop `sea_orm_migration` and migration progress does.
  # It also replaces `level:` above, which loco does not read at all when this is set, so the level is written here per environment rather than templated.
  # Add a crate to this workspace and its name belongs on this line, or it is silent for the same reason with nothing in the symptom to suggest why.
  # `RUST_LOG` overrides this entirely when set: loco tries `EnvFilter::try_from_default_env()` before reading this key at all (`logger.rs:193`), so a platform that injects `RUST_LOG` restores the silence described above while this file still says otherwise. Measured: `RUST_LOG=loco_rs=info` against this config gives zero lines from either application crate.
  override_filter: loco_rs=debug,sea_orm_migration=debug,tower_http=debug,sqlx::query=debug,yorishiro_core=debug,yorishiro_hosted=debug

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost
  middlewares:
    request_id:
      enable: true
    logger:
      enable: true

# BackgroundQueue, matching development.yaml/production.yaml: loco-rs's SQLite queue provider
# (bgworker::sqlt) is not a gap the way an earlier version of this comment claimed — it is under
# the same `worker` feature `pg.rs`'s Postgres provider is, `worker` is loco-rs's own default
# feature, and it already ships a SqliteQueueConfig (config/queue.rs). Empirically confirmed
# (`sqlt_loco_queue` auto-creates on `setup()`, enqueue/dequeue round-trip) against a real SQLite
# file before this config was written, including the contention case that matters here: this
# provider opens its own `sqlx::SqlitePool` independent of the application's own SQLite
# connection (`ctx.db`), so writing a job while the app holds an open write transaction on the
# same file is a real possibility, not merely a hypothetical one. Measured directly: a concurrent
# write from the queue pool waits out sqlx's own 5-second default `busy_timeout` and succeeds once
# the app's transaction releases the lock, rather than failing. In this codebase specifically, the
# actual call site (`controllers::entities::enqueue_embedding_sync`) only runs after
# `Authorized::commit()` has already returned, so the write it triggers never overlaps a still-open
# app transaction from the same request in the first place; the busy_timeout headroom only matters
# for a genuinely concurrent second request, and content_entities::create's own transaction is one
# fast INSERT, well under the 5-second budget.
workers:
  mode: BackgroundQueue

# Queue Configuration
#
# `kind: Sqlite` shares `DATABASE_URL`'s file rather than taking one of its own, so an unconfigured start creates one file instead of two.
# That is safe rather than merely tidy, and the reason is the measurement this comment used to carry as an argument for splitting them: both providers open independent connection pools regardless of whether they name the same file or different ones, so sharing costs nothing beyond the lock contention already measured above.
# Splitting them bought one less thing for a reader to reason about when checking a lock contention scenario, which is a real but smaller benefit than a first run leaving a single file behind.
# `QUEUE_URL` still points the queue somewhere else for anyone who wants them separate.
# The fallback is guarded on DATABASE_URL naming SQLite: this environment defaults to a SQLite database but an operator can point DATABASE_URL at PostgreSQL, and an unguarded fallback would hand that URI to the SQLite queue provider and fail boot.
queue:
  kind: Sqlite
<% if get_env(name="DATABASE_URL", default="sqlite://") | split(pat="://") | first == "sqlite" %>
  uri: <%= get_env(name="QUEUE_URL", default=get_env(name="DATABASE_URL", default="sqlite://yorishiro-sqlite.sqlite3?mode=rwc")) %>
<% else %>
  uri: <%= get_env(name="QUEUE_URL", default="sqlite://yorishiro-sqlite.sqlite3?mode=rwc") %>
<% endif %>
  dangerously_flush: false
  num_workers: 2
  reaper:
    age_minutes: 10
    interval_seconds: 60

mailer:
  stub: true
  smtp:
    enable: true
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    port: 1025
    secure: false

database:
  # A bare `sqlite://path` is relative to the process's CWD; an absolute path avoids surprises
  # depending on where `cargo loco start` is run from.
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://yorishiro-sqlite.sqlite3?mode=rwc") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: sqliteTierManualVerification
    expiration: 604800
