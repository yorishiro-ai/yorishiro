# Editor clients can override these settings through LSP configuration.

[cargo]
# Analyze the base and the enterprise overlay together.
features = ["enterprise"]
extraArgs = ["--locked"]
# Include integration tests in editor checks.
allTargets = true

[check]
# Run Clippy on save instead of `cargo check`.
command = "clippy"
# Inherit Cargo targets and features and treat warnings as errors.
extraArgs = ["--", "-D", "warnings"]

[imports]
# Group auto-imports by module and use `crate::` for local paths.
group.enable = true
granularity.group = "module"
prefix = "crate"
granularity.enforce = true

[diagnostics]
# Report rust-analyzer's own style lints alongside Clippy.
styleLints.enable = true
