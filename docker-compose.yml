# Runs the built binary from the Dockerfile at the repository root, the same image used for
# distribution.
#
#   docker compose up --build
#
# The queue uses the Redis protocol and jobs run in a separate `worker` container from the
# same image: `start` serves HTTP only and consumes nothing, so without the worker every queued
# job (embedding sync, reindex, infer-fill) would sit in the queue.
#
# The database credentials here are development ones. A deployment sets its own through the
# environment.

# One image and one configuration for the server and the worker, so they cannot disagree about
# the database, the queue, or the embedding provider.
x-yorishiro: &yorishiro
  image: ${IMAGE:-yorishiro}:${TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      EDITION: ${EDITION:-ee}
  environment: &yorishiro-environment
    # These override the embedded/example defaults. Mount a complete administrator-owned
    # /app/config/production.yaml or production.local.yaml when file configuration is needed.
    DATABASE_URL: postgres://yorishiro:yorishiro@db:5432/yorishiro
    # `Redis` selects Loco's Redis-compatible queue provider. Without it the
    # queue kind follows DATABASE_URL's scheme and lands on Postgres.
    YORISHIRO_QUEUE_KIND: Redis
    QUEUE_URL: redis://redis:6379
    HOST: http://localhost:5150
    # The image default is loopback-safe; compose publishes the port, so opt into container access.
    BINDING: 0.0.0.0
    LOG_LEVEL: info
    # Explicitly retain the packaged default: run the local embedding provider and fetch its
    # model into the container cache when no read-only model mount is supplied.
    # `YORISHIRO_EMBEDDING_PROVIDER=none docker compose up` skips the model download.
    YORISHIRO_EMBEDDING_PROVIDER: ${YORISHIRO_EMBEDDING_PROVIDER:-local}
    # Also the binary's own default: `src/bin/main.rs` sets YORISHIRO_MAX_TENANTS to "1" when
    # it is unset, which is what keeps the first-run setup wizard reachable. Set it to "0" for
    # multiple tenants, which turns that wizard off.
    YORISHIRO_MAX_TENANTS: "1"

services:
  db:
    image: &postgres-image pgvector/pgvector:pg18
    # Reap orphan children outside PostgreSQL so their exit cannot trigger cluster recovery.
    init: true
    container_name: db
    environment:
      POSTGRES_USER: yorishiro
      POSTGRES_PASSWORD: yorishiro
      POSTGRES_DB: yorishiro
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, only against an empty data directory.
      # pgvector isn't part of contrib, so a non-superuser (the migrating role) can't CREATE EXTENSION it later, and a fresh volume needs it before the migrator's content_entities.embedding column can be created.
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yorishiro"]
      interval: 5s
      timeout: 3s
      retries: 5

  testdb:
    image: *postgres-image
    init: true
    container_name: testdb
    environment:
      POSTGRES_USER: yorishiro
      POSTGRES_PASSWORD: yorishiro
      POSTGRES_DB: yorishiro
    volumes:
      - test_pgdata:/var/lib/postgresql
      # Runs once, only against an empty data directory.
      # pgvector isn't part of contrib, so a non-superuser (the migrating role) can't CREATE EXTENSION it later, and a fresh volume needs it before the migrator's content_entities.embedding column can be created.
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yorishiro"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    image: valkey/valkey:9.1.2
    container_name: redis
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  app:
    <<: *yorishiro
    container_name: app
    # Allow first-start model download; set YORISHIRO_EMBEDDING_PROVIDER=none to skip local inference.
    healthcheck:
      start_period: 15m
    # To use a model this machine already has, put `model.safetensors` and `tokenizer.json` in
    # `models/<short_id>/` and add:
    #
    #   volumes:
    #     - ./models:/app/models:ro
    #
    # Without a mount, the provider downloads verified files into /app/models on first use.
    # A read-only mount must contain both files.
    ports:
      - "5150:5150"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *yorishiro
    container_name: worker
    # The worker serves the shared target. To serve others, list them after `--worker=`, separated by
    # commas (`worker-target:official`, `worker-target:tenant:<tenant-id>`), or add a service for them.
    command: ["start", "--worker=worker-target:shared"]
    # The image's HEALTHCHECK curls the HTTP server, which a worker does not run, so it would be
    # reported unhealthy forever.
    healthcheck:
      disable: true
    # After the server is healthy, which is after it has applied the migrations the worker needs.
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs:
    <<: *yorishiro
    container_name: jobs
    # The worker serves the shared target. To serve others, list them after `--worker=`, separated by
    # commas (`job-target:official`, `job-target:tenant:<tenant-id>`), or add a service for them.
    command: ["start", "--worker=job-target:shared"]
    # The image's HEALTHCHECK curls the HTTP server, which a worker does not run, so it would be
    # reported unhealthy forever.
    healthcheck:
      disable: true
    # After the server is healthy, which is after it has applied the migrations the worker needs.
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *yorishiro
    container_name: scheduler
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  test_pgdata:
