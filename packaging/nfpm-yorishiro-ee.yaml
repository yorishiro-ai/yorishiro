# The default package. Contains the paid features, which stay inactive until a licence key is
# set -- the same arrangement GitLab's `-ee` package has, and the one to install unless you
# specifically need no proprietary code on the machine.
name: yorishiro-ee
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Yorishiro Contributors <noreply@yotsunagi.dev>
description: |
  An MCP-native, multi-tenant knowledge store with user-defined schemas.
  Includes the paid features (billing, SSO, marketplace, LLM-backed fill) and the web UI.
  Those stay disabled until YORISHIRO_LICENSE_KEY is set; everything else works without one.
vendor: Yotsunagi
homepage: https://github.com/yotsunagi/yorishiro
license: BUSL-1.1 AND LicenseRef-Yorishiro-EE

depends:
  - ca-certificates

# The binary needs glibc 2.38 and GLIBCXX_3.4.30 or newer, which the onnxruntime that `ort`
# links imposes -- not our own code. Declared so the package manager refuses on a system that
# cannot run it, rather than installing happily and failing at first start. Verified: without
# these, the rpm installs on Rocky 9 (glibc 2.34) and then dies on a missing symbol.
overrides:
  deb:
    depends:
      - ca-certificates
      - libstdc++6 (>= 12)
      - libc6 (>= 2.38)
  rpm:
    depends:
      - ca-certificates
      - libstdc++ >= 12
      - libc.so.6(GLIBC_2.38)(64bit)
      - libstdc++.so.6(GLIBCXX_3.4.30)(64bit)

# Conflicts rather than Replaces: the two editions install the same unit name and state
# directory, so having both would leave two services fighting over one database.
conflicts:
  - yorishiro-ce

contents:
  - src: ./target/release/yorishiro-server
    dst: /usr/bin/yorishiro-server
  - src: ./packaging/yorishiro.service
    dst: /lib/systemd/system/yorishiro.service
  # In /etc rather than /usr/share/doc: the same dpkg `path-exclude` that drops LICENSE would
  # drop this, and an example configuration is only useful if it is next to the real one.
  - src: ./config.example.yml
    dst: /etc/yorishiro/config.example.yml
    type: config
  # `copyright` rather than `LICENSE`: Debian policy names it that, and minimal images
  # (including the official ubuntu/debian containers) carry a dpkg `path-exclude` for
  # `/usr/share/doc/*` with a `path-include` for `copyright` alone -- a file called LICENSE is
  # silently dropped on exactly the systems most likely to be used for a deployment.
  - src: ./LICENSE
    dst: /usr/share/doc/yorishiro-ee/copyright
  # The paid licence in /etc for the same reason as the example config above, and not as
  # `copyright.ee`: the `path-include` covers the name `copyright` exactly, so this shipped
  # inside the package and was deleted at unpack on every minimal image -- the enterprise
  # edition delivering everything except the licence it is distributed under.
  - src: ./ee/LICENSE
    dst: /etc/yorishiro/LICENSE.enterprise

scripts:
  preinstall: ./packaging/preinstall.sh
  postinstall: ./packaging/postinstall.sh
