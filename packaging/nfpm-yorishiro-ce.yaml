# The community package: BUSL-1.1 only, no code from `ee/` on disk, and therefore headless --
# the web UI belongs to the paid edition. Install this only if that is a requirement; the
# `yorishiro` package is a superset and is what most deployments want.
name: yorishiro-ce
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Yorishiro Contributors <noreply@yotsunagi.dev>
description: |
  An MCP-native, multi-tenant knowledge store with user-defined schemas.
  Community edition: REST API, MCP server and admin CLI, with no paid features and no web UI.
  Contains no proprietary code.
vendor: Yotsunagi
homepage: https://github.com/yotsunagi/yorishiro
license: BUSL-1.1

depends:
  - ca-certificates

# The binary needs glibc 2.38 and GLIBCXX_3.4.30 or newer, which the onnxruntime that `ort`
# links imposes -- not our own code. Declared so the package manager refuses on a system that
# cannot run it, rather than installing happily and failing at first start. Verified: without
# these, the rpm installs on Rocky 9 (glibc 2.34) and then dies on a missing symbol.
overrides:
  deb:
    depends:
      - ca-certificates
      - libstdc++6 (>= 12)
      - libc6 (>= 2.38)
  rpm:
    depends:
      - ca-certificates
      - libstdc++ >= 12
      - libc.so.6(GLIBC_2.38)(64bit)
      - libstdc++.so.6(GLIBCXX_3.4.30)(64bit)

# Conflicts rather than Replaces: the two editions would install services pointing at one
# database, and the point of this package is that the other one's code is absent.
conflicts:
  - yorishiro-ee

contents:
  - src: ./target/release/yorishiro-ce-server
    dst: /usr/bin/yorishiro-server
  - src: ./packaging/yorishiro.service
    dst: /lib/systemd/system/yorishiro.service
  # In /etc rather than /usr/share/doc: the same dpkg `path-exclude` that drops LICENSE would
  # drop this, and an example configuration is only useful if it is next to the real one.
  - src: ./config.example.yml
    dst: /etc/yorishiro/config.example.yml
    type: config
  # See the note in nfpm-yorishiro-ee.yaml: `copyright` is the name dpkg's default
  # `path-include` keeps when `/usr/share/doc/*` is excluded.
  - src: ./LICENSE
    dst: /usr/share/doc/yorishiro-ce/copyright

scripts:
  preinstall: ./packaging/preinstall.sh
  postinstall: ./packaging/postinstall.sh
