[workspace]
resolver = "2"
# ".": this manifest is both the workspace root and the base package (yorishiro-core), the flat
# layout this session's CLAUDE.md records as decided-2026-08-22, not carried forward from
# master's crates/ split. ee/crates/yorishiro-hosted depends on it by path; the reverse
# dependency must never appear, see CLAUDE.md's "Editions and the ee/ boundary".
members = [".", "ee/crates/yorishiro-hosted"]

[package]
name = "yorishiro-core"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "yorishiro_core-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
# Depended on identically (version and, where they take any, features) by both the root package
# and ee/crates/yorishiro-hosted; each side pulls these with `workspace = true` rather than
# repeating the specification, so the two can't drift out of sync the way loco-rs's version did
# before this table existed.
#
# `worker` used to be listed explicitly here; it is loco-rs's own default and was never doing
# anything (`default-features = false` is not set), so the explicit listing read as "deliberately
# enabled" when it was actually just the default, which invited exactly that misreading. Dropped
# rather than kept-with-a-comment, since there is nothing this crate does to make it deliberate.
#
# `worker_redis` is enabled: `queue.kind` (config/{development,production}.yaml) is now
# environment-switchable, and `Redis`/Valkey is one of the three values it accepts, so the queue
# provider needs to be compiled in regardless of which one an operator picks at boot, not only the
# `kind: Postgres` this deployment happens to default to. Without this feature, booting with
# `kind: Redis` set fails at startup with "No queue provider feature was selected and compiled".
# It is not loco-rs's own default (unlike `worker`), and pulls in the `redis` crate plus five more
# transitive dependencies (combine, num-bigint, arcstr, sha1_smol, xxhash-rust; Cargo.lock grew
# from 1154 to 1181 lines when this was first measured).
loco-rs = { version = "1.1", features = ["worker_redis"] }
anyhow = { version = "1" }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
chrono = { version = "0.4" }
rand = { version = "0.9" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serial_test = { version = "3.1.1" }
sha2 = { version = "0.10" }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread"] }
tracing = { version = "0.1" }
# sea-orm and uuid take different feature sets on each side (root needs sqlx-sqlite/postgres-vector
# and uuid's v7 that ee/ does not use directly), so the table carries the union of what either side
# needs rather than the root's own narrower requirement. This does not cost ee/ anything at build
# time: Cargo resolves one crate's features as the union across the whole workspace regardless of
# which member's manifest declares which subset, so ee/'s build already carried this same union
# before this table existed; only the declaration was split across two files, not the resolved set.
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "postgres-vector",
] }
uuid = { version = "1.6", features = ["v4", "v7"] }

[dependencies]
loco-rs = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm.workspace = true
chrono.workspace = true
validator = { version = "0.20" }
uuid.workspace = true
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
# Raw pool for RLS session-state handling: Loco's own ConnectOptions has no after_connect/
# after_release hook, so this stays a hand-built sqlx pool beside SeaORM's DatabaseConnection.
# See https://github.com/yotsunagi/yorishiro/issues/221.
sqlx.workspace = true
thiserror = { version = "2" }
anyhow.workspace = true
rand.workspace = true
sha2.workspace = true
sea-query = { version = "1.0" }
jsonschema = { version = "0.49" }
rmcp = { version = "3.0.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
# OpenAI-compatible embedding provider (services::embedding::openai): talks to LM Studio/Ollama/
# vLLM/real OpenAI over HTTP.
reqwest.workspace = true
# Local ONNX embedding provider (services::embedding::onnx). Note: `ort`'s default
# download-binaries feature makes `cargo check`/`cargo build` fetch an onnxruntime binary from
# cdn.pyke.io; point ORT_LIB_LOCATION at a pre-provisioned onnxruntime if the build environment
# must be closed off.
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# `pgvector::Vector` itself already comes transitively via sea-orm's postgres-vector feature
# (re-exported as `sea_orm::entity::prelude::PgVector`); this direct dependency is only so
# `pgvector::Vector::from(..)` can be named explicitly when binding a raw query parameter
# (search.rs, sync.rs), without pinning a second, possibly-mismatched version.
pgvector = { version = "0.4", default-features = false }

[[bin]]
name = "yorishiro_core-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test.workspace = true
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
