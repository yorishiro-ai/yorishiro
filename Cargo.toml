[workspace]
resolver = "2"
# ".": this manifest is both the workspace root and the base package (yorishiro-core), the flat
# layout this session's CLAUDE.md records as decided-2026-08-22, not carried forward from
# master's crates/ split. ee/crates/yorishiro-hosted depends on it by path; the reverse
# dependency must never appear, see CLAUDE.md's "Editions and the ee/ boundary".
members = [".", "ee/crates/yorishiro-hosted"]

[package]
name = "yorishiro-core"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "yorishiro_core-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.1" }

[dependencies]
loco-rs = { workspace = true , features = ["worker"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "postgres-vector",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
# Raw pool for RLS session-state handling: Loco's own ConnectOptions has no after_connect/
# after_release hook, so this stays a hand-built sqlx pool beside SeaORM's DatabaseConnection.
# See https://github.com/yotsunagi/yorishiro/issues/221.
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = { version = "2" }
anyhow = { version = "1" }
rand = { version = "0.9" }
sha2 = { version = "0.10" }
sea-query = { version = "1.0" }
jsonschema = { version = "0.49" }
rmcp = { version = "3.0.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
# OpenAI-compatible embedding provider (services::embedding::openai): talks to LM Studio/Ollama/
# vLLM/real OpenAI over HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `pgvector::Vector` itself already comes transitively via sea-orm's postgres-vector feature
# (re-exported as `sea_orm::entity::prelude::PgVector`); this direct dependency is only so
# `pgvector::Vector::from(..)` can be named explicitly when binding a raw query parameter
# (search.rs, sync.rs), without pinning a second, possibly-mismatched version.
pgvector = { version = "0.4", default-features = false }

[[bin]]
name = "yorishiro_core-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
