[workspace]
resolver = "2"
exclude = ["patches/loco-rs/source"]

[workspace.package]
rust-version = "1.100.0"

# Rust lints also run in ordinary builds.
# The strict Clippy targets and rust-analyzer's save checks use `-D warnings`.
[workspace.lints.rust]
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Groups have lower priority so individual project policies can override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Clippy 1.100 can suggest `pub` for crate-visible helpers in private modules, even when `unreachable_pub` rejects it.
redundant_pub_crate = "allow"
# Every `allow` needs a reason, and `expect` is preferred so a stale suppression is itself reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Selected restriction lints.
as_pointer_underscore = "warn"
as_underscore = "warn"
cfg_not_test = "warn"
default_union_representation = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
precedence_bits = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unused_result_ok = "warn"
# Document public error and panic conditions.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Consistent, readable style that `cargo clippy --fix` applies mechanically.
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
map_unwrap_or = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"

# Temporary upstream bug fixes, with rationale and removal criteria in patches/.
[patch.crates-io]
loco-rs = { path = "patches/loco-rs/source" }

[package]
name = "yorishiro"
version = "0.100.0"
edition = "2024"
rust-version.workspace = true
publish = false
default-run = "yorishiro"
# Build one integration test binary from `tests/mod.rs` rather than autodiscovering its modules as separate targets.
autotests = false

[lints]
workspace = true

[[test]]
name = "mod"
path = "tests/mod.rs"

[features]
default = ["enterprise"]
# The community edition: build it with `--no-default-features --features community`.
community = ["openapi"]
# The enterprise edition is the community edition plus the `ee/` overlay.
enterprise = [
  "community",
  "dep:base64",
  "dep:hmac",
  "dep:jsonwebtoken",
]
openapi = ["dep:utoipa", "dep:utoipa-swagger-ui"]

[workspace.dependencies]
sea-orm-migration = { version = "2.0.4", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }

# Compile every supported queue backend so operators can select SQLite, PostgreSQL, or Redis at runtime.
loco-rs = { version = "=1.3.1", default-features = false, features = ["cli", "with-db", "auth", "db-sqlite", "db-postgres", "worker_redis"] }
axum = { version = "0.8.9" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", features = ["json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
serial_test = { version = "4.0.1" }
sha2 = { version = "0.11.1" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["json"] }
sea-orm = { version = "2.0.4", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "postgres-vector",
] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
redis = { version = "1.8.2", features = ["aio", "tokio-comp"] }

[dependencies]
loco-rs = { workspace = true }
migration = { path = "migration" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "fs", "io-util"] }
futures = "0.3.34"
hex = "0.4.3"
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
sha2.workspace = true
jsonschema = { version = "0.61.2" }
rmcp = { version = "3.9.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1.2.3", features = ["uuid1"] }
# OpenAI-compatible embedding and inference clients use HTTP.
reqwest.workspace = true
# The local embedding provider runs multilingual-e5-base in process.
candle-core = { version = "0.11.1" }
candle-nn = { version = "0.11.1" }
candle-transformers = { version = "0.11.1" }
tokenizers = { version = "0.23.2", features = ["onig"] }
sqlite-vec = "=0.1.9"
# Register sqlite-vec with the same SQLite library SQLx uses.
libsqlite3-sys = "0.40.0"
# Enterprise-only dependencies.
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"], optional = true }  # licence and OIDC verification without the vulnerable RustCrypto RSA backend
hmac = { version = "0.13.0", optional = true }          # Stripe webhook signature (ee/controllers/stripe.rs)
base64 = { version = "0.23.1", optional = true }        # OAuth/PKCE encoding (ee/services/oauth.rs)

# OpenAPI is shared by both editions.
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"], optional = true }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"], optional = true }

serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }

[[bin]]
name = "yorishiro"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test.workspace = true
redis.workspace = true
# Used by queue and integration tests for isolated temporary databases.
tempfile = { version = "3.27.0" }
# Property-based testing (issue #358).
proptest = "=1.12.0"
