# Lint levels are in Cargo.toml's [workspace.lints]; this file holds their settings and the project's banned APIs.
# Clippy reads this file; rust-analyzer runs Clippy on save, and CI treats warnings as errors.

# Clippy may suggest changes to exported Rust signatures; keep the public REST, MCP, and CLI contracts stable.
avoid-breaking-exported-api = false

disallowed-macros = [
    { path = "std::debug_assert", reason = "use assert!, or a test under tests/" },
    { path = "std::debug_assert_eq", reason = "use assert_eq!, or a test under tests/" },
    { path = "std::debug_assert_ne", reason = "use assert_ne!, or a test under tests/" },
]

# Application code reads the environment in one place, src/data/env.rs, or through Loco's `get_env` in config/*.yaml.
disallowed-methods = [
    { path = "std::env::var", reason = "read environment keys in src/data/env.rs, or set them in config/*.yaml" },
    { path = "std::env::var_os", reason = "read environment keys in src/data/env.rs, or set them in config/*.yaml" },
    { path = "std::env::vars", reason = "read environment keys in src/data/env.rs, or set them in config/*.yaml" },
    { path = "std::env::vars_os", reason = "read environment keys in src/data/env.rs, or set them in config/*.yaml" },
]
