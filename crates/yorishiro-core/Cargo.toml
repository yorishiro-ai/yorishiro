[package]
name = "yorishiro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
autotests = false

[features]
# Type-level only: proves the generic bounds in models/ are satisfiable by Sqlite.
# Says nothing about the emitted SQL or runtime behavior (step 4's concern).
# Off by default so no shipped binary links libsqlite3-sys from this crate.
sqlite = ["sqlx/sqlite", "sea-query-binder/sqlx-sqlite"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
jsonschema.workspace = true
ort.workspace = true
pgvector.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
# Only the workspace's `uuid = { features = ["serde"] }` ships in the built crate; `v4` here is
# test-only, for seeding several distinct IDs in the Sqlite execution test, where there is no
# `uuidv7()` for the database to assign them.
uuid = { workspace = true, features = ["v4"] }
