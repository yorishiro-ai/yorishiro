[package]
name = "yorishiro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
autotests = false

[features]
# Off by default: a caller of this crate alone (a downstream consumer that never touches
# yorishiro-server) does not get libsqlite3-sys linked in unless it asks.
# yorishiro-server enables this unconditionally, since the database driver is a runtime choice
# (YORISHIRO_DATABASE_DRIVER) rather than a compile-time one: the shipped binary always carries
# both engines.
sqlite = ["sqlx/sqlite", "sea-query-binder/sqlx-sqlite"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
jsonschema.workspace = true
ort.workspace = true
pgvector.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
