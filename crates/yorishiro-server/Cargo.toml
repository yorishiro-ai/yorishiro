[package]
name = "yorishiro-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server (REST + MCP) for Yorishiro, an MCP-native knowledge store"
repository.workspace = true
readme = "README.md"
include = ["src/**/*", "README.md", "../../migrations/**/*"]
autotests = false

# The community edition's binary: BUSL-1.1 only, nothing from `ee/`, and headless because the
# web UI is the paid edition's. The default artifact is `ee/`'s `yorishiro-server`, which is a
# superset -- this one exists for a deployment that cannot have proprietary code on disk.
[[bin]]
name = "yorishiro-ce-server"
path = "src/bin/yorishiro_ce_server.rs"

[dependencies]
yorishiro-core = { path = "../yorishiro-core" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "request-id"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }
