[package]
name = "yorishiro-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server (REST + MCP) for Yorishiro, an MCP-native knowledge store"
repository.workspace = true
readme = "README.md"
include = ["src/**/*", "README.md", "migrations/**/*"]
autotests = false

# The community edition's binary: BUSL-1.1 only, nothing from `ee/`, and headless because the
# web UI is the paid edition's. The default artifact is `ee/`'s `yorishiro-server`, which is a
# superset. This one exists for a deployment that cannot have proprietary code on disk.
#
# The cargo target keeps `-ce-` because two bins in one workspace cannot share a name. The
# package installs it as `/usr/bin/yorishiro-server`, the same path the enterprise package
# uses, so the unit and every runbook are edition-neutral.
[[bin]]
name = "yorishiro-ce-server"
path = "src/bin/yorishiro_ce_server.rs"

[dependencies]
# `version` is required for `cargo publish`: a path dependency with none is rejected as unresolvable off this filesystem.
# The release workflow's version-bump step updates this alongside the workspace version (see `.github/workflows/release.yml`), so it always matches.
yorishiro-core = { path = "../yorishiro-core", version = "0.49.1" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "request-id"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }
