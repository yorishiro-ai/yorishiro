[package]
name = "yorishiro-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server (REST + MCP) for Yorishiro, an MCP-native knowledge store"
repository.workspace = true
readme = "README.md"
include = ["src/**/*", "README.md", "../../migrations/**/*"]
autotests = false

# No `[[bin]]`: this crate is a library the one binary composes. `ee/`'s
# `yorishiro-hosted-server` is that binary, and it re-exports this crate's `admin` CLI, so the
# commands a `yorishiro-server admin ...` used to run are reached through it.

[dependencies]
yorishiro-core = { path = "../yorishiro-core" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "request-id"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }
