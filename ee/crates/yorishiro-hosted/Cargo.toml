[package]
name = "yorishiro-hosted"
version = "0.1.0"
edition = "2024"
# Not `license.workspace = true`: this manifest has no workspace-level license field to
# inherit from (the root package's Cargo.toml carries no `[workspace.package]`), and even if
# it did, `ee/` is not BUSL-1.1. `ee/LICENSE` adds a Competing Use restriction the rest of the
# repository doesn't carry.
license-file = "../../LICENSE"
publish = false

# Both editions install their binary as `yorishiro-server`; see `ee/LICENSE` and
# `.claude/rules/workspace-checklist.md` in yorishiro-specs for the on-disk-identical
# packaging convention this name exists to support once packaging lands.
[[bin]]
name = "yorishiro-server"
path = "src/bin/yorishiro_server.rs"

[dependencies]
yorishiro-core = { path = "../../.." }
# Relative, not path = "migration" like the root manifest's own dependency on the same crate:
# this is not eligible for the workspace.dependencies table the way version-and-features-only
# dependencies are, since a relative path is resolved from this manifest's own directory, and the
# root's path = "migration" would not reach the same crate from here.
migration = { path = "../../../migration" }
loco-rs = { workspace = true }
tokio.workspace = true
axum.workspace = true
async-trait.workspace = true
jsonwebtoken = { version = "9" }
serde.workspace = true
serde_yaml_ng = { version = "0.10" }
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sea-orm.workspace = true
uuid.workspace = true
sqlx.workspace = true
hmac = { version = "0.12" }
sha2.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64 = { version = "0.22" }
rand.workspace = true
url = { version = "2.5" }

[dev-dependencies]
tempfile = { version = "3" }
loco-rs = { workspace = true, features = ["testing"] }
serial_test.workspace = true
axum-test = { version = "17.3" }
