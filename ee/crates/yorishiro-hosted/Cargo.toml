[package]
name = "yorishiro-hosted"
version.workspace = true
edition.workspace = true
# Not `license.workspace = true`: the workspace is BUSL-1.1 and this crate is not. Everything
# under `ee/` is licensed by `ee/LICENSE`, which adds a Competing Use restriction.
license-file = "../../LICENSE"
autotests = false
publish = false

# Both editions install their binary as `yorishiro-server`, and both ship the same
# `yorishiro.service`, and the packages conflict, so a machine has exactly one of each. The
# edition is carried by the package name and the file on the release page; everything on disk
# is edition-neutral, which is what makes switching editions a file swap rather than a
# migration of unit names, ExecStart paths and runbooks.
[[bin]]
name = "yorishiro-server"
path = "src/bin/yorishiro_server.rs"

[dependencies]
async-trait.workspace = true
yorishiro-core = { path = "../../../crates/yorishiro-core" }
yorishiro-server = { path = "../../../crates/yorishiro-server" }
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
cookie.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
mime_guess.workspace = true
rand.workspace = true
rmcp.workspace = true
rust-embed.workspace = true
reqwest.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
thirtyfour.workspace = true
tower.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }

# The browser suite, separate from the crate's own `tests/` tree because it needs things the
# unit tests do not: a running licensed server, a built SPA, and a chromedriver to drive.
# `autotests = false` means nothing here is picked up implicitly, so it is named explicitly.
# Every test in it is `#[ignore]`, so `cargo test` stays the same for anyone who has none of that.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
