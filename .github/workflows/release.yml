name: Release

# One dispatch is the whole release: bump, tag, build, publish, verify. The tag is pushed
# directly to master.
#
# This is only safe because this repository has no branch protection or ruleset on master
# (both verified disabled). If either is ever enabled, the push step below starts failing and
# this needs a token that isn't `github-actions[bot]`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.18.1) -- without the leading v'
        required: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yotsunagi/yorishiro

permissions:
  contents: write
  packages: write
  # Build provenance: `id-token` mints the short-lived OIDC token that identifies this workflow
  # to the transparency log, `attestations` records the result. Both are required by
  # actions/attest-build-provenance and neither is used anywhere else here.
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}

    steps:
      # workflow_dispatch runs against whatever ref the dispatcher selected, and the checkout
      # below has no `ref:` pin, so without this guard, dispatching from a branch that is a
      # fast-forward descendant of master would push that branch's content straight to master.
      # Fail loudly rather than silently pinning `ref: master`, which would build something
      # other than what the dispatcher chose.
      - name: Require dispatch from master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Releases must be dispatched from master (got $GITHUB_REF)." >&2
            exit 1
          fi

      # persist-credentials stays at its default (true), unlike other checkouts in this repo:
      # this job needs the injected token to push the bump commit and tag below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # (0|[1-9][0-9]*) per component rather than [0-9]+: the naive form also accepts a
      # leading-zero component like "01.2.3", which is not a valid SemVer version core and
      # would confuse `cargo update -w`'s output downstream.
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version '$VERSION' is not in x.y.z form." >&2
            exit 1
          fi

      # A tag on its own does not mean the release shipped: the GitHub Release, created last
      # after every artifact is pushed, is what marks it complete. The two together tell the
      # three cases apart:
      #
      #   no tag              -> normal first run: bump, tag, publish
      #   tag + release       -> already out; dispatching it again is a mistake
      #   tag, but no release -> a previous run died partway. Skip the bump (the commit and tag
      #                          are already on master) and republish from the existing tag.
      #
      # The resume path exists so a failed publish can be re-dispatched at the same version,
      # without deleting the remote tag by hand or burning a patch number.
      - name: Determine release state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          tag_exists=false
          release_exists=false

          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            tag_exists=true
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$tag_exists" = true ] && [ "$release_exists" = true ]; then
            echo "$TAG is already released. Nothing to do." >&2
            exit 1
          fi

          if [ "$tag_exists" = true ]; then
            echo "::notice::$TAG exists but has no GitHub Release -- resuming a failed publish."
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.state.outputs.resumed == 'false'

      - name: Bump workspace version
        if: steps.state.outputs.resumed == 'false'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          if [ "$(grep -c '^version = "'"$VERSION"'"$' Cargo.toml)" -ne 1 ]; then
            echo "Expected exactly one '^version = \"$VERSION\"' line in Cargo.toml after the bump." >&2
            exit 1
          fi

      # -w only: a bare `cargo update` would also move git dependencies to newer commits on the
      # same tag ref than what this release was built and tested against.
      - name: Update Cargo.lock
        if: steps.state.outputs.resumed == 'false'
        run: cargo update -w

      - name: Commit and tag
        id: commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          TAG: v${{ inputs.version }}
          RESUMED: ${{ steps.state.outputs.resumed }}
        run: |
          if [ "$RESUMED" = "true" ]; then
            echo "Resuming: $TAG already points at the release commit, not re-bumping."
          else
            git add Cargo.toml Cargo.lock
            if git diff --quiet --cached; then
              # Nothing to commit: the version is already what was asked for, because a PR
              # already carried the bump. Tag the commit that brought it in rather than
              # failing on an empty commit.
              echo "::notice::Cargo.toml is already at ${TAG}; tagging without a bump commit."
              git tag "$TAG"
              git push origin "$TAG"
            else
              git commit -m "Bump version to ${TAG}"
              git tag "$TAG"
              # Atomic: master and the tag land together, or neither does. Avoids a bumped
              # master with no matching tag if the second of two separate pushes failed.
              git push --atomic origin HEAD:master "$TAG"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
            archive: deb+rpm
          - os: ubuntu-24.04-arm
            arch: arm64
            ext: ""
            archive: deb+rpm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # The action exports SCCACHE_PATH but not RUSTC_WRAPPER, so cargo has to be pointed at
      # sccache explicitly, and that happens after rust-cache below since rust-cache folds
      # RUST*-prefixed env vars into its cache key.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Route rustc through sccache
        if: runner.os == 'Linux'
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # The SPA is embedded from `ee/web/dist`, a build output that is not committed, so it is
      # built before cargo: a release binary that links without it serves no UI.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ee/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ee/web/pnpm-lock.yaml

      - name: Build the SPA
        run: |
          pnpm --dir ee/web install --frozen-lockfile
          pnpm --dir ee/web run build

      - name: Build
        run: cargo build --release -p yorishiro-hosted

      # The community binary carries no code from `ee/`, for a deployment that cannot hold
      # proprietary code at all. Built only on Linux: it exists for the distribution packages
      # below, and the default edition is the unsuffixed package.
      - name: Build the community binary
        if: runner.os == 'Linux'
        run: cargo build --release -p yorishiro-server --bin yorishiro-ce-server

      # No Linux tarball. The .deb and .rpm below carry the same binaries and additionally
      # create the service user, the state directory, the config directory and the systemd
      # unit, and they declare the glibc floor, so the package manager refuses a system the
      # binary cannot run on instead of unpacking one that dies at first start. A tarball
      # offers none of that and works on exactly the same systems, the floor being a property
      # of the binary rather than of the packaging.
      #
      # No Windows build either: nothing documents it, so the zip was an artifact nobody was
      # ever pointed at.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist

      # Installed from the release tarball rather than an action: the version is pinned here in
      # plain sight, and nfpm publishes static binaries for both architectures this matrix runs.
      - name: Install nfpm
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
          ARCH: ${{ matrix.arch }}
        run: |
          # nfpm names its amd64 asset `x86_64`, which is not what this matrix calls the arch.
          case "$ARCH" in
            amd64) asset_arch=x86_64 ;;
            arm64) asset_arch=arm64 ;;
            *) echo "no nfpm asset known for arch '$ARCH'" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          asset="nfpm_${NFPM_VERSION}_Linux_${asset_arch}.tar.gz"

          curl -fsSL -o /tmp/nfpm.tar.gz "${base}/${asset}"
          # A tool that writes the artifacts a release publishes is verified before it runs.
          # The checksum file is published alongside; `--ignore-missing` narrows it to the one
          # asset downloaded, and `-c` fails on a mismatch.
          curl -fsSL -o /tmp/nfpm-checksums.txt "${base}/checksums.txt"
          ( cd /tmp && cp nfpm.tar.gz "$asset" \
            && sha256sum --check --ignore-missing --strict nfpm-checksums.txt \
            && rm -f "$asset" )
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      # Two package lines, one per edition: `yorishiro-ee` carries the paid features (inactive
      # without a licence key) and is what most deployments want; `yorishiro-ce` holds no
      # proprietary code and is therefore headless. They Conflict, since both would run a
      # service against one database.
      - name: Package (deb and rpm)
        if: runner.os == 'Linux'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          # nfpm wants the bare version, not the v-prefixed tag.
          export VERSION="${TAG#v}"
          for edition in yorishiro-ee yorishiro-ce; do
            for pkg in deb rpm; do
              nfpm package \
                --config "packaging/nfpm-${edition}.yaml" \
                --packager "$pkg" \
                --target dist/
            done
          done
          ls -1 dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch was pushed as its own tag by the (native, no-QEMU) `docker` job above;
      # this merges them into one multi-arch manifest under the version and `latest` tags.
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  # Pulls the manifest that was just published and boots it against a real database. `ci.yml`'s
  # package-smoke covers the same ground for a debug build on every PR, but nothing until now
  # checks the actual release artifact: a release-profile-only fault, or a Dockerfile stage
  # that only breaks in the published image, would otherwise ship unnoticed.
  #
  # Runs before github-release deliberately: the GitHub Release is what marks a version as
  # published (see `prepare`), so a failure here leaves the version resumable rather than
  # looking complete.
  smoke:
    needs: [docker-manifest, prepare]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image refuses to start without an embedding model on disk (by design: a missing
      # model is a hard failure, not a degraded mode), so fetch the same one the docs tell
      # operators to use.
      #
      # This must stay in step with the default model and YORISHIRO_EMBEDDING_DIMENSIONS: the server
      # checks the loaded model's width against the configured one and refuses to start when
      # they disagree. Change the default, change this.
      - name: Fetch the embedding model
        run: |
          mkdir -p models
          curl -fsSL -o models/model.onnx \
            https://huggingface.co/Xenova/multilingual-e5-large/resolve/main/onnx/model_quantized.onnx
          curl -fsSL -o models/tokenizer.json \
            https://huggingface.co/Xenova/multilingual-e5-large/resolve/main/tokenizer.json

      - name: Boot the published image and check /up
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker run -d --name smoke --network host \
            -v "$PWD/models:/app/models:ro" \
            -e DATABASE_URL=postgres://yorishiro:yorishiro@127.0.0.1:5432/yorishiro \
            "${IMAGE}:${TAG}"

          booted=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null 2>&1; then
              booted=1
              break
            fi
            sleep 2
          done

          if [ -z "$booted" ]; then
            echo "The published image never answered /up." >&2
            docker logs smoke >&2 || true
            exit 1
          fi

          # The one binary serves the UI too, so an image whose SPA failed to build answers
          # /up perfectly while serving a blank 404 at /. `/up` alone would call that healthy.
          if ! curl -fsS http://127.0.0.1:8080/ | grep -q "<html"; then
            echo "The published image booted but served no SPA at /." >&2
            docker logs smoke >&2 || true
            exit 1
          fi

          echo "::notice::${IMAGE}:${TAG} booted, answered /up, and served the SPA"

  github-release:
    needs: [binary, smoke, prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      # Count what is about to be published, before publishing it.
      #
      # A glob matching nothing is not an error to the upload action, which is precisely why
      # the list below cannot be trusted to prove its own coverage, and this counts instead.
      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          # Both editions x both architectures x both formats, and nothing else.
          expect '*.deb' 4
          expect '*.rpm' 4
          exit "$status"

      # One checksum file over everything published, so a download can be verified without a
      # signing key to distribute, rotate and have people trust. The same mechanism this
      # workflow already relies on for nfpm itself.
      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      # What the packages are and where they came from, without a signing key to distribute,
      # rotate or have anyone trust. `gh attestation verify <file> --repo yotsunagi/yorishiro`
      # answers "this artifact was built by this workflow, from this commit", which is the
      # question a signature would answer, minus the key management that made GPG not worth it
      # for a project with no package repository.
      #
      # checksums.txt stays: it needs no tooling beyond sha256sum and works offline.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          generate_release_notes: true
