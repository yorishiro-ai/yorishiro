name: Release (SemVer)

# One dispatch cuts a SemVer release from `develop`: bumps `Cargo.toml`, builds, packages,
# publishes images, and publishes a GitHub Release.
#
# SemVer releases use `vX.Y.Z` tags and are what `Cargo.toml`'s version field represents. A
# SemVer release bumps the manifest, runs the full build pipeline, then tags the verified commit.
#
# Prereleases use a different workflow (`release_pre.yml`) with date-based tags (`YYYYMMDD-N`)
# and do not modify `Cargo.toml`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version without v prefix (e.g. 0.100.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: read

# One release at a time: two dispatches racing would race on tags and on develop.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match X.Y.Z (no v prefix): '$VERSION'" >&2
            exit 1
          fi

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          # The release plan runs before the shared Rust setup action.
          # Override repository-local build optimizations for this metadata check.
          RUSTC_WRAPPER: ''
          RUSTFLAGS: ''
        run: |
          TAG="v${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "$TAG"; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi

          BRANCH="release/prepare-${TAG}"
          git checkout -b "$BRANCH" develop

          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

          cp Cargo.lock Cargo.lock.before
          cargo check
          python3 - "$VERSION" <<'PY'
          import copy
          import sys
          import tomllib

          version = sys.argv[1]
          with open("Cargo.lock", "rb") as lock:
              after_bytes = lock.read()
          with open("Cargo.lock.before", "rb") as lock:
              before = tomllib.load(lock)
          after = tomllib.loads(after_bytes.decode())

          def root_packages(lock):
              return [package for package in lock.get("package", []) if package.get("name") == "yorishiro"]

          before_roots = root_packages(before)
          after_roots = root_packages(after)
          if len(before_roots) != 1 or len(after_roots) != 1:
              raise SystemExit("Cargo.lock must contain exactly one yorishiro package entry before and after")
          if after_roots[0].get("version") != version:
              raise SystemExit("Cargo.lock root package version does not match the release version")

          normalized_before = copy.deepcopy(before)
          normalized_after = copy.deepcopy(after)
          normalized_after["package"] = [
              version_package if version_package.get("name") != "yorishiro" else {
                  **version_package,
                  "version": before_roots[0]["version"],
              }
              for version_package in normalized_after["package"]
          ]
          if normalized_before != normalized_after:
              raise SystemExit("Cargo.lock changed outside the root yorishiro package version")
          PY
          rm Cargo.lock.before

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to commit (version may already be set)." >&2
            git checkout develop
            git branch -D "$BRANCH"
          else
            git commit -m "Bump version to ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from $(git rev-parse HEAD)"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git checkout develop
            git branch -D "$BRANCH"
            exit 0
          fi

          git push origin "$BRANCH"
          git push origin "$BRANCH:develop"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ee
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Build
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "${{ matrix.edition }}" = ce ]; then
            cargo build --locked --no-default-features --features community --release --bin yorishiro
          else
            cargo build --locked --features enterprise --release --bin yorishiro
          fi

      - uses: ./.github/actions/install-nfpm

      - name: Package (deb and rpm)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          EDITION: ${{ matrix.edition }}
        run: |
          mkdir -p dist
          case "$ARCH" in amd64) rpm_arch=x86_64 ;; arm64) rpm_arch=aarch64 ;; esac
          for pkg in deb rpm; do
             nfpm package --config "packaging/nfpm-yorishiro-${EDITION}.yaml" --packager "$pkg" --target dist/
             if [ "$pkg" = deb ]; then
               source="dist/yorishiro-${EDITION}_${VERSION}_${ARCH}.deb"
             else
               source="dist/yorishiro-${EDITION}-${VERSION}-1.${rpm_arch}.rpm"
             fi
             mv "$source" "dist/yorishiro-${EDITION}-${VERSION}-${ARCH}.${pkg}"
          done
          ls -1 dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: binary-linux-${{ matrix.edition }}-${{ matrix.arch }}
          path: dist/*

  package-tests:
    needs: [binary, prepare]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Install package tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev rpm
      - name: Assert exact artifacts and metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                test -f "dist/yorishiro-${edition}-${VERSION}-${arch}.${ext}"
              done
            done
          done
          test "$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)" -eq 8
          for f in dist/*.deb; do
            dpkg-deb -I "$f" | grep -E 'Conflicts:.*yorishiro|Replaces:.*yorishiro'
          done
          for f in dist/*.rpm; do
            rpm -qp --conflicts "$f" | grep -qx 'yorishiro\|yorishiro-ce\|yorishiro-ee'
            rpm -qp --obsoletes "$f" | grep -qx 'yorishiro\|yorishiro-ce\|yorishiro-ee'
          done
      - uses: ./.github/actions/install-nfpm
      - name: Build retired unified packages for migration tests
        env:
          VERSION: ${{ inputs.version }}
          ARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p target/release /tmp/unified
          dpkg-deb -x "dist/yorishiro-ce-${VERSION}-amd64.deb" /tmp/ce
          cp /tmp/ce/usr/bin/yorishiro target/release/yorishiro
          nfpm package --config packaging/nfpm-yorishiro-unified.yaml --packager deb --target /tmp/unified
          nfpm package --config packaging/nfpm-yorishiro-unified.yaml --packager rpm --target /tmp/unified
          mv "/tmp/unified/yorishiro_${VERSION}_amd64.deb" "/tmp/unified/yorishiro-${VERSION}-amd64.deb"
          mv "/tmp/unified/yorishiro-${VERSION}-1.x86_64.rpm" "/tmp/unified/yorishiro-${VERSION}-amd64.rpm"
      - name: Test package transitions and co-install refusal
        env:
          VERSION: ${{ inputs.version }}
        run: ./packaging/test-transitions.sh dist /tmp/unified "$VERSION"
      - name: Test representative installed packages
        run: |
          ./packaging/test-install.sh "dist/yorishiro-ce-${{ inputs.version }}-amd64.deb"
          ./packaging/test-systemd.sh "dist/yorishiro-ee-${{ inputs.version }}-amd64.deb"

  docker:
    needs: [prepare, package-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ee
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify architecture image tags
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_TAG: v${{ inputs.version }}
        run: |
          test "$TAG" = "$EXPECTED_TAG"
          test "${IMAGE}:${TAG}-ce-amd64" = "${IMAGE}:v${{ inputs.version }}-ce-amd64"
          test "${IMAGE}:${TAG}-ce-arm64" = "${IMAGE}:v${{ inputs.version }}-ce-arm64"
          test "${IMAGE}:${TAG}-ee-amd64" = "${IMAGE}:v${{ inputs.version }}-ee-amd64"
          test "${IMAGE}:${TAG}-ee-arm64" = "${IMAGE}:v${{ inputs.version }}-ee-arm64"

      - name: Read the pinned Rust version
        id: rust
        run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            EDITION=${{ matrix.edition }}
            RUST_VERSION=${{ steps.rust.outputs.version }}
          push: ${{ !inputs.dry_run }}
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.edition }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        edition: [ce, ee]

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EDITION: ${{ matrix.edition }}
        run: |
          docker buildx imagetools create \
             -t "${IMAGE}:${TAG}-${EDITION}" \
             "${IMAGE}:${TAG}-${EDITION}-amd64" \
             "${IMAGE}:${TAG}-${EDITION}-arm64"

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    strategy:
      matrix:
        edition: [ce, ee]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          psql "postgres://yorishiro:secret@127.0.0.1:5432/yorishiro" \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e QUEUE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e HOST=http://127.0.0.1:5150 \
            -e YORISHIRO_EMBEDDING_PROVIDER=none \
            "${IMAGE}:${TAG}-${{ matrix.edition }}"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5150/_ping >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:5150/_ping || {
            echo "::error::the published image never answered /_ping" >&2
            docker logs smoke
            exit 1
          }
          docker rm -f smoke

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                expect "yorishiro-${edition}-${{ inputs.version }}-${arch}.${ext}" 1
              done
            done
          done
          exit "$status"

      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - name: Tag the verified release commit
        env:
          REF: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi
          git tag "$TAG" "$REF"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Release ${{ needs.prepare.outputs.tag }} built from `develop`.

            Commit: ${{ github.sha }}

            CE and EE are published as separate compile-time artifacts.
