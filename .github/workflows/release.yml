name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.16.3) -- without the leading v'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not in X.Y.Z format, aborting."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_ENV"

      - name: Check if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.tag }} already exists, aborting."
            exit 1
          fi

      - name: Bump workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          if [ "$(grep -c '^version = "'"$VERSION"'"$' Cargo.toml)" -ne 1 ]; then
            echo "Expected exactly one '^version = \"$VERSION\"' line in Cargo.toml after the bump, found a different count."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Update lockfile
        run: cargo update -w

      - name: Push bump branch and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to v$VERSION"
          git push origin "release/v$VERSION"

          {
            echo "Prepares the v$VERSION release. Merging this (squash) is stage 1 of 2 -- once it's on \`master\`, dispatch \`release-publish.yml\` with \`version: $VERSION\` to tag, build, and publish."
            echo ""
            echo "This PR's workflow run needs manual approval in the Actions tab before its CI (\`check\`/\`security\`) can run -- GitHub requires that for PRs authored by \`github-actions[bot]\`."
          } > /tmp/release-pr-body.md

          gh pr create \
            --title "Bump version to v$VERSION" \
            --body-file /tmp/release-pr-body.md \
            --base master \
            --head "release/v$VERSION"
