name: Release (SemVer)

# One dispatch cuts a SemVer release from `develop`: bumps `Cargo.toml`, builds, packages,
# publishes images, and publishes a GitHub Release.
#
# SemVer releases use `vX.Y.Z` tags and are what `Cargo.toml`'s version field represents. A
# SemVer release bumps the manifest, runs the full build pipeline, then tags the verified commit.
#
# Prereleases use a different workflow (`release_pre.yml`) with date-based tags (`YYYYMMDD-N`)
# and do not modify `Cargo.toml`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version without v prefix (e.g. 0.100.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: read

# One release at a time: two dispatches racing would race on tags and on develop.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match X.Y.Z (no v prefix): '$VERSION'" >&2
            exit 1
          fi

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          # The release plan runs before the shared Rust setup action.
          # Override repository-local build optimizations for this metadata check.
          RUSTC_WRAPPER: ''
          RUSTFLAGS: ''
        run: |
          TAG="v${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "$TAG"; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi

          BRANCH="release/prepare-${TAG}"
          git checkout -b "$BRANCH" develop

          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

          cp Cargo.lock Cargo.lock.before
          cargo check
          python3 - "$VERSION" <<'PY'
          import copy
          import sys
          import tomllib

          version = sys.argv[1]
          with open("Cargo.lock", "rb") as lock:
              after_bytes = lock.read()
          with open("Cargo.lock.before", "rb") as lock:
              before = tomllib.load(lock)
          after = tomllib.loads(after_bytes.decode())

          def root_packages(lock):
              return [package for package in lock.get("package", []) if package.get("name") == "yorishiro"]

          before_roots = root_packages(before)
          after_roots = root_packages(after)
          if len(before_roots) != 1 or len(after_roots) != 1:
              raise SystemExit("Cargo.lock must contain exactly one yorishiro package entry before and after")
          if after_roots[0].get("version") != version:
              raise SystemExit("Cargo.lock root package version does not match the release version")

          normalized_before = copy.deepcopy(before)
          normalized_after = copy.deepcopy(after)
          normalized_after["package"] = [
              version_package if version_package.get("name") != "yorishiro" else {
                  **version_package,
                  "version": before_roots[0]["version"],
              }
              for version_package in normalized_after["package"]
          ]
          if normalized_before != normalized_after:
              raise SystemExit("Cargo.lock changed outside the root yorishiro package version")
          PY
          rm Cargo.lock.before

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to commit (version may already be set)." >&2
            git checkout develop
            git branch -D "$BRANCH"
            REF=$(git rev-parse HEAD)
          else
            git commit -m "Bump version to ${TAG}"
            REF=$(git rev-parse HEAD)
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from ${REF}"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
            if [ "$(git branch --show-current)" = "$BRANCH" ]; then
              git checkout develop
              git branch -D "$BRANCH"
            fi
            exit 0
          fi

          if [ "$(git branch --show-current)" = "$BRANCH" ]; then
            git push origin "$BRANCH"
            git push origin "$BRANCH:develop"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ee
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: ./.github/actions/build-and-package
        with:
          edition: ${{ matrix.edition }}
          target: ${{ matrix.target }}
          tag: ${{ needs.prepare.outputs.tag }}

  package-tests:
    needs: [binary, prepare]
    runs-on: ubuntu-26.04
    steps:
      - uses: ./.github/actions/package-tests
        with:
          tag: ${{ inputs.version }}
          ce_package: "dist/yorishiro-ce-${{ inputs.version }}-amd64.deb"
          ee_package: "dist/yorishiro-ee-${{ inputs.version }}-amd64.deb"

  docker:
    needs: [prepare, package-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ee
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write

    steps:
      - uses: ./.github/actions/build-docker
        with:
          edition: ${{ matrix.edition }}
          tag: ${{ needs.prepare.outputs.tag }}
          arch: ${{ matrix.arch }}
          push: ${{ !inputs.dry_run }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        edition: [ce, ee]

    steps:
      - uses: ./.github/actions/docker-manifest
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          edition: ${{ matrix.edition }}

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    strategy:
      matrix:
        edition: [ce, ee]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: ./.github/actions/smoke
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          edition: ${{ matrix.edition }}

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                expect "yorishiro-${edition}-${{ inputs.version }}-${arch}.${ext}" 1
              done
            done
          done
          exit "$status"

      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - name: Tag the verified release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          token_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${token_header}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi
          git tag "$TAG" "$REF"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v6
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Release ${{ needs.prepare.outputs.tag }} built from `develop`.

            Commit: ${{ github.sha }}

            CE and EE are published as separate compile-time artifacts.
