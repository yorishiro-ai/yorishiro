name: Release

# One dispatch cuts a prerelease from `develop`: build, package, publish images, publish a
# GitHub Release marked prerelease.
#
# Nothing is committed to `develop`, and `Cargo.toml` is not edited either. A prerelease is
# identified by its tag, which is the UTC date and the run within that day (`20260830-1`), and
# cargo rejects that as a version outright: "unexpected character '-' after major version
# number". So there is no version to inject and nothing to undo.
#
# Leaving `develop` at `0.1.0` is the accurate state rather than a workaround: `master` holds
# 0.50.0 and this branch has not claimed a version, so writing one into the manifest would say
# it had.
#
# What that costs, and where it is repeated for the people who meet it: `yorishiro version`
# reports `0.1.0 (20260830-1)`. The version half is the branch's, the parenthesised half is
# this build's, and the release body says so. The packages are versioned by the tag, so
# `dpkg -l` names the prerelease exactly.
#
# There is no `crates-publish` job. `yorishiro-core` and `yorishiro-server` are both on
# crates.io at 0.50.0, published from the `master` lineage, which still holds the crates those
# names belong to. Publishing from this branch's single-crate layout is a separate design
# question for whenever `develop` replaces `master`, not something this workflow defers.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yotsunagi/yorishiro

permissions:
  contents: write
  packages: write
  # Build provenance: `id-token` mints the short-lived OIDC token that identifies this workflow
  # to the transparency log, `attestations` records the result. Both are required by
  # actions/attest-build-provenance and neither is used anywhere else here.
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      # A real release comes from `develop`; a dry run may come from anywhere. That exemption is
      # the point of `dry_run`: it is what lets this workflow be checked from a pull request
      # branch before it is merged, which is otherwise impossible for a `workflow_dispatch`
      # workflow whose every other path writes something public.
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The tag names the day and the run within it: `20260830-1`, then `20260830-2`. There is
      # no version input, because a prerelease is not claiming a version: see this file's
      # header on why `develop` stays at 0.1.0.
      #
      # The date is UTC, which is what the runner's clock reads. A prerelease cut late in the
      # evening in Asia/Tokyo therefore carries the following day's date, and the Release's own
      # creation time will look a day ahead of its tag for that window. Stated because the
      # alternative reading is that something is wrong.
      #
      # Numbering reads `git ls-remote`, deliberately, and not the tags API. `gh api
      # repos/.../tags?per_page=100` returns one page: measured here at 72 of the 85 refs
      # `ls-remote` reports. Today's tags are the newest, so they are the first to fall off that
      # page as the list grows, and the numbering would then silently restart at 1 and collide
      # with a tag that already exists. `ls-remote` has no paging.
      #
      # `grep -v '\^{}'` drops the peeled refs an annotated tag adds; the 13 of them here are
      # exactly the difference between those two counts.
      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATE="$(date -u +%Y%m%d)"
          existing="$(git ls-remote --tags origin \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' \
            | grep -E "^${DATE}-[0-9]+$" | sed "s|^${DATE}-||" | sort -n | tail -1)"
          TAG="${DATE}-$(( ${existing:-0} + 1 ))"

          # The version compiled into the binary. A prerelease tag is not a SemVer version and
          # `Cargo.toml` will not take it, so the manifest keeps the version it already has and
          # only the build metadata says which prerelease this is.
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from ${GITHUB_SHA}"
            # Every downstream job checks out this, not the tag: in a dry run the tag does not
            # exist, and `ref:` pointing at a missing tag fails the checkout rather than the
            # release.
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # The action exports SCCACHE_PATH but not RUSTC_WRAPPER, so cargo has to be pointed at
      # sccache explicitly, and that happens after rust-cache below since rust-cache folds
      # RUST*-prefixed env vars into its cache key.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # `Cargo.toml` is left alone. A prerelease tag is a date and a run number, which cargo
      # rejects as a version outright ("unexpected character '-' after major version number",
      # measured), so there is nothing to inject into the manifest and no edit to undo.
      #
      # `app_version` therefore reports the manifest's `0.1.0`, and the tag is what identifies
      # the build. `BUILD_SHA` carries the tag rather than the commit sha so that
      # `yorishiro version` answers `0.1.0 (20260830-1)`, which names the prerelease a person
      # actually downloaded. The header and the release body both say the version half is the
      # branch's, not this build's.
      #
      # There is no separate community build. `ee/` compiles into this crate as a module and
      # the licence layer decides at runtime what serves, so there is one binary and one
      # package; `packaging/nfpm-yorishiro.yaml` records the same reasoning.
      - name: Build
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release --bin yorishiro

      # Installed from the release tarball rather than an action: the version is pinned here in
      # plain sight, and nfpm publishes static binaries for both architectures this matrix runs.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          ARCH: ${{ matrix.arch }}
        run: |
          # nfpm names its amd64 asset `x86_64`, which is not what this matrix calls the arch.
          case "$ARCH" in
            amd64) asset_arch=x86_64 ;;
            arm64) asset_arch=arm64 ;;
            *) echo "no nfpm asset known for arch '$ARCH'" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          asset="nfpm_${NFPM_VERSION}_Linux_${asset_arch}.tar.gz"

          curl -fsSL -o /tmp/nfpm.tar.gz "${base}/${asset}"
          # A tool that writes the artifacts a release publishes is verified before it runs.
          # The checksum file is published alongside; `--ignore-missing` narrows it to the one
          # asset downloaded, and `-c` fails on a mismatch.
          curl -fsSL -o /tmp/nfpm-checksums.txt "${base}/checksums.txt"
          ( cd /tmp && cp nfpm.tar.gz "$asset" \
            && sha256sum --check --ignore-missing --strict nfpm-checksums.txt \
            && rm -f "$asset" )
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      # Built in CI rather than from a developer's machine, and this is the reason: the package
      # declares a glibc floor of 2.38, and a binary linked against a newer host glibc raises the
      # real requirement above the declared one, so the package installs on systems it cannot run
      # on. The runner's glibc is what holds the floor down.
      # `VERSION` is the tag. `20260830-1` is a well-formed Debian version (`20260830` upstream,
      # `1` revision), so the packages carry the prerelease identity even though the binary
      # inside them reports the manifest's own version. rpm treats the hyphen the same way, as
      # the release field.
      - name: Package (deb and rpm)
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          for pkg in deb rpm; do
            nfpm package --config packaging/nfpm-yorishiro.yaml --packager "$pkg" --target dist/
          done
          ls -1 dist/

      # The packages are installed and started in the distributions they claim to support,
      # including the ones they must refuse. This runs in a dry run too: it is the part of a
      # release most worth checking before publishing anything.
      - name: Test the packages
        if: matrix.arch == 'amd64'
        run: ./packaging/test-install.sh dist

      - name: Test the packages under systemd
        if: matrix.arch == 'amd64'
        run: ./packaging/test-systemd.sh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dry run builds the image and does not push it, which is what makes the Dockerfile
      # itself checkable without a registry write.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    # Skipped entirely in a dry run: it merges tags that were never pushed, so there is nothing
    # for it to read. This is the one job a dry run cannot exercise at all.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch was pushed as its own tag by the (native, no-QEMU) `docker` job above; this
      # merges them into one multi-arch manifest.
      #
      # The image tag is the bare prerelease tag, `20260830-1`, with no leading `v`. The
      # released images carry one (`:v0.50.0` exists, `:0.50.0` does not), and that convention
      # holds for versions; a date is not a version, so prefixing it would only make the two
      # kinds of tag look alike in a listing where telling them apart is the point.
      #
      # No `latest`. That is what an unqualified `docker pull` takes, and moving it here would
      # point it at a prerelease newer than the newest release, so anyone who did not name a tag
      # would silently get one.
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  # Pulls the manifest that was just published and boots it against a real database. Nothing
  # before this point runs the actual release image: a release-profile-only fault, or a
  # Dockerfile stage that only breaks in the published image, would otherwise ship unnoticed.
  #
  # Runs before github-release deliberately, so a failure here leaves a tag and images but no
  # Release, which is the state that reads as "did not finish" rather than as "shipped".
  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          psql "postgres://yorishiro:secret@127.0.0.1:5432/yorishiro" \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e QUEUE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e HOST=http://127.0.0.1:5150 \
            -e YORISHIRO_EMBEDDING_BASE_URL=http://localhost:1 \
            -e YORISHIRO_EMBEDDING_MODEL=unused \
            "${IMAGE}:${TAG}"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5150/_ping >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:5150/_ping || {
            echo "::error::the published image never answered /_ping" >&2
            docker logs smoke
            exit 1
          }
          docker rm -f smoke

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      # Count what is about to be published, before publishing it.
      #
      # A glob matching nothing is not an error to the upload action, which is precisely why a
      # list of files cannot prove its own coverage, and this counts instead. One package per
      # format per architecture, and nothing else: two, not master's four, because there is no
      # community package.
      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          expect '*.deb' 2
          expect '*.rpm' 2
          exit "$status"

      # One checksum file over everything published, so a download can be verified without a
      # signing key to distribute, rotate and have people trust. The same mechanism this
      # workflow already relies on for nfpm itself.
      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      # What the packages are and where they came from, without a signing key to distribute,
      # rotate or have anyone trust. `gh attestation verify <file> --repo yotsunagi/yorishiro`
      # answers "this artifact was built by this workflow, from this commit".
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          # The version mismatch, stated where the people who meet it will be: someone who
          # downloads a prerelease, checks out its tag and rebuilds. They get `0.1.0`, and
          # nothing else in the repository would tell them why.
          body: |
            Prerelease built from `develop`. The tag is the UTC date and the run within that
            day, not a version: `develop` has not claimed a version number, and nothing here
            makes it claim one.

            **`yorishiro version` reports `0.1.0`, and that is not a mistake.** `0.1.0` is what
            `develop`'s `Cargo.toml` holds, and it is compiled in. The prerelease this binary
            came from is the second half of that string:

            ```
            0.1.0 (${{ needs.prepare.outputs.tag }})
            ```

            The packages themselves are versioned `${{ needs.prepare.outputs.tag }}`, so
            `dpkg -l` and `rpm -q` name the prerelease directly.

            Commit: ${{ github.sha }}

            Packages carry both editions in one binary. The paid features stay inactive until
            `YORISHIRO_LICENSE_KEY` is set.
