name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yotsunagi/yorishiro

permissions:
  contents: write
  packages: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            arch: amd64
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Build
        run: cargo build --release -p yorishiro-server

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/yorishiro-server-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" \
            -C target/release yorishiro-server

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "target/release/yorishiro-server.exe" `
            -DestinationPath "dist/yorishiro-server-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ matrix.arch }}
          path: dist/*

  docker:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch was pushed as its own tag by the (native, no-QEMU) `docker` job above;
      # this merges them into one multi-arch manifest under the version and `latest` tags.
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64" \
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64"

  github-release:
    needs: binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
