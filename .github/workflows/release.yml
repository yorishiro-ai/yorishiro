name: Release (SemVer)

# One dispatch cuts a SemVer release from `develop`: bumps `Cargo.toml`, builds, packages,
# publishes images, and publishes a GitHub Release.
#
# SemVer releases use `vX.Y.Z` tags and are what `Cargo.toml`'s version field represents. A
# SemVer release bumps the manifest, tags the commit, then runs the full build pipeline.
#
# Prereleases use a different workflow (`release_pre.yml`) with date-based tags (`YYYYMMDD-N`)
# and do not modify `Cargo.toml`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version without v prefix (e.g. 0.100.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match X.Y.Z (no v prefix): '$VERSION'" >&2
            exit 1
          fi

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "$TAG"; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi

          BRANCH="release/prepare-${TAG}"
          git checkout -b "$BRANCH" develop

          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

          cargo generate-lockfile 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to commit (version may already be set)." >&2
            git checkout develop
            git branch -D "$BRANCH"
          else
            git commit -m "Bump version to ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from $(git rev-parse HEAD)"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git checkout develop
            git branch -D "$BRANCH"
            exit 0
          fi

          git push origin "$BRANCH"
          git tag "$TAG"
          git push origin "$TAG"
          git push origin "$BRANCH:develop"
          git branch -D "$BRANCH"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Build
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release --bin yorishiro

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) asset_arch=x86_64 ;;
            arm64) asset_arch=arm64 ;;
            *) echo "no nfpm asset known for arch '$ARCH'" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          asset="nfpm_${NFPM_VERSION}_Linux_${asset_arch}.tar.gz"

          curl -fsSL -o /tmp/nfpm.tar.gz "${base}/${asset}"
          curl -fsSL -o /tmp/nfpm-checksums.txt "${base}/checksums.txt"
          ( cd /tmp && cp nfpm.tar.gz "$asset" \
            && sha256sum --check --ignore-missing --strict nfpm-checksums.txt \
            && rm -f "$asset" )
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Package (deb and rpm)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          for pkg in deb rpm; do
            nfpm package --config packaging/nfpm-yorishiro.yaml --packager "$pkg" --target dist/
          done
          ls -1 dist/

      - name: Test the packages
        run: ./packaging/test-install.sh dist

      - name: Test the packages under systemd
        run: ./packaging/test-systemd.sh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
          - os: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04

    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          psql "postgres://yorishiro:secret@127.0.0.1:5432/yorishiro" \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e QUEUE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e HOST=http://127.0.0.1:5150 \
            -e YORISHIRO_EMBEDDING_BASE_URL=http://localhost:1 \
            -e YORISHIRO_EMBEDDING_MODEL=unused \
            "${IMAGE}:${TAG}"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5150/_ping >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:5150/_ping || {
            echo "::error::the published image never answered /_ping" >&2
            docker logs smoke
            exit 1
          }
          docker rm -f smoke

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          expect '*.deb' 2
          expect '*.rpm' 2
          exit "$status"

      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Release ${{ needs.prepare.outputs.tag }} built from `develop`.

            Commit: ${{ github.sha }}

            Packages carry both editions in one binary. The paid features stay inactive until
            `YORISHIRO_LICENSE_KEY` is set.
