name: Release (SemVer)

# One dispatch builds, verifies, and publishes a SemVer release from `develop`.
#
# SemVer releases use `vX.Y.Z` tags and build from the matching Cargo version.
#
# Prereleases use `pre-YYYYMMDD-N` tags and do not modify `Cargo.toml`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version without v prefix (e.g. 0.100.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: read

# One release at a time: two dispatches racing would race on tags and on develop.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      commit: ${{ steps.snapshot.outputs.commit }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/prepare-stable-source
        id: snapshot
        with:
          version: ${{ inputs.version }}

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if [ "$DRY_RUN" != "true" ]; then
            existing=$(git ls-remote --refs origin "refs/tags/${TAG}")
            if [ -n "$existing" ]; then
              echo "Tag ${TAG} already exists on remote." >&2
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/prepare-stable-source
        with:
          version: ${{ inputs.version }}

      - uses: ./.github/actions/build-and-package
        with:
          edition: ${{ matrix.edition }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          version: ${{ inputs.version }}
          build-tag: ${{ needs.prepare.outputs.tag }}

  package-tests:
    needs: [binary, prepare]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/prepare-stable-source
        with:
          version: ${{ inputs.version }}

      - uses: ./.github/actions/package-tests
        with:
          version: ${{ inputs.version }}

  docker:
    needs: [prepare, package-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
          - os: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/prepare-stable-source
        with:
          version: ${{ inputs.version }}

      - uses: ./.github/actions/build-docker
        with:
          image: ${{ env.IMAGE_NAME }}
          tag: ${{ needs.prepare.outputs.tag }}
          source: ${{ needs.prepare.outputs.commit }}
          arch: ${{ matrix.arch }}
          push: ${{ !inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        edition: [ce, ee]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/docker-manifest
        with:
          image: ${{ env.IMAGE_NAME }}
          source: ${{ needs.prepare.outputs.commit }}
          edition: ${{ matrix.edition }}
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    strategy:
      matrix:
        edition: [ce, ee]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/smoke
        with:
          image: ${{ env.IMAGE_NAME }}
          source: ${{ needs.prepare.outputs.commit }}
          edition: ${{ matrix.edition }}
          token: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: 'yorishiro-*.{tar.gz,deb,rpm}'
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: checksums.txt

      - name: Verify release checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.deb *.rpm > "$RUNNER_TEMP/release-checksums.txt"
          diff -u checksums.txt "$RUNNER_TEMP/release-checksums.txt"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-manifest-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-smoke-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true

      - uses: ./.github/actions/prepare-stable-source
        id: snapshot
        with:
          version: ${{ inputs.version }}

      - name: Publish the verified commit and tag together
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.prepare.outputs.ref }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          SNAPSHOT: ${{ steps.snapshot.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$COMMIT" = "$SNAPSHOT"
          token_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${token_header}"
          existing=$(git ls-remote --refs origin "refs/tags/${TAG}")
          if [ -n "$existing" ]; then
            # A retry can continue after a successful atomic push.
            test "$existing" = "$(printf '%s\trefs/tags/%s' "$COMMIT" "$TAG")"
          else
            git push --atomic --force-with-lease="refs/heads/develop:$BASE" \
              --force-with-lease="refs/tags/${TAG}:" origin \
              "${COMMIT}:refs/heads/develop" "${COMMIT}:refs/tags/${TAG}"
          fi

      - name: Promote only smoke-verified image digests
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          SOURCE: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/release_images.py promote --image "$IMAGE" --source "$SOURCE" --run-id "$RUN_ID" --tag "$TAG" --directory "$RUNNER_TEMP/release-images"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Release ${{ needs.prepare.outputs.tag }} built from `${{ github.ref_name }}`.

            Commit: ${{ needs.prepare.outputs.commit }}

            CE and EE are published as separate compile-time artifacts.
