name: Documentation Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if source changes lack documentation updates
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const srcChanged = files.some(f =>
              f.filename.startsWith('crates/') &&
              f.filename.endsWith('.rs') &&
              !f.filename.includes('/tests/')
            );
            const docsChanged = files.some(f =>
              f.filename.startsWith('docs/') ||
              f.filename === 'README.md'
            );
            const migrationChanged = files.some(f =>
              f.filename.startsWith('migrations/')
            );
            const configChanged = files.some(f =>
              f.filename.includes('config') ||
              f.filename === '.env.example' ||
              f.filename === 'config.example.yml'
            );

            const warnings = [];

            if (srcChanged && !docsChanged) {
              warnings.push('⚠️ **Source code changed but no docs updated.** If this PR adds/changes API endpoints, configuration, or user-facing behavior, please update `docs/` (English + Japanese).');
            }

            if (migrationChanged && !docsChanged) {
              warnings.push('⚠️ **Database migration added but no docs updated.** New tables/columns should be documented in the technical spec and configuration docs.');
            }

            if (configChanged && !docsChanged) {
              warnings.push('⚠️ **Configuration changed but no docs updated.** New env vars should be documented in `docs/configuration.md` (English + Japanese), `.env.example`, and `config.example.yml`.');
            }

            // Check i18n sync: if English docs changed, Japanese should too
            const enDocsChanged = files.filter(f =>
              f.filename.startsWith('docs/') &&
              !f.filename.startsWith('docs/ja/')
            );
            const jaDocsChanged = files.filter(f =>
              f.filename.startsWith('docs/ja/')
            );
            if (enDocsChanged.length > 0 && jaDocsChanged.length === 0) {
              warnings.push('⚠️ **English docs updated but Japanese docs not synced.** Please update `docs/ja/` to match.');
            }

            if (warnings.length > 0) {
              const body = `## Documentation Reminder\n\n${warnings.join('\n\n')}\n\n_This is an automated check. Dismiss if docs are intentionally unchanged._`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
