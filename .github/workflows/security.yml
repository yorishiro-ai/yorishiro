name: Security

# Split out of ci.yml: this only needs to re-run when the dependency graph or the audit's own
# ignore list changes, and folding it into ci.yml's union of paths would mean either it never
# gets its own filter or every other ci.yml job inherits its narrower one.
# dep-audit.yml's weekly schedule covers the case this can't: an advisory published against a
# dependency this repo already carries, with no local change to trigger a re-check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - "patches/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Dependency security audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run security audit
        run: cargo audit --file Cargo.lock
