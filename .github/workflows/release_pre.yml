name: Release (prerelease)

# One dispatch cuts a prerelease from `develop`: build, package, publish images, publish a
# GitHub Release marked prerelease.
#
# Prereleases are numbered by date and run: `YYYYMMDD-N`, which is outside SemVer entirely. A
# prerelease tag has no `v` prefix, so it never looks like a version in a `docker images` listing.
#
# Releases use `vX.Y.Z` and bump `Cargo.toml`; a prerelease does neither. See
# `.github/workflows/release.yml` for the SemVer release path.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: read

# One release at a time: two dispatches racing would race on tags and on develop.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATE="$(date -u +%Y%m%d)"
          existing="$(git ls-remote --tags origin \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' \
            | grep -E "^${DATE}-[0-9]+$" | sed "s|^${DATE}-||" | sort -n | tail -1)"
          TAG="${DATE}-$(( ${existing:-0} + 1 ))"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from ${GITHUB_SHA}"
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ee
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: ./.github/actions/build-and-package
        with:
          edition: ${{ matrix.edition }}
          target: ${{ matrix.target }}
          tag: ${{ needs.prepare.outputs.tag }}

  package-tests:
    needs: [binary, prepare]
    runs-on: ubuntu-26.04
    steps:
      - uses: ./.github/actions/package-tests
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          ce_package: "dist/yorishiro-ce-${{ needs.prepare.outputs.tag }}-amd64.deb"
          ee_package: "dist/yorishiro-ee-${{ needs.prepare.outputs.tag }}-amd64.deb"

  docker:
    needs: [prepare, package-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ee
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write

    steps:
      - uses: ./.github/actions/build-docker
        with:
          edition: ${{ matrix.edition }}
          tag: ${{ needs.prepare.outputs.tag }}
          arch: ${{ matrix.arch }}
          push: ${{ !inputs.dry_run }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        edition: [ce, ee]

    steps:
      - uses: ./.github/actions/docker-manifest
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          edition: ${{ matrix.edition }}

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    strategy:
      matrix:
        edition: [ce, ee]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: ./.github/actions/smoke
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          edition: ${{ matrix.edition }}

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                expect "yorishiro-${edition}-${{ needs.prepare.outputs.tag }}-${arch}.${ext}" 1
              done
            done
          done
          exit "$status"

      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - name: Tag the verified prerelease commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          token_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${token_header}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote." >&2
            exit 1
          fi
          git tag "$TAG" "$REF"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v6
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Prerelease ${{ needs.prepare.outputs.tag }} built from `develop`.

            Commit: ${{ github.sha }}

            CE and EE are published as separate compile-time artifacts.
