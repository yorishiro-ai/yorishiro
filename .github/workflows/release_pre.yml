name: Release (prerelease)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-pipeline.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      dry_run: ${{ inputs.dry_run }}
      prerelease: true
