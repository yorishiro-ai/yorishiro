name: Release (prerelease)

# One dispatch cuts a prerelease from `develop`: build, package, publish images, publish a
# GitHub Release marked prerelease.
#
# Prereleases are numbered by date and run: `YYYYMMDD-N`, which is outside SemVer entirely. A
# prerelease tag has no `v` prefix, so it never looks like a version in a `docker images` listing.
#
# Releases use `vX.Y.Z` and bump `Cargo.toml`; a prerelease does neither. See
# `.github/workflows/release.yml` for the SemVer release path.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without publishing anything'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yorishiro-ai/yorishiro

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}

    steps:
      - name: Check the dispatch ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "A real release must be dispatched from develop (got $GITHUB_REF)." >&2
            echo "Dispatch with dry_run=true to check the workflow from another branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan the release
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATE="$(date -u +%Y%m%d)"
          existing="$(git ls-remote --tags origin \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' \
            | grep -E "^${DATE}-[0-9]+$" | sed "s|^${DATE}-||" | sort -n | tail -1)"
          TAG="${DATE}-$(( ${existing:-0} + 1 ))"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would tag ${TAG}, building from ${GITHUB_SHA}"
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Build
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "${{ matrix.edition }}" = ce ]; then
            cargo build --locked --no-default-features --release --bin yorishiro
          else
            cargo build --locked --features enterprise --release --bin yorishiro
          fi

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          ARCH: ${{ matrix.arch }}
          EDITION: ${{ matrix.edition }}
        run: |
          case "$ARCH" in
            amd64) asset_arch=x86_64 ;;
            arm64) asset_arch=arm64 ;;
            *) echo "no nfpm asset known for arch '$ARCH'" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          asset="nfpm_${NFPM_VERSION}_Linux_${asset_arch}.tar.gz"

          curl -fsSL -o /tmp/nfpm.tar.gz "${base}/${asset}"
          curl -fsSL -o /tmp/nfpm-checksums.txt "${base}/checksums.txt"
          ( cd /tmp && cp nfpm.tar.gz "$asset" \
            && sha256sum --check --ignore-missing --strict nfpm-checksums.txt \
            && rm -f "$asset" )
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Package (deb and rpm)
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          EDITION: ${{ matrix.edition }}
        run: |
          mkdir -p dist
          case "$ARCH" in amd64) rpm_arch=x86_64 ;; arm64) rpm_arch=aarch64 ;; esac
          for pkg in deb rpm; do
             nfpm package --config "packaging/nfpm-yorishiro-${EDITION}.yaml" --packager "$pkg" --target dist/
             if [ "$pkg" = deb ]; then
               source="dist/yorishiro-${EDITION}_${VERSION}_${ARCH}.deb"
             else
               source="dist/yorishiro-${EDITION}-${VERSION}-1.${rpm_arch}.rpm"
             fi
             mv "$source" "dist/yorishiro-${EDITION}-${VERSION}-${ARCH}.${pkg}"
          done
          ls -1 dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: binary-linux-${{ matrix.edition }}-${{ matrix.arch }}
          path: dist/*

  package-tests:
    needs: [binary, prepare]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Install package tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev rpm
      - name: Assert exact artifacts and metadata
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                test -f "dist/yorishiro-${edition}-${VERSION}-${arch}.${ext}"
              done
            done
          done
          test "$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)" -eq 8
          for f in dist/*.deb; do
            dpkg-deb -I "$f" | grep -E 'Conflicts:.*yorishiro|Replaces:.*yorishiro'
          done
          for f in dist/*.rpm; do
            rpm -qp --conflicts "$f" | grep -Eq '^(yorishiro|yorishiro-ce|yorishiro-ee)$'
            rpm -qp --obsoletes "$f" | grep -Eq '^(yorishiro|yorishiro-ce|yorishiro-ee)$'
          done
      - name: Build retired unified packages for migration tests
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          ARCH: amd64
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          mkdir -p target/release /tmp/unified
          dpkg-deb -x "dist/yorishiro-ce-${VERSION}-amd64.deb" /tmp/ce
          cp /tmp/ce/usr/bin/yorishiro target/release/yorishiro
          nfpm package --config packaging/nfpm-yorishiro-unified.yaml --packager deb --target /tmp/unified
          nfpm package --config packaging/nfpm-yorishiro-unified.yaml --packager rpm --target /tmp/unified
          mv "/tmp/unified/yorishiro_${VERSION}_amd64.deb" "/tmp/unified/yorishiro-${VERSION}-amd64.deb"
          mv "/tmp/unified/yorishiro-${VERSION}-1.x86_64.rpm" "/tmp/unified/yorishiro-${VERSION}-amd64.rpm"
      - name: Test package transitions and co-install refusal
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: ./packaging/test-transitions.sh dist /tmp/unified "$VERSION"
      - name: Test representative installed packages
        run: |
          ./packaging/test-install.sh "dist/yorishiro-ce-${{ needs.prepare.outputs.tag }}-amd64.deb"
          ./packaging/test-systemd.sh "dist/yorishiro-ee-${{ needs.prepare.outputs.tag }}-amd64.deb"

  docker:
    needs: [prepare, package-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
            edition: ce
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ce
          - os: ubuntu-26.04
            arch: amd64
            edition: ee
          - os: ubuntu-26.04-arm
            arch: arm64
            edition: ee
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          provenance: false
          build-args: EDITION=${{ matrix.edition }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.edition }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        edition: [ce, ee]

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EDITION: ${{ matrix.edition }}
        run: |
          docker buildx imagetools create \
             -t "${IMAGE}:${TAG}-${EDITION}" \
             "${IMAGE}:${TAG}-${EDITION}-amd64" \
             "${IMAGE}:${TAG}-${EDITION}-arm64"

  smoke:
    needs: [docker-manifest, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        edition: [ce, ee]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          psql "postgres://yorishiro:secret@127.0.0.1:5432/yorishiro" \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e QUEUE_URL=postgres://yorishiro:secret@127.0.0.1:5432/yorishiro \
            -e HOST=http://127.0.0.1:5150 \
            -e YORISHIRO_EMBEDDING_BASE_URL=http://localhost:1 \
            -e YORISHIRO_EMBEDDING_MODEL=unused \
            "${IMAGE}:${TAG}-${{ matrix.edition }}"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5150/_ping >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:5150/_ping || {
            echo "::error::the published image never answered /_ping" >&2
            docker logs smoke
            exit 1
          }
          docker rm -f smoke

  github-release:
    needs: [binary, smoke, prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Every documented artifact is present
        run: |
          status=0
          expect() {
            n=$(find dist -maxdepth 1 -name "$1" | wc -l)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 matching '$1', found $n" >&2
              status=1
            else
              echo "ok: $1 ($n)"
            fi
          }
          for edition in ce ee; do
            for arch in amd64 arm64; do
              for ext in deb rpm; do
                expect "yorishiro-${edition}-${{ needs.prepare.outputs.tag }}-${arch}.${ext}" 1
              done
            done
          done
          exit "$status"

      - name: Checksums
        run: |
          ( cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' > checksums.txt )
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.deb, dist/*.rpm'

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          body: |
            Prerelease ${{ needs.prepare.outputs.tag }} built from `develop`.

            Commit: ${{ github.sha }}

            CE and EE are published as separate compile-time artifacts.
