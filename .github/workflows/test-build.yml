name: Build the binary

on:
  workflow_call:
    inputs:
      edition:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build binary (${{ inputs.edition }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      EDITION: ${{ inputs.edition }}
      CARGO_PROFILE_DEV_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: binary-${{ inputs.edition }}-debug
      - name: Build the binary
        run: |
          case "$EDITION" in ce) features=community ;; ee) features=enterprise ;; *) exit 1 ;; esac
          cargo build --locked --no-default-features --features "$features" --bin yorishiro
          tar -C target/debug -czf "$RUNNER_TEMP/binary-$EDITION.tar.gz" yorishiro
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ inputs.edition }}
          path: ${{ runner.temp }}/binary-${{ inputs.edition }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
