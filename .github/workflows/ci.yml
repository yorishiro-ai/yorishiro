name: CI

# Compile each edition once for inventory, then execute its reviewed responsibilities.
# Schema regeneration and documentation tests remain separate validation responsibilities.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  EMBEDDING_MODEL_REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
  EMBEDDING_MODEL_ID: intfloat/multilingual-e5-base
  EMBEDDING_MODEL_SHORT_ID: multilingual-e5-base
  EMBEDDING_MODEL_REMOTE_PATH: model.safetensors
  EMBEDDING_MODEL_LOCAL_NAME: model.safetensors
  EMBEDDING_MODEL_SHA256: a18a44fad1d0b46ded15928144138cff1135d5cc8233bdd90be5f18822de09a7
  EMBEDDING_MODEL_SIZE: "1112201288"
  EMBEDDING_TOKENIZER_REMOTE_PATH: tokenizer.json
  EMBEDDING_TOKENIZER_LOCAL_NAME: tokenizer.json
  EMBEDDING_TOKENIZER_SHA256: 62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb75626
  EMBEDDING_TOKENIZER_SIZE: "17082660"

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-26.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      rust_validation: ${{ steps.classify.outputs.rust_validation }}
      package_validation: ${{ steps.classify.outputs.package_validation }}
      package_build: ${{ steps.classify.outputs.package_build }}
      docker_validation: ${{ steps.classify.outputs.docker_validation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" != pull_request ]]; then args+=(--full); fi
          python3 scripts/classify_ci_changes.py "${args[@]}"

  ce:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Community edition
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ce
      - name: Clippy CE without enterprise code
        run: make clippy-ce
      # Runtime tests consume the inventory binaries through reviewed assignments.

  check:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Enterprise edition
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python tools
        run: uv sync --locked

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify the validation compiler is the declared minimum
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tomllib
          minimum = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['rust-version']
          configured = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          assert minimum == configured == actual, (minimum, configured, actual)
          PY

      - name: Check generated entity hardener
        run: uv run scripts/test_harden_generated_entities.py

      - name: Python lint
        run: make python-lint

      - name: Verify topology gate rejects a mismatch without Cargo
        env:
          DATABASE_URL: sqlite:///tmp/yorishiro-gate-check.sqlite3?mode=rwc
          LOCO_ENV: test_sqlite
        run: |
          set +e
          stderr="$RUNNER_TEMP/topology-mismatch.stderr"
          output=$(python3 scripts/test_topology.py postgres-redis models::maintenance:: 2>"$stderr")
          status=$?
          set -e
          echo "$output"
          cat "$stderr"
          if [ "$status" -eq 0 ] || ! grep -Fxq "YORISHIRO_TOPOLOGY_REJECTED" "$stderr"; then
            echo "ERROR: expected the topology wrapper's mismatch rejection, not success or an unrelated failure"
            exit 1
          fi

      - name: Check test harness usage
        run: |
          # Only tests/requests/mod.rs may call the raw loco helpers directly.
          # All other test files must use boot_request/boot_request_sqlite instead.
          if git grep -l 'request_with_create_db::<\|request_with_create_sqlite::<' -- tests/ ':!tests/requests/mod.rs'; then
            echo "ERROR: call boot_request/boot_request_sqlite instead of the raw loco helper directly"
            exit 1
          fi

      - name: Check that tests live in tests/
        run: make test-location-check

      - name: Check for debug-only macros
        run: make debug-macro-check

      - name: Check the edition boundary
        run: make edition-boundary-check

      - name: Check pinned versions agree
        # Service containers start before checkout and cannot read repository configuration.
        run: |
          for pattern in 'pgvector/pgvector:[A-Za-z0-9.-]+' 'valkey/valkey:[A-Za-z0-9.-]+'; do
            found="$(grep -rhoE "$pattern" .github docker-compose.yml Dockerfile Makefile | grep -oE '[0-9][0-9.]*$' | sort -u)"
            if [ "$(wc -l <<<"$found")" -ne 1 ]; then
              echo "::error::pinned versions disagree for '$pattern':"
              echo "$found"
              exit 1
            fi
          done

      - name: Check for allow(dead_code)
        run: make dead-code-allow-check

      - name: Check doc links
        run: cargo doc --no-deps --workspace --features enterprise
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

      - name: Clippy
        # Keep CI aligned with rust-analyzer: every target and public API documentation.
        # Complexity debt is report-only; all other existing strict lints remain errors.
        run: cargo clippy --locked --workspace --all-targets --features enterprise -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines

  prepare-embedding:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Models
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore multilingual-e5-base cache
        uses: actions/cache/restore@v6
        id: embedding-cache
        with:
          path: |
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

      - name: Reject an uncacheable fork pull request miss
        if: steps.embedding-cache.outputs.cache-hit != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Repository policy requires a trusted-branch embedding cache for fork pull requests. Re-run after that cache is populated."
          exit 1

      - name: Prepare and verify multilingual-e5-base artifacts
        env:
          CACHE_DIR: ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}
          CACHE_HIT: ${{ steps.embedding-cache.outputs.cache-hit }}
          MODEL_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_MODEL_REMOTE_PATH }}
          TOKENIZER_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_TOKENIZER_REMOTE_PATH }}
        run: python3 scripts/embedding_cache.py prepare

      - name: Save verified multilingual-e5-base cache
        if: steps.embedding-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

  schema-generation:
    name: Schema generation (PostgreSQL)
    needs: [changes, test-inventory-ce]
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      LOCO_ENV: test_postgres
      DB_CONNECT_TIMEOUT: "5000"
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - uses: ./.github/actions/sea-orm-cli
      - uses: actions/download-artifact@v8
        with:
          name: test-executables-ce
          path: ${{ runner.temp }}/executables
      - name: Restore the inventory main binary
        run: |
          tar -xzf "$RUNNER_TEMP/executables/test-executables-ce.tar.gz" target/debug/yorishiro
          test -x target/debug/yorishiro

      - name: Bootstrap PostgreSQL extensions and non-superuser migration identity
        env:
          POSTGRES_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d template1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE ROLE yorishiro LOGIN PASSWORD 'yorishiro' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;" \
            -c 'CREATE DATABASE yorishiro OWNER yorishiro;'

      - name: Run migrations with the inventory binary
        run: ./target/debug/yorishiro db migrate

      - name: Verify _entities/ matches a fresh regen
        run: |
          # Diagnose: confirm the migration-created tables actually exist.
          # This is the branching point if db entities ever produces 0 files again.
          docker exec ${{ job.services.db.id }} psql -U postgres -d yorishiro -c '\dt'
          # Run db entities (the determinism check).
          count_before=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          rm -f src/models/_entities/*.rs
          ./target/debug/yorishiro db entities
          python3 scripts/harden_generated_entities.py
          count=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          if [ "$count" -lt 10 ]; then
            echo "ERROR: Expected at least 10 entity files, got $count after db entities."
            exit 1
          fi
          echo "Generated $count entity files (had $count_before before)"
          git diff --exit-code -- src/models/_entities

  public-contract:
    name: Public contracts (SQLite, ${{ matrix.suite }})
    needs: [changes, test-inventory-ce]
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [rest, mcp, cli]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-ce
          path: ${{ runner.temp }}/binary
      - name: Restore the built binary
        run: tar -xzf "$RUNNER_TEMP/binary/public-contract-ce.tar.gz" -C "$RUNNER_TEMP/binary"
      - name: Exercise the public interface through real processes
        run: >-
          python3 tests/blackbox/run.py
          --binary "$RUNNER_TEMP/binary/yorishiro"
          --suite "${{ matrix.suite }}"
          --edition ce
          --artifacts "$RUNNER_TEMP/contracts"
      - name: Upload redacted logs and scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-contract-result-ce-${{ matrix.suite }}
          path: ${{ runner.temp }}/contracts
          if-no-files-found: error
          retention-days: 7

  public-contract-verify:
    name: Verify public-contract coverage
    needs: [changes, test-inventory-ce, public-contract]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the report and runner failure guards
        run: |
          python3 tests/ci/test_blackbox_reports.py
          python3 -m unittest discover -s tests/blackbox -p 'test_*.py'
          python3 tests/blackbox/run.py --self-check
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-ce
          path: ${{ runner.temp }}/binary
      - uses: actions/download-artifact@v8
        with:
          pattern: public-contract-result-ce-*
          path: ${{ runner.temp }}/reports
      - name: Require every assigned scenario on the same binary
        run: |
          tar -xzf "$RUNNER_TEMP/binary/public-contract-ce.tar.gz" -C "$RUNNER_TEMP/binary"
          python3 scripts/check_blackbox_reports.py --edition ce --binary "$RUNNER_TEMP/binary/yorishiro" --reports "$RUNNER_TEMP/reports"

  test-inventory-ce:
    name: Community test artifacts
    needs: changes
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    uses: ./.github/workflows/test-build.yml
    with:
      edition: ce

  test-inventory-ee:
    name: Enterprise test artifacts
    needs: changes
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    uses: ./.github/workflows/test-build.yml
    with:
      edition: ee

  test-assignment-verify:
    name: Verify compiled test assignment
    needs: [changes, test-inventory-ce, test-inventory-ee]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      core_matrix: ${{ steps.matrix.outputs.core_matrix }}
      e5_matrix: ${{ steps.matrix.outputs.e5_matrix }}
      has_core: ${{ steps.matrix.outputs.has_core }}
      has_e5: ${{ steps.matrix.outputs.has_e5 }}
    steps:
      - uses: actions/checkout@v7
      - name: Exercise assignment failure guards
        run: python3 tests/ci/test_assignments.py
      - uses: actions/download-artifact@v8
        with:
          pattern: test-inventory-*
          path: ${{ runner.temp }}/inventories
          merge-multiple: true
      - name: Join both compiled editions to reviewed responsibilities
        id: plan
        run: >-
          python3 scripts/test_assignments.py verify
          --ce "$RUNNER_TEMP/inventories/inventory-ce.json"
          --ee "$RUNNER_TEMP/inventories/inventory-ee.json"
          --output "$RUNNER_TEMP/test-assignments.json"
      - name: Publish responsibility matrix
        id: matrix
        run: |
          python3 - "$RUNNER_TEMP/test-assignments.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert plan['execution_matrix_ready'], plan['cutover_blockers']
          with open(sys.argv[2], 'a') as output:
               output.write('matrix=' + json.dumps(plan['execution_matrix'], separators=(',', ':')) + '\n')
               for name in ('core_matrix', 'e5_matrix'):
                   output.write(name + '=' + json.dumps(plan[name], separators=(',', ':')) + '\n')
                   output.write('has_' + name.removesuffix('_matrix') + '=' + str(bool(plan[name]['include'])).lower() + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: test-assignments
          path: ${{ runner.temp }}/test-assignments.json
          if-no-files-found: error
          retention-days: 7

  assigned-tests:
    name: Responsibility tests
    needs: [changes, test-assignment-verify]
    if: ${{ needs.changes.outputs.rust_validation == 'true' && needs.test-assignment-verify.outputs.has_core == 'true' }}
    uses: ./.github/workflows/assigned-tests.yml
    with:
      matrix: ${{ needs.test-assignment-verify.outputs.core_matrix }}
    secrets:
      YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}

  assigned-e5-tests:
    name: E5 resource tests
    needs: [changes, prepare-embedding, test-assignment-verify]
    if: ${{ needs.changes.outputs.rust_validation == 'true' && needs.test-assignment-verify.outputs.has_e5 == 'true' }}
    uses: ./.github/workflows/assigned-tests.yml
    with:
      matrix: ${{ needs.test-assignment-verify.outputs.e5_matrix }}
    secrets:
      YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}

  assigned-test-verify:
    name: Verify assigned execution receipts
    needs: [changes, assigned-tests, assigned-e5-tests, test-assignment-verify]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exercise execution receipt guards
        run: |
          python3 tests/ci/test_assigned_execution.py
          python3 tests/ci/test_assigned_workflow.py
          python3 tests/ci/test_release_images.py
          python3 tests/ci/test_coverage_workflow.py
      - uses: actions/download-artifact@v8
        with:
          name: test-assignments
          path: ${{ runner.temp }}/assignments
      - uses: actions/download-artifact@v8
        with:
          pattern: assigned-test-result-*
          path: ${{ runner.temp }}/receipts
      - name: Require every assigned identity and topology
        run: >-
          python3 scripts/run_assigned_tests.py verify
          --assignments "$RUNNER_TEMP/assignments/test-assignments.json"
          --receipts "$RUNNER_TEMP/receipts"
          --output "$RUNNER_TEMP/assigned-execution.json"
      - uses: actions/upload-artifact@v7
        with:
          name: assigned-execution
          path: ${{ runner.temp }}/assigned-execution.json
          if-no-files-found: error
          retention-days: 7

  package-validation:
    name: Package validation
    needs: [changes, package-build]
    if: ${{ always() && needs.changes.result == 'success' && needs.package-build.result == 'success' && needs.changes.outputs.package_validation == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/package-tests
        with:
          version: 0.0.1~pre.${{ github.run_number }}
          image-tag: ${{ github.sha }}

  package-build:
    name: Package build (${{ matrix.edition }}, ${{ matrix.arch }})
    needs: [changes, ce, check]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.package_build == 'true' && (needs.changes.outputs.rust_validation != 'true' || (needs.ce.result == 'success' && needs.check.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ce
            arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
          - edition: ce
            arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
          - edition: ee
            arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
          - edition: ee
            arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-and-package
        with:
          edition: ${{ matrix.edition }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          version: 0.0.1~pre.${{ github.run_number }}
          build-tag: ${{ github.sha }}

  required-check:
    name: Required validation
    if: ${{ always() }}
    needs: [changes, ce, check, prepare-embedding, schema-generation, public-contract, public-contract-verify, test-inventory-ce, test-inventory-ee, test-assignment-verify, assigned-tests, assigned-e5-tests, assigned-test-verify, package-build, package-validation]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every selected validation
        env:
          FULL: ${{ needs.changes.outputs.full }}
          RUST: ${{ needs.changes.outputs.rust_validation }}
          PACKAGE: ${{ needs.changes.outputs.package_validation }}
          PACKAGE_BUILD_SELECTED: ${{ needs.changes.outputs.package_build }}
          CE: ${{ needs.ce.result }}
          EE: ${{ needs.check.result }}
          MODEL: ${{ needs.prepare-embedding.result }}
          SCHEMA: ${{ needs.schema-generation.result }}
          PUBLIC: ${{ needs.public-contract.result }}
          PUBLIC_VERIFY: ${{ needs.public-contract-verify.result }}
          INVENTORY_CE: ${{ needs.test-inventory-ce.result }}
          INVENTORY_EE: ${{ needs.test-inventory-ee.result }}
          ASSIGNMENT: ${{ needs.test-assignment-verify.result }}
          ASSIGNED: ${{ needs.assigned-tests.result }}
          E5: ${{ needs.assigned-e5-tests.result }}
          HAS_CORE: ${{ needs.test-assignment-verify.outputs.has_core }}
          HAS_E5: ${{ needs.test-assignment-verify.outputs.has_e5 }}
          RECEIPTS: ${{ needs.assigned-test-verify.result }}
          PACKAGE_RESULT: ${{ needs.package-validation.result }}
          PACKAGE_BUILD: ${{ needs.package-build.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]] || { echo "classifier ended $CHANGES" >&2; exit 1; }
          selected() { [[ "$1" == true ]]; }
          require_success() {
            local label=$1 result=$2 needed=$3
            if selected "$needed"; then
              [[ "$result" == success ]] || { echo "$label was selected but ended $result" >&2; exit 1; }
            else
              [[ "$result" == skipped ]] || { echo "$label was not selected but ended $result" >&2; exit 1; }
            fi
          }
          if [[ "$FULL" == true || "$RUST" == true ]]; then
            require_success CE "$CE" true
            require_success EE "$EE" true
            require_success MODEL "$MODEL" true
            require_success SCHEMA "$SCHEMA" true
            require_success PUBLIC "$PUBLIC" true
            require_success PUBLIC_VERIFY "$PUBLIC_VERIFY" true
            require_success INVENTORY_CE "$INVENTORY_CE" true
            require_success INVENTORY_EE "$INVENTORY_EE" true
            require_success ASSIGNMENT "$ASSIGNMENT" true
            require_success ASSIGNED "$ASSIGNED" "$HAS_CORE"
            require_success E5 "$E5" "$HAS_E5"
            require_success RECEIPTS "$RECEIPTS" true
          else
            require_success CE "$CE" false
            require_success EE "$EE" false
            require_success MODEL "$MODEL" false
            require_success SCHEMA "$SCHEMA" false
            require_success PUBLIC "$PUBLIC" false
            require_success PUBLIC_VERIFY "$PUBLIC_VERIFY" false
            require_success INVENTORY_CE "$INVENTORY_CE" false
            require_success INVENTORY_EE "$INVENTORY_EE" false
            require_success ASSIGNMENT "$ASSIGNMENT" false
            require_success ASSIGNED "$ASSIGNED" false
            require_success E5 "$E5" false
            require_success RECEIPTS "$RECEIPTS" false
          fi
          require_success PACKAGE_BUILD "$PACKAGE_BUILD" "$PACKAGE_BUILD_SELECTED"
          require_success PACKAGE "$PACKAGE_RESULT" "$PACKAGE"
          if selected "$PACKAGE_BUILD_SELECTED" && [[ "$FULL" == true || "$RUST" == true ]]; then
            [[ "$CE" == success && "$EE" == success ]] || {
              echo "package build prerequisites did not succeed" >&2
              exit 1
            }
          fi
