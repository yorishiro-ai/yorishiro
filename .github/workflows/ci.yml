name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The SPA is embedded into the binary from `ee/web/dist`, which is a build output and is
      # not committed -- so it has to be built before any cargo step, or `embeds_a_built_spa`
      # fails and every other web test passes against an empty embed. `pnpm run check` is the
      # web side's own gate (lint, format, typecheck, vitest) and ends in the build, so one step
      # covers both.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ee/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ee/web/pnpm-lock.yaml

      - name: Build the SPA
        run: |
          pnpm --dir ee/web install --frozen-lockfile
          pnpm --dir ee/web run check

      # sccache caches compiled objects by content hash, complementing rust-cache's file-level
      # target/ caching. Installing it is separate from using it: the action exports SCCACHE_PATH
      # and nothing else, so without the "Route rustc through sccache" step below sccache is
      # present and never invoked (measured: stats came back all-zero), and without
      # SCCACHE_GHA_ENABLED it caches to local disk on an ephemeral runner, which can never hit.
      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # Where ort-sys extracts the onnxruntime binary at build time. Not covered by the
          # default cache targets (~/.cargo, ./target), so without caching this the linker
          # fails to find the library on the second and later warm-cache CI runs.
          cache-directories: ~/.cache/ort.pyke.io
          # Shared with clippy-suggestions.yml (same shared-key) so that workflow -- which never
          # runs on master and so can never save under its own job-scoped key -- can still
          # restore the cache master writes here.
          shared-key: rust
          # PRs can only ever restore from master's cache and their own -- never write back to
          # master's key -- so only master needs to save. Letting every PR save left a growing
          # pile of per-branch caches that never got cleaned up until GitHub's 7-day/10GB evictions.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # After rust-cache, deliberately: rust-cache folds RUST*-prefixed env vars into its cache
      # key, so setting RUSTC_WRAPPER before it would change the key and orphan the cache master
      # already saved (measured: adding RUSTFLAGS earlier turned every restore into "No cache
      # found"). Still before the first cargo invocation below, which is all sccache needs.
      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: cargo sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      # The community package exists so a deployment can hold no proprietary code at all. That
      # is a property of the shipped artifact, not of the dependency graph, so it is checked on
      # the built binary: `cargo tree` would still pass if a symbol leaked in through a path the
      # manifest does not name.
      #
      # The same markers are asserted *present* in the paid binary. Without that half, a typo in
      # a pattern would make this step pass by matching nothing.
      - name: The community binary contains no paid code
        run: |
          cargo build --bin yorishiro-ce-server -p yorishiro-server
          cargo build --bin yorishiro-server -p yorishiro-hosted

          markers='hosted/stripe yorishiro_hosted api/marketplace LICENSE_KEY infer-fill'
          status=0

          for m in $markers; do
            if strings -a target/debug/yorishiro-ce-server | grep -q -- "$m"; then
              echo "::error::'$m' is present in the community binary, which must carry no ee/ code" >&2
              status=1
            fi
          done

          for m in $markers; do
            if ! strings -a target/debug/yorishiro-server | grep -q -- "$m"; then
              echo "::error::'$m' is absent from the paid binary, so the check above proves nothing" >&2
              status=1
            fi
          done

          [ "$status" -eq 0 ] && echo "community binary is clean; every marker discriminates"
          exit "$status"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Verifies the built binary actually boots and serves traffic, not just that it compiles
  # and its unit/integration tests pass -- `check` above never starts the real `main()`, so a
  # startup-only failure (a panicking `.expect()` in config/provider construction, a missing
  # env var only main.rs reads) would otherwise ship unnoticed until a real deploy.
  package-smoke:
    runs-on: ubuntu-latest
    # A cold `cargo build` here pulls in ort/tokenizers same as `check`'s clippy/test steps do,
    # but doesn't reuse their compiled artifacts (debug profile, different step) -- generous
    # even with the warm shared-key cache so a slow cold run doesn't misread as a real failure.
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      # The default "local" provider requires ONNX model files that aren't checked into git
      # (docker-compose mounts them from disk instead -- see models/ in .gitignore), so a bare
      # CI checkout can't load it. "openai" only builds an HTTP client at startup -- it never
      # connects until an actual embed() call, which this smoke test never makes -- so a
      # non-resolving placeholder URL is enough to boot without needing a real endpoint.
      YORISHIRO_EMBEDDING_PROVIDER: openai
      YORISHIRO_EMBEDDING_BASE_URL: http://localhost:1
      YORISHIRO_EMBEDDING_MODEL: smoke-test-unused

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io
          shared-key: rust
          save-if: false

      # After rust-cache -- see the note in the `check` job above.
      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # The embedded SPA is a build output; without it the binary links but serves a 404 at `/`,
      # which is exactly the kind of fault this job exists to catch before a deploy does.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ee/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ee/web/pnpm-lock.yaml

      - name: Build the SPA
        run: |
          pnpm --dir ee/web install --frozen-lockfile
          pnpm --dir ee/web run build

      - name: Build
        run: cargo build -p yorishiro-hosted

      # The binary migrates the database itself on startup, so no separate `sqlx migrate run`
      # step is needed here.
      - name: Boot and check /up
        run: |
          ./target/debug/yorishiro-server &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/up >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "server did not serve /up within 30s"; exit 1; }
          echo "server booted and served /up"

          # The one binary now serves the UI too, so a boot that answers /up while serving no
          # index.html is still a broken deploy. Asserted here rather than only in the embed
          # test, because this is the step that runs the real `main`.
          curl -fsS http://127.0.0.1:8081/ | grep -q "<html" \
            || { echo "server booted but served no SPA at /"; exit 1; }
          echo "server served the SPA at /"
