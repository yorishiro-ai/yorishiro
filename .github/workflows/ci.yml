name: CI

# Covers this repository's layout: the root package (`yorishiro`) and `migration/`, with the paid
# edition compiled in as the `ee/` module rather than a package of its own.
# Deliberately minimal: cargo check/clippy/fmt-check runs once, then test runs in parallel
# for postgres and sqlite backends via a matrix.

on:
  push:
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --tests -- -D warnings

      - name: Show sccache stats
        run: sccache --show-stats

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: postgres
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          # - backend: sqlite
          #   loco_env: test_sqlite
          #   database_url: 'sqlite::memory:'
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - name: Install pgvector and pg_trgm into template1
        if: matrix.backend == 'postgres'
        run: |
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d template1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run tests
        env:
          LOCO_ENV: ${{ matrix.loco_env }}
          DATABASE_URL: ${{ matrix.database_url }}
          DB_MAX_CONNECTIONS: "100"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Show sccache stats
        run: sccache --show-stats
