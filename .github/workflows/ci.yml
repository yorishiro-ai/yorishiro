name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Where ort-sys extracts the onnxruntime binary at build time. Not covered by the
          # default cache targets (~/.cargo, ./target), so without caching this the linker
          # fails to find the library on the second and later warm-cache CI runs.
          cache-directories: ~/.cache/ort.pyke.io
          # Shared with clippy-suggestions.yml (same shared-key) so that workflow -- which never
          # runs on master and so can never save under its own job-scoped key -- can still
          # restore the cache master writes here.
          shared-key: rust
          # PRs can only ever restore from master's cache and their own -- never write back to
          # master's key -- so only master needs to save. Letting every PR save left a growing
          # pile of per-branch caches that never got cleaned up until GitHub's 7-day/10GB evictions.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: cargo sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
