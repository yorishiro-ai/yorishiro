name: CI

# Every edition and backend runs `cargo test` as is; public contracts run the built binary.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  merge_group:
    types: [checks_requested]
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  EMBEDDING_MODEL_REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
  EMBEDDING_MODEL_ID: intfloat/multilingual-e5-base
  EMBEDDING_MODEL_SHORT_ID: multilingual-e5-base
  EMBEDDING_MODEL_REMOTE_PATH: model.safetensors
  EMBEDDING_MODEL_LOCAL_NAME: model.safetensors
  EMBEDDING_MODEL_SHA256: a18a44fad1d0b46ded15928144138cff1135d5cc8233bdd90be5f18822de09a7
  EMBEDDING_MODEL_SIZE: "1112201288"
  EMBEDDING_TOKENIZER_REMOTE_PATH: tokenizer.json
  EMBEDDING_TOKENIZER_LOCAL_NAME: tokenizer.json
  EMBEDDING_TOKENIZER_SHA256: 62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb75626
  EMBEDDING_TOKENIZER_SIZE: "17082660"

jobs:
  licensed-validation:
    name: Determine licensed test eligibility
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.eligibility.outputs.enabled }}
      matrix: ${{ steps.eligibility.outputs.matrix }}
      regenerate-schema: ${{ steps.schema-changes.outputs.regenerate }}
    steps:
      - id: eligibility
        env:
          TRUSTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
          DEPENDABOT_LICENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' && secrets.YORISHIRO_LICENSE_KEY != '' }}
        run: |
          enabled=false
          if [[ "$TRUSTED" == true || "$DEPENDABOT_LICENCE" == true ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          matrix=$(jq -cn --argjson licensed "$enabled" '
            [
              {name:"ce-sqlite", edition:"ce", database:"sqlite"},
              {name:"ee-sqlite", edition:"ee", database:"sqlite", models:true},
              {name:"ce-postgres", edition:"ce", database:"postgres"},
              {name:"ee-postgres", edition:"ee", database:"postgres"}
            ] + if $licensed then
              [{name:"ee-postgres-licensed", edition:"ee", database:"postgres", licensed:true, models:true}]
            else [] end')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo 'Licensed checks run after merge on develop. No licence is exposed to this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check migration and generated entity changes
        id: schema-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # Without a usable base, verify by regenerating rather than skipping.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'regenerate=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          migrations=$(git diff --name-only --no-renames "$BASE_SHA" HEAD -- migration/src)
          if [[ -n "$migrations" ]]; then
            echo 'regenerate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'regenerate=false' >> "$GITHUB_OUTPUT"
            git diff --exit-code "$BASE_SHA" HEAD -- src/models/_entities
          fi

  ce:
    name: Community edition
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: ce
      - name: Clippy CE without enterprise code
        run: make clippy-ce

  check:
    name: Enterprise edition
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install Python tools
        run: uv sync --locked

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          cache-key: check

      - name: Check formatting, scripts, boundaries, tests and Clippy
        run: make check-all-ee

      - name: Check pinned versions agree
        # Service containers start before checkout and cannot read repository configuration.
        run: |
          for pattern in 'pgvector/pgvector:[A-Za-z0-9.-]+' 'valkey/valkey:[A-Za-z0-9.-]+'; do
            found="$(grep -rhoE "$pattern" .github docker-compose.yaml docker-compose.dev.yaml docker-compose.test.yaml Dockerfile Makefile | grep -oE '[0-9][0-9.]*$' | sort -u)"
            if [ "$(wc -l <<<"$found")" -ne 1 ]; then
              echo "::error::pinned versions disagree for '$pattern':"
              echo "$found"
              exit 1
            fi
          done

      - name: Check doc links
        run: cargo doc --no-deps --workspace --features enterprise
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

  schema-generation:
    name: Schema generation (PostgreSQL)
    needs: [licensed-validation, build-ce]
    if: needs.licensed-validation.outputs.regenerate-schema == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      LOCO_ENV: test
      DB_CONNECT_TIMEOUT: "5000"
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - uses: ./.github/actions/sea-orm-cli
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-ce
          path: ${{ runner.temp }}/binary
      - name: Restore the built binary
        run: |
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/binary/public-contract-ce.tar.gz" -C target/debug
          test -x target/debug/yorishiro

      - name: Bootstrap PostgreSQL extensions and non-superuser migration identity
        uses: ./.github/actions/postgres-test-setup
        with:
          container: ${{ job.services.db.id }}

      - name: Run migrations with the built binary
        run: ./target/debug/yorishiro db migrate

      - name: Regenerate entities
        id: regenerate-entities
        run: |
          rm -f src/models/_entities/*.rs
          ./target/debug/yorishiro db entities
          python3 scripts/harden_generated_entities.py

      - name: Verify _entities/ matches a fresh regen
        run: |
          git add --intent-to-add -- src/models/_entities
          git diff --exit-code -- src/models/_entities

      - name: Upload generated entities on mismatch
        if: ${{ failure() && steps.regenerate-entities.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-entities
          path: src/models/_entities/
          if-no-files-found: error

  build-ce:
    name: Community binary
    uses: ./.github/workflows/test-build.yml
    with:
      edition: ce

  build-ee:
    name: Enterprise binary
    uses: ./.github/workflows/test-build.yml
    with:
      edition: ee

  test:
    name: Test (${{ matrix.name }})
    needs: licensed-validation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.licensed-validation.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://yorishiro:yorishiro@localhost:5432/yorishiro' || '' }}
      YORISHIRO_LICENSE_KEY: ${{ matrix.licensed && secrets.YORISHIRO_LICENSE_KEY || '' }}
      DB_MAX_CONNECTIONS: "100"
      DB_CONNECT_TIMEOUT: "5000"
      RUST_BACKTRACE: "1"
    services:
      db:
        image: ${{ matrix.database == 'postgres' && 'pgvector/pgvector:pg18' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test-${{ matrix.name }}
      - name: Require the signed licence
        if: matrix.licensed
        run: test -n "$YORISHIRO_LICENSE_KEY"
      - name: Restore the multilingual-e5-base cache
        if: matrix.models
        uses: actions/cache/restore@v6
        id: embedding-cache
        with:
          path: |
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}
      - name: Report a model cache miss on an external run
        if: matrix.models && steps.embedding-cache.outputs.cache-hit != 'true' && needs.licensed-validation.outputs.enabled != 'true'
        run: echo 'E5 model tests are skipped on this run because the verified model cache was not available.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare and verify multilingual-e5-base artifacts
        if: matrix.models && (steps.embedding-cache.outputs.cache-hit == 'true' || needs.licensed-validation.outputs.enabled == 'true')
        env:
          CACHE_DIR: ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}
          CACHE_HIT: ${{ steps.embedding-cache.outputs.cache-hit }}
          MODEL_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_MODEL_REMOTE_PATH }}
          TOKENIZER_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_MODEL_TOKENIZER_REMOTE_PATH }}
        run: python3 scripts/embedding_cache.py prepare
      - name: Save verified multilingual-e5-base cache
        if: matrix.models && steps.embedding-cache.outputs.cache-hit != 'true' && needs.licensed-validation.outputs.enabled == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ${{ github.workspace }}/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}
      - name: Bootstrap PostgreSQL extensions and a non-superuser migration identity
        if: matrix.database == 'postgres'
        uses: ./.github/actions/postgres-test-setup
        with:
          container: ${{ job.services.db.id }}
      - name: Run the tests
        run: |
          # Bound concurrent database setup and teardown without changing the worker races inside each test.
          if [[ '${{ matrix.name }}' == 'ee-postgres' ]]; then
            export RUST_TEST_THREADS=2
          fi
          make test-${{ matrix.database }} EDITION=${{ matrix.edition }}

  test-valkey:
    name: Test (ee-valkey)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:9.1.3
        ports: [6379:6379]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test-ee-valkey
      - name: Run the Valkey queue tests
        run: make test-valkey EDITION=ee VALKEY_URL=redis://127.0.0.1:6379

  public-contract:
    name: Public contracts (SQLite, ${{ matrix.edition }}, ${{ matrix.suite }})
    needs: build-ce
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {edition: ce, suite: rest}
          - {edition: ce, suite: mcp}
          - {edition: ce, suite: management}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-${{ matrix.edition }}
          path: ${{ runner.temp }}/binary
      - name: Restore the built binary
        run: tar -xzf "$RUNNER_TEMP/binary/public-contract-${{ matrix.edition }}.tar.gz" -C "$RUNNER_TEMP/binary"
      - name: Exercise the public interface through real processes
        run: >-
          make test-contract
          BINARY="$RUNNER_TEMP/binary/yorishiro"
          SUITE="${{ matrix.suite }}"
          EDITION="${{ matrix.edition }}"
          ARTIFACTS="$RUNNER_TEMP/contracts"
      - name: Upload redacted logs and scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-contract-result-${{ matrix.edition }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/contracts
          if-no-files-found: error
          retention-days: 7

  public-contract-ee:
    name: Public contracts (SQLite, ee, mcp)
    needs: build-ee
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-ee
          path: ${{ runner.temp }}/binary
      - name: Exercise the enterprise delta through real processes
        run: |
          tar -xzf "$RUNNER_TEMP/binary/public-contract-ee.tar.gz" -C "$RUNNER_TEMP/binary"
          make test-contract BINARY="$RUNNER_TEMP/binary/yorishiro" SUITE=mcp EDITION=ee ARTIFACTS="$RUNNER_TEMP/contracts"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-contract-result-ee-mcp
          path: ${{ runner.temp }}/contracts
          if-no-files-found: error
          retention-days: 7

  public-contract-tenant:
    name: Public contracts (PostgreSQL, licensed ee, tenant)
    needs: [build-ee, licensed-validation]
    if: needs.licensed-validation.outputs.enabled == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-binary-ee
          path: ${{ runner.temp }}/binary
      - name: Prepare the owned non-superuser PostgreSQL database
        uses: ./.github/actions/postgres-test-setup
        with:
          container: ${{ job.services.db.id }}
          database: public_contract
      - name: Exercise authenticated cross-tenant acceptance
        env:
          YORISHIRO_PUBLIC_POSTGRES_URL: postgres://yorishiro:yorishiro@localhost:5432/public_contract
          YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}
        run: |
          test -n "$YORISHIRO_LICENSE_KEY"
          tar -xzf "$RUNNER_TEMP/binary/public-contract-ee.tar.gz" -C "$RUNNER_TEMP/binary"
          make test-contract BINARY="$RUNNER_TEMP/binary/yorishiro" SUITE=tenant-postgres EDITION=ee ARTIFACTS="$RUNNER_TEMP/contracts"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-contract-result-ee-tenant-postgres
          path: ${{ runner.temp }}/contracts
          if-no-files-found: error
          retention-days: 7

  required-check:
    name: Required validation
    if: ${{ always() }}
    needs: [licensed-validation, ce, check, schema-generation, build-ce, build-ee, test, test-valkey, public-contract, public-contract-ee, public-contract-tenant]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .["licensed-validation"].outputs.enabled as $licensed
            | .["licensed-validation"].outputs["regenerate-schema"] as $regenerate
            | to_entries | all(
                .value.result == "success" or
                (.key == "schema-generation" and .value.result == "skipped" and $regenerate == "false") or
                (.key == "public-contract-tenant" and .value.result == "skipped" and $licensed == "false")
              )
          ' <<< "$RESULTS"
