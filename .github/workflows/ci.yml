name: CI

# Covers this repository's layout: the root package (`yorishiro`) and `migration/`, with the paid
# edition compiled in as the `ee/` module rather than a package of its own.
# Deliberately minimal: cargo check/clippy/fmt-check runs once, then test runs in parallel
# for postgres and sqlite backends via a matrix.

on:
  push:
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release_pre.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release_pre.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  EMBEDDING_MODEL_REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
  EMBEDDING_MODEL_SHA256: a18a44fad1d0b46ded15928144138cff1135d5cc8233bdd90be5f18822de09a7
  EMBEDDING_MODEL_SIZE: "1112201288"
  EMBEDDING_TOKENIZER_SHA256: 62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb75626
  EMBEDDING_TOKENIZER_SIZE: "17082660"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        # TODO: unify cache key convention with test job (which uses matrix-scoped keys).
        # check currently uses the default key while test splits by backend to avoid
        # postgres/sqlite artifact collisions.

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check test harness usage
        run: |
          # Only tests/requests/mod.rs may call the raw loco helpers directly.
          # All other test files must use boot_request/boot_request_sqlite instead.
          if git grep -l 'request_with_create_db::<\|request_with_create_sqlite::<' tests/ | grep -v 'tests/requests/mod.rs'; then
            echo "ERROR: call boot_request/boot_request_sqlite instead of the raw loco helper directly"
            exit 1
          fi

      - name: Check public API additions
        run: make public-api-check
        env:
          PUBLIC_API_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PUBLIC_API_HEAD_REF: ${{ github.sha }}

      - name: Check for allow(dead_code)
        run: |
          # SeaORM FromQueryResult requires exact field names for column mapping,
          # so columns read from SQL but unused on the Rust side need a _ prefix.
          if git grep -n 'allow(dead_code)' -- src ee migration/src; then
            echo "ERROR: allow(dead_code) found above (except known entity_relations exception). Delete the unused item, don't remove it."
            exit 1
          fi

      - name: Check
        run: cargo check --locked --workspace

      - name: Check doc links
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

      - name: Clippy (tests + complexity report)
        # Merges the hard-fail lint gate (`-D warnings`) with the warn-only complexity
        # report (`cognitive_complexity`, `too_many_lines`) into a single invocation.
        # Both lints are nursery/pedantic, off by default, so --force-warn opts them in.
        # Step 3 (doc coverage) stays separate because `--lib` is a different target set
        # from `--tests` and does not fire missing_errors_doc/missing_panics_doc on lib code.
        run: cargo clippy --locked --workspace --tests -- -D warnings --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines

      - name: Clippy doc coverage report
        # Warn-only (see clippy.toml): ~200 existing violations of missing_errors_doc
        # and missing_panics_doc; new/changed code is expected to add those comments.
        run: cargo clippy --locked --workspace --lib -- --force-warn clippy::missing_errors_doc --force-warn clippy::missing_panics_doc

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          - backend: sqlite
            loco_env: test_sqlite
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate caches for each matrix entry so postgres and sqlite build artifacts don't
          # collide (they compile different feature combinations).
          key: ${{ github.job }}-${{ matrix.backend }}

      - name: Restore or fetch multilingual-e5-base artifacts
        uses: actions/cache/restore@v4
        id: embedding-cache
        with:
          path: |
            ~/.cache/yorishiro/models/multilingual-e5-base/model.safetensors
            ~/.cache/yorishiro/models/multilingual-e5-base/tokenizer.json
          key: embedding-model-multilingual-e5-base-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

      - name: Verify or download multilingual-e5-base artifacts
        env:
          MODEL_URL: https://huggingface.co/intfloat/multilingual-e5-base/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/model.safetensors
          TOKENIZER_URL: https://huggingface.co/intfloat/multilingual-e5-base/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/tokenizer.json
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path("src/services/embedding/model_fetch.rs").read_text()
          block = source.split("static MULTILINGUAL_E5_BASE", 1)[1].split(
              "pub(super) const DEFAULT_MODEL", 1
          )[0]
          model, tokenizer = block.split("tokenizer: Artifact", 1)
          expected = {
              "EMBEDDING_MODEL_REVISION": (block, r'revision: "([^"]+)"'),
              "EMBEDDING_MODEL_SHA256": (model, r'sha256: "([^"]+)"'),
              "EMBEDDING_MODEL_SIZE": (model, r'size: ([0-9_]+)'),
              "EMBEDDING_TOKENIZER_SHA256": (tokenizer, r'sha256: "([^"]+)"'),
              "EMBEDDING_TOKENIZER_SIZE": (tokenizer, r'size: ([0-9_]+)'),
          }
          import re
          for name, (haystack, pattern) in expected.items():
              match = re.search(pattern, haystack)
              actual = match.group(1).replace("_", "") if match else None
              if actual != os.environ[name].replace("_", ""):
                  raise SystemExit(f"{name} does not match model_fetch.rs")
          PY

          cache_dir="$HOME/.cache/yorishiro/models/multilingual-e5-base"
          if [[ -L "$cache_dir" || ( -e "$cache_dir" && ! -d "$cache_dir" ) ]]; then
            rm -rf -- "$cache_dir"
          fi
          mkdir -p "$cache_dir"

          verify() {
            local path=$1 expected_size=$2 expected_sha=$3
            [[ -f "$path" && ! -L "$path" ]] || return 1
            [[ "$(stat -c '%s' "$path")" == "$expected_size" ]] || return 1
            [[ "$(sha256sum "$path" | cut -d' ' -f1)" == "$expected_sha" ]]
          }

          fetch() {
            local path=$1 url=$2 expected_size=$3 expected_sha=$4
            if verify "$path" "$expected_size" "$expected_sha"; then
              return
            fi

            if [[ -L "$path" || -d "$path" ]]; then
              rm -rf -- "$path"
            else
              rm -f -- "$path"
            fi
            local partial="${path}.partial"
            if [[ -L "$partial" || -d "$partial" ]]; then
              rm -rf -- "$partial"
            elif [[ -f "$partial" ]]; then
              partial_size=$(stat -c '%s' "$partial")
              if [[ "$partial_size" -gt "$expected_size" ]]; then
                rm -f -- "$partial"
              elif [[ "$partial_size" == "$expected_size" ]]; then
                if verify "$partial" "$expected_size" "$expected_sha"; then
                  mv -f -- "$partial" "$path"
                  return
                fi
                rm -f -- "$partial"
              fi
            fi
            if ! curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --continue-at - --output "$partial" "$url"; then
              return 1
            fi
            if ! verify "$partial" "$expected_size" "$expected_sha"; then
              echo "ERROR: downloaded artifact failed size or SHA-256 verification: $url" >&2
              rm -f -- "$partial"
              return 1
            fi
            mv -f -- "$partial" "$path"
          }

          fetch "$cache_dir/model.safetensors" "$MODEL_URL" \
            "$EMBEDDING_MODEL_SIZE" "$EMBEDDING_MODEL_SHA256"
          fetch "$cache_dir/tokenizer.json" "$TOKENIZER_URL" \
            "$EMBEDDING_TOKENIZER_SIZE" "$EMBEDDING_TOKENIZER_SHA256"

          verify "$cache_dir/model.safetensors" \
            "$EMBEDDING_MODEL_SIZE" "$EMBEDDING_MODEL_SHA256"
          verify "$cache_dir/tokenizer.json" \
            "$EMBEDDING_TOKENIZER_SIZE" "$EMBEDDING_TOKENIZER_SHA256"

      - name: Save verified multilingual-e5-base artifacts
        if: steps.embedding-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/yorishiro/models/multilingual-e5-base/model.safetensors
            ~/.cache/yorishiro/models/multilingual-e5-base/tokenizer.json
          key: embedding-model-multilingual-e5-base-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Install sea-orm-cli with postgres-vector feature
        run: cargo install sea-orm-cli --version 2.0.2 --features postgres-vector,sqlx-postgres,sqlx-sqlite

      - name: Install pgvector and pg_trgm (postgres only)
        if: matrix.backend == 'postgres'
        run: |
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c '\c template1' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run migrations (postgres)
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
          DB_CONNECT_TIMEOUT: "5000"
        run: ./target/debug/yorishiro db migrate

      - name: Run migrations (sqlite)
        if: matrix.backend == 'sqlite'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
        run: ./target/debug/yorishiro db migrate

      - name: Verify _entities/ matches a fresh regen
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          LOCO_ENV: test_postgres
          DB_CONNECT_TIMEOUT: "5000"
        run: |
          # Diagnose: confirm the migration-created tables actually exist.
          # This is the branching point if db entities ever produces 0 files again.
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro -c '\dt' || true
          # Run db entities (the determinism check).
          count_before=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          rm -f src/models/_entities/*.rs
          ./target/debug/yorishiro db entities
          which sea-orm-cli || echo "ERROR: sea-orm-cli not found in PATH"
          count=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          if [ "$count" -lt 10 ]; then
            echo "ERROR: Expected 20+ entity files, got $count after db entities."
            exit 1
          fi
          echo "Generated $count entity files (had $count_before before)"
          # Skip entity_embeddings_*.rs — PgVector doesn't implement Eq, so
          # sea-orm-codegen omits ActiveModelBehavior, but DeriveEntityModel
          # requires it. Restore committed files and skip diff check.
          git checkout -- src/models/_entities/entity_embeddings_768.rs src/models/_entities/entity_embeddings_1024.rs src/models/_entities/entity_embeddings_1536.rs
          git diff --exit-code -- ':!src/models/_entities/entity_embeddings_768.rs' ':!src/models/_entities/entity_embeddings_1024.rs' ':!src/models/_entities/entity_embeddings_1536.rs'

      - name: Run tests
        env:
          LOCO_ENV: ${{ matrix.loco_env }}
          DATABASE_URL: ${{ matrix.database_url }}
          DB_MAX_CONNECTIONS: 100
          DB_CONNECT_TIMEOUT: 5000
          RUST_BACKTRACE: "1"
        run: scripts/test-backend.sh ${{ matrix.backend }}

      - name: Verify backend gate rejects a mismatch
        env:
          DATABASE_URL: sqlite:///tmp/yorishiro-gate-check.sqlite3?mode=rwc
          LOCO_ENV: test_sqlite
        run: |
          set +e
          output=$(scripts/test-backend.sh postgres models::maintenance:: 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || ! grep -q "zero postgres-specific tests" <<<"$output"; then
            echo "ERROR: backend wrapper accepted a SQLite run as PostgreSQL"
            exit 1
          fi

      - name: Verify embedding artifacts before cache save
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/yorishiro/models/multilingual-e5-base"

          verify() {
            local path=$1 expected_size=$2 expected_sha=$3
            [[ -f "$path" && ! -L "$path" ]] || return 1
            [[ "$(stat -c '%s' "$path")" == "$expected_size" ]] || return 1
            [[ "$(sha256sum "$path" | cut -d' ' -f1)" == "$expected_sha" ]]
          }

          verify "$cache_dir/model.safetensors" \
            "$EMBEDDING_MODEL_SIZE" "$EMBEDDING_MODEL_SHA256"
          verify "$cache_dir/tokenizer.json" \
            "$EMBEDDING_TOKENIZER_SIZE" "$EMBEDDING_TOKENIZER_SHA256"
