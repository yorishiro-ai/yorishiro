name: CI

# Covers this repository's layout: the root package (`yorishiro`) and `migration/`, with the paid
# edition compiled in as the `ee/` module rather than a package of its own.
# Deliberately minimal: cargo check/clippy/fmt-check runs once, then test runs in parallel
# for postgres and sqlite backends via a matrix.

on:
  push:
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Configure sccache for GHA backend
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --tests -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: postgres
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          - backend: sqlite
            loco_env: test_sqlite
            database_url: 'sqlite::memory:'
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pgvector and pg_trgm into template1
        if: matrix.backend == 'postgres'
        run: |
          PGPASSWORD=yorishiro psql -h localhost -U yorishiro -d template1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Configure sccache for GHA backend
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          LOCO_ENV: ${{ matrix.loco_env }}
          DATABASE_URL: ${{ matrix.database_url }}
        run: cargo test --locked --workspace
