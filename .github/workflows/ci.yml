name: CI

# Both databases run the suite, with backend-specific cases guarded in tests.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  merge_group:
    types: [checks_requested]
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  licensed-validation:
    name: Determine licensed test eligibility
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.eligibility.outputs.matrix }}
    steps:
      - id: eligibility
        env:
          TRUSTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
          DEPENDABOT_LICENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' && secrets.YORISHIRO_LICENSE_KEY != '' }}
        run: |
          enabled=false
          if [[ "$TRUSTED" == true || "$DEPENDABOT_LICENCE" == true ]]; then
            enabled=true
          fi
          matrix=$(jq -cn --argjson licensed "$enabled" '
            [
              {name:"ce-sqlite", edition:"ce", database:"sqlite"},
              {name:"ee-sqlite", edition:"ee", database:"sqlite"},
              {name:"ce-postgres", edition:"ce", database:"postgres"},
              {name:"ee-postgres", edition:"ee", database:"postgres"}
            ] + if $licensed then
              [{name:"ee-licence", edition:"ee", database:"sqlite", licensed:true}]
            else [] end')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo 'Licensed checks run after merge on develop. No licence is exposed to this run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  schema-changes:
    name: Check schema changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      regenerate: ${{ steps.schema-changes.outputs.regenerate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check migration and generated entity changes
        id: schema-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # Without a usable base, verify by regenerating rather than skipping.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'regenerate=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          migrations=$(git diff --name-only --no-renames "$BASE_SHA" HEAD -- migration/src)
          if [[ -n "$migrations" ]]; then
            echo 'regenerate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'regenerate=false' >> "$GITHUB_OUTPUT"
            git diff --exit-code "$BASE_SHA" HEAD -- src/models/_entities
          fi

  ce:
    name: Community edition
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: ce
      - name: Clippy CE without enterprise code
        run: make clippy-ce

  check:
    name: Enterprise edition
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install Python tools
        run: uv sync --locked

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          cache-key: check

      - name: Check formatting, scripts, boundaries, compilation and Clippy
        run: make check-all-ee

      - name: Check pinned versions agree
        # Service containers start before checkout and cannot read repository configuration.
        shell: bash
        run: |
          for image in pgvector/pgvector valkey/valkey; do
            if ! found=$(grep -rhoE "${image}:[A-Za-z0-9_.:@-]+" .github docker-compose.yaml docker-compose.dev.yaml docker-compose.test.yaml scripts/generate_entities.sh | sort -u); then
              echo "::error::could not read a pinned reference for $image"
              exit 1
            fi
            if [[ "$found" == *$'\n'* ]]; then
              echo "::error::pinned references disagree for $image"
              printf '%s\n' "$found"
              exit 1
            fi
          done

      - name: Check doc links
        run: cargo doc --no-deps --workspace --features enterprise
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

  schema-generation:
    name: Schema generation (PostgreSQL)
    needs: [schema-changes, build-tests]
    if: needs.schema-changes.outputs.regenerate == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      LOCO_ENV: test
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - uses: ./.github/actions/sea-orm-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tests-ce
          path: ${{ runner.temp }}/binary
      - name: Restore the built binary
        run: |
          tar -xf "$RUNNER_TEMP/binary/tests-ce.tar" target/ci-tests/debug/yorishiro
          test -x target/ci-tests/debug/yorishiro

      - name: Bootstrap PostgreSQL extensions and non-superuser migration identity
        uses: ./.github/actions/postgres-test-setup
        with:
          container: ${{ job.services.db.id }}

      - name: Run migrations with the built binary
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/schema-%p.profraw
        run: ./target/ci-tests/debug/yorishiro db migrate

      - name: Regenerate entities
        id: regenerate-entities
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/schema-%p.profraw
        run: |
          rm -f src/models/_entities/*.rs
          ./target/ci-tests/debug/yorishiro db entities
          python3 scripts/harden_generated_entities.py

      - name: Verify _entities/ matches a fresh regen
        run: |
          git add --intent-to-add -- src/models/_entities
          git diff --exit-code -- src/models/_entities

      - name: Upload generated entities on mismatch
        if: ${{ failure() && steps.regenerate-entities.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-entities
          path: src/models/_entities/
          if-no-files-found: error

  build-tests:
    name: Test executables
    strategy:
      fail-fast: false
      matrix:
        edition: [ce, ee]
    uses: ./.github/workflows/test-build.yml
    with:
      edition: ${{ matrix.edition }}

  test:
    name: Test (${{ matrix.name }})
    needs: [licensed-validation, build-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.licensed-validation.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://yorishiro:yorishiro@localhost:5432/yorishiro' || '' }}
      YORISHIRO_LICENSE_KEY: ${{ matrix.licensed && secrets.YORISHIRO_LICENSE_KEY || '' }}
      RUST_BACKTRACE: "1"
      LLVM_PROFILE_FILE: ${{ github.workspace }}/target/ci-tests/coverage-%p-%m.profraw
    services:
      db:
        image: ${{ matrix.database == 'postgres' && 'pgvector/pgvector:pg18' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tests-${{ matrix.edition }}
          path: ${{ runner.temp }}
      - name: Restore test executables
        env:
          EDITION: ${{ matrix.edition }}
        run: tar -xf "$RUNNER_TEMP/tests-$EDITION.tar"
      - name: Require the signed licence
        if: matrix.licensed
        run: test -n "$YORISHIRO_LICENSE_KEY"
      - name: Bootstrap PostgreSQL extensions and a non-superuser migration identity
        if: matrix.database == 'postgres'
        uses: ./.github/actions/postgres-test-setup
        with:
          container: ${{ job.services.db.id }}
      - name: Run the tests
        run: |
          if [[ '${{ matrix.licensed }}' == true ]]; then
            make test-licence TEST_BINARY="$(cat target/ci-tests/test-executable)"
            exit 0
          fi
          make test-${{ matrix.database }} EDITION=${{ matrix.edition }} TEST_BINARY="$(cat target/ci-tests/test-executable)"
      - name: Generate coverage
        if: ${{ !matrix.licensed && github.event_name != 'merge_group' }}
        continue-on-error: true
        id: coverage
        env:
          REPORT: ${{ matrix.name }}.lcov
        run: |
          rustup component add llvm-tools-preview
          host=$(rustc -vV | sed -n 's/^host: //p')
          llvm="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          "$llvm/llvm-profdata" merge -sparse target/ci-tests/*.profraw -o "$RUNNER_TEMP/coverage.profdata"
          "$llvm/llvm-cov" export -format=lcov -instr-profile="$RUNNER_TEMP/coverage.profdata" \
            -object "$(cat target/ci-tests/test-executable)" -object target/ci-tests/debug/yorishiro \
            -ignore-filename-regex '(^|/)(tests|benches|patches|target)/|/\.cargo/|/\.rustup/|^/rustc/' > "$REPORT"
          test -s "$REPORT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.coverage.outcome == 'success'
        continue-on-error: true
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.name }}.lcov
          if-no-files-found: error

  test-valkey:
    name: Test (ee-valkey)
    needs: build-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:9.1.3
        ports: [6379:6379]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tests-ee
          path: ${{ runner.temp }}
      - name: Restore test executables
        run: tar -xf "$RUNNER_TEMP/tests-ee.tar"
      - name: Run the Valkey queue tests
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/valkey-%p-%m.profraw
        run: make test-valkey EDITION=ee VALKEY_URL=redis://127.0.0.1:6379 TEST_BINARY="$(cat target/ci-tests/test-executable)"

  coverage:
    name: Report coverage
    needs: test
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Require reports from both backends and editions
        run: |
          for report in coverage/{ce,ee}-{sqlite,postgres}.lcov; do
            test -s "$report"
          done
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/ce-sqlite.lcov,coverage/ce-postgres.lcov,coverage/ee-sqlite.lcov,coverage/ee-postgres.lcov
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  required-check:
    name: Required validation
    if: ${{ always() }}
    needs: [licensed-validation, schema-changes, ce, check, schema-generation, build-tests, test, test-valkey]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .["schema-changes"].outputs.regenerate as $regenerate
            | to_entries | all(
                .value.result == "success" or
                (.key == "schema-generation" and .value.result == "skipped" and $regenerate == "false")
              )
          ' <<< "$RESULTS"
