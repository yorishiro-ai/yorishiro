name: CI

# Covers this repository's layout: the root package (`yorishiro`) and `migration/`, with the paid
# edition compiled in as the `ee/` module rather than a package of its own.
# Deliberately minimal: cargo check/clippy/fmt-check runs once, then test runs in parallel
# for postgres and sqlite backends via a matrix.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EMBEDDING_MODEL_REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
  EMBEDDING_MODEL_ID: intfloat/multilingual-e5-base
  EMBEDDING_MODEL_SHORT_ID: multilingual-e5-base
  EMBEDDING_MODEL_REMOTE_PATH: model.safetensors
  EMBEDDING_MODEL_LOCAL_NAME: model.safetensors
  EMBEDDING_MODEL_SHA256: a18a44fad1d0b46ded15928144138cff1135d5cc8233bdd90be5f18822de09a7
  EMBEDDING_MODEL_SIZE: "1112201288"
  EMBEDDING_TOKENIZER_REMOTE_PATH: tokenizer.json
  EMBEDDING_TOKENIZER_LOCAL_NAME: tokenizer.json
  EMBEDDING_TOKENIZER_SHA256: 62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb75626
  EMBEDDING_TOKENIZER_SIZE: "17082660"

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust_validation: ${{ steps.classify.outputs.rust_validation }}
      package_validation: ${{ steps.classify.outputs.package_validation }}
      package_build: ${{ steps.classify.outputs.package_build }}
      docker_validation: ${{ steps.classify.outputs.docker_validation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" != pull_request ]]; then args+=(--full); fi
          python3 scripts/classify_ci_changes.py "${args[@]}"

  ce:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Community edition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ce
      - name: Check CE without enterprise code
        run: make check-ce
      - name: Clippy CE without enterprise code
        run: make clippy-ce
      # Runtime topology tests run in the shared matrix below for both editions.

  check:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Enterprise edition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python tools
        run: uv sync --locked

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        # TODO: unify cache key convention with test job (which uses matrix-scoped keys).
        # check currently uses the default key while test splits by backend to avoid
        # postgres/sqlite artifact collisions.

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify upstream bug-fix patches
        run: make patch-check

      - name: Check generated entity hardener
        run: PYTHONDONTWRITEBYTECODE=1 uv run scripts/test_harden_generated_entities.py

      - name: Python lint
        run: make python-lint

      - name: Check test harness usage
        run: |
          # Only tests/requests/mod.rs may call the raw loco helpers directly.
          # All other test files must use boot_request/boot_request_sqlite instead.
          if git grep -l 'request_with_create_db::<\|request_with_create_sqlite::<' -- tests/ ':!tests/requests/mod.rs'; then
            echo "ERROR: call boot_request/boot_request_sqlite instead of the raw loco helper directly"
            exit 1
          fi

      - name: Check that tests live in tests/
        run: make test-location-check

      - name: Check for debug-only macros
        run: make debug-macro-check

      - name: Check the edition boundary
        run: make edition-boundary-check

      - name: Check public API additions
        run: |
          set -euo pipefail
          base_ref="${PUBLIC_API_BASE_REF:-}"
          if [[ "$base_ref" == "$(printf '0%.0s' {1..40})" ]]; then
            echo "PUBLIC_API_BASE_REF is all-zero; skipping public API additions for this new branch."
            exit 0
          elif [[ "$base_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if ! git fetch --no-tags origin "$base_ref"; then
              echo "::error::Unable to fetch PUBLIC_API_BASE_REF=$base_ref"
              exit 1
            fi
            if ! git cat-file -e "$base_ref^{commit}"; then
              echo "::error::Fetched PUBLIC_API_BASE_REF=$base_ref but the commit is unavailable"
              exit 1
            fi
          else
            echo "::error::PUBLIC_API_BASE_REF must be a 40-character commit SHA or all-zero SHA, got: $base_ref"
            exit 1
          fi
          make public-api-check
        env:
          PUBLIC_API_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PUBLIC_API_HEAD_REF: WORKTREE

      - name: Check pinned versions agree
        # Versions that cannot be read from their source of truth at run time are checked instead:
        # a service image or a Docker build default cannot take a step output.
        run: |
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          grep -qx "ARG RUST_VERSION=${toolchain}" Dockerfile \
            || { echo "::error::Dockerfile's RUST_VERSION default is not rust-toolchain.toml's channel ${toolchain}"; exit 1; }
          for pattern in 'pgvector/pgvector:[A-Za-z0-9.-]+' 'valkey/valkey:[A-Za-z0-9.-]+' 'sccache --locked --version [0-9.]+'; do
            found="$(grep -rhoE "$pattern" .github docker-compose.yml Dockerfile Makefile | sort -u)"
            if [ "$(wc -l <<<"$found")" -ne 1 ]; then
              echo "::error::pinned versions disagree for '$pattern':"
              echo "$found"
              exit 1
            fi
          done

      - name: Check for allow(dead_code)
        run: make dead-code-allow-check

      - name: Check EE
        run: make check-ee

      - name: Check doc links
        run: cargo doc --no-deps --workspace --features enterprise
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

      - name: Clippy
        # Keep CI aligned with rust-analyzer: every target and public API documentation.
        run: make clippy-ee

      - name: Clippy complexity report
        # Existing complexity debt remains report-only.
        run: cargo clippy --locked --workspace --all-targets --features enterprise -- --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines

  msrv:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: rustc +${{ steps.msrv.outputs.version }} --version --verbose
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --no-default-features --features community --workspace
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --features enterprise --workspace

  prepare-embedding:
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    needs: changes
    name: Models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python tools
        run: uv sync --locked

      - name: Restore multilingual-e5-base cache
        uses: actions/cache/restore@v6
        id: embedding-cache
        with:
          path: |
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

      - name: Reject an uncacheable fork pull request miss
        if: steps.embedding-cache.outputs.cache-hit != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The immutable embedding cache is unavailable and fork pull requests cannot save GitHub Actions caches. Re-run after the cache is populated from a trusted branch."
          exit 1

      - name: Prepare and verify multilingual-e5-base artifacts
        env:
          CACHE_DIR: ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}
          CACHE_HIT: ${{ steps.embedding-cache.outputs.cache-hit }}
          MODEL_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_MODEL_REMOTE_PATH }}
          TOKENIZER_URL: https://huggingface.co/${{ env.EMBEDDING_MODEL_ID }}/resolve/${{ env.EMBEDDING_MODEL_REVISION }}/${{ env.EMBEDDING_TOKENIZER_REMOTE_PATH }}
        run: uv run scripts/embedding_cache.py prepare

      - name: Save verified multilingual-e5-base cache
        if: steps.embedding-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

  test:
    name: "Test (Edition: ${{ matrix.edition }}, DB: ${{ matrix.db }}, Queue: ${{ matrix.queue }})"
    needs: [changes, prepare-embedding]
    if: ${{ needs.changes.outputs.rust_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ce
            db: Postgres
            backend: postgres
            queue: Postgres
            queue_key: postgres
            # Used by non-harness steps; test_topology.py selects its own config via Environment::Test.
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
            queue_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          - edition: ce
            db: SQLite
            backend: sqlite
            queue: SQLite
            queue_key: sqlite
            loco_env: test_sqlite
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
            queue_url: sqlite:///tmp/yorishiro_queue.sqlite3?mode=rwc
          - edition: ce
            db: Postgres
            backend: postgres
            queue: Valkey
            queue_key: valkey
            loco_env: test_postgres_valkey
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
            queue_url: redis://localhost:6379/15
          - edition: ce
            db: SQLite
            backend: sqlite
            queue: Valkey
            queue_key: valkey
            loco_env: test_sqlite_valkey
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
            queue_url: redis://localhost:6379/15
          - edition: ee
            db: Postgres
            backend: postgres
            queue: Postgres
            queue_key: postgres
            # Used by non-harness steps; test_topology.py selects its own config via Environment::Test.
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
            queue_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          - edition: ee
            db: SQLite
            backend: sqlite
            queue: SQLite
            queue_key: sqlite
            loco_env: test_sqlite
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
            queue_url: sqlite:///tmp/yorishiro_queue.sqlite3?mode=rwc
          - edition: ee
            db: Postgres
            backend: postgres
            queue: Valkey
            queue_key: valkey
            loco_env: test_postgres_valkey
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
            queue_url: redis://localhost:6379/15
          - edition: ee
            db: SQLite
            backend: sqlite
            queue: Valkey
            queue_key: valkey
            loco_env: test_sqlite_valkey
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
            queue_url: redis://localhost:6379/15
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python tools
        run: uv sync --locked

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate caches for each matrix entry so postgres and sqlite build artifacts don't
          # collide across database and queue providers.
          key: ${{ github.job }}-${{ matrix.backend }}-${{ matrix.queue }}

      - name: Restore multilingual-e5-base cache
        uses: actions/cache/restore@v6
        id: embedding-cache
        with:
          path: |
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_MODEL_LOCAL_NAME }}
            ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}/${{ env.EMBEDDING_TOKENIZER_LOCAL_NAME }}
          key: embedding-model-${{ env.EMBEDDING_MODEL_SHORT_ID }}-${{ env.EMBEDDING_MODEL_REVISION }}-${{ env.EMBEDDING_MODEL_SHA256 }}-${{ env.EMBEDDING_TOKENIZER_SHA256 }}

      - name: Verify populated multilingual-e5-base cache
        env:
          CACHE_DIR: ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}
          CACHE_HIT: ${{ steps.embedding-cache.outputs.cache-hit }}
          MODEL_URL: unused
          TOKENIZER_URL: unused
        run: uv run scripts/embedding_cache.py verify

      - name: Build workspace
        env:
          YORISHIRO_TEST_EDITION: ${{ matrix.edition }}
        run: |
          if [ "${{ matrix.edition }}" = ce ]; then
            cargo build --locked --no-default-features --features community --workspace
          else
            cargo build --locked --features enterprise --workspace
          fi

      # Only the entity regeneration check shells out to sea-orm-cli, and that runs on PostgreSQL.
      - if: matrix.backend == 'postgres'
        uses: ./.github/actions/sea-orm-cli

      - name: Install pgvector and pg_trgm (postgres only)
        if: matrix.backend == 'postgres'
        run: |
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c '\c template1' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run migrations (postgres)
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          QUEUE_URL: ${{ matrix.queue_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
          DB_CONNECT_TIMEOUT: "5000"
        run: ./target/debug/yorishiro db migrate

      - name: Run migrations (sqlite)
        if: matrix.backend == 'sqlite'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          QUEUE_URL: ${{ matrix.queue_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
        run: ./target/debug/yorishiro db migrate

      - name: Verify _entities/ matches a fresh regen
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          LOCO_ENV: test_postgres
          DB_CONNECT_TIMEOUT: "5000"
        run: |
          # Diagnose: confirm the migration-created tables actually exist.
          # This is the branching point if db entities ever produces 0 files again.
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro -c '\dt' || true
          # Run db entities (the determinism check).
          count_before=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          rm -f src/models/_entities/*.rs
          ./target/debug/yorishiro db entities
          uv run scripts/harden_generated_entities.py
          which sea-orm-cli || echo "ERROR: sea-orm-cli not found in PATH"
          count=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          if [ "$count" -lt 10 ]; then
            echo "ERROR: Expected at least 10 entity files, got $count after db entities."
            exit 1
          fi
          echo "Generated $count entity files (had $count_before before)"
          git diff --exit-code -- src/models/_entities

      - name: Run tests
        env:
          LOCO_ENV: ${{ matrix.loco_env }}
          DATABASE_URL: ${{ matrix.database_url }}
          QUEUE_URL: ${{ matrix.queue_url }}
          YORISHIRO_VALKEY_TEST_URL: ${{ matrix.queue_url }}
          DB_MAX_CONNECTIONS: 100
          DB_CONNECT_TIMEOUT: 5000
          RUST_BACKTRACE: "1"
          YORISHIRO_TEST_EDITION: ${{ matrix.edition }}
        run: uv run scripts/test_topology.py ${{ matrix.backend }}-${{ matrix.queue_key }}

      - name: Verify topology gate rejects a mismatch
        env:
          DATABASE_URL: sqlite:///tmp/yorishiro-gate-check.sqlite3?mode=rwc
          LOCO_ENV: test_sqlite
        run: |
          set +e
          stderr="$RUNNER_TEMP/topology-mismatch.stderr"
          output=$(uv run scripts/test_topology.py postgres-valkey models::maintenance:: 2>"$stderr")
          status=$?
          set -e
          echo "$output"
          cat "$stderr"
          if [ "$status" -eq 0 ] || ! grep -Fxq "YORISHIRO_TOPOLOGY_REJECTED" "$stderr"; then
            echo "ERROR: expected the topology wrapper's mismatch rejection, not success or an unrelated failure"
            exit 1
          fi

      - name: Verify embedding artifacts before cache save
        env:
          CACHE_DIR: ~/.cache/yorishiro/models/${{ env.EMBEDDING_MODEL_SHORT_ID }}
          CACHE_HIT: "true"
          MODEL_URL: unused
          TOKENIZER_URL: unused
        run: uv run scripts/embedding_cache.py verify

  package-validation:
    name: Package validation
    needs: [changes, package-build]
    if: ${{ always() && needs.changes.result == 'success' && needs.package-build.result == 'success' && needs.changes.outputs.package_validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-linux-*-*
          merge-multiple: true
      - uses: ./.github/actions/package-tests
        with:
          version: 0.0.0-${{ github.sha }}

  package-build:
    name: Package build (${{ matrix.edition }}, ${{ matrix.arch }})
    needs: [changes, ce, check, msrv]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.package_build == 'true' && (needs.changes.outputs.rust_validation != 'true' || (needs.ce.result == 'success' && needs.check.result == 'success' && needs.msrv.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ce
            arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - edition: ce
            arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - edition: ee
            arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - edition: ee
            arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-and-package
        with:
          edition: ${{ matrix.edition }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          version: 0.0.0-${{ github.sha }}
          build-tag: ${{ github.sha }}

  required-check:
    name: Required validation
    if: ${{ always() }}
    needs: [changes, ce, check, msrv, prepare-embedding, test, package-build, package-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected validation
        env:
          FULL: ${{ needs.changes.outputs.full }}
          RUST: ${{ needs.changes.outputs.rust_validation }}
          PACKAGE: ${{ needs.changes.outputs.package_validation }}
          PACKAGE_BUILD_SELECTED: ${{ needs.changes.outputs.package_build }}
          CE: ${{ needs.ce.result }}
          EE: ${{ needs.check.result }}
          MSRV: ${{ needs.msrv.result }}
          MODEL: ${{ needs.prepare-embedding.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package-validation.result }}
          PACKAGE_BUILD: ${{ needs.package-build.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]] || { echo "classifier ended $CHANGES" >&2; exit 1; }
          selected() { [[ "$1" == true ]]; }
          require_success() {
            local label=$1 result=$2 needed=$3
            if selected "$needed"; then
              [[ "$result" == success ]] || { echo "$label was selected but ended $result" >&2; exit 1; }
            else
              [[ "$result" == skipped ]] || { echo "$label was not selected but ended $result" >&2; exit 1; }
            fi
          }
          if [[ "$FULL" == true || "$RUST" == true ]]; then
            require_success CE "$CE" true
            require_success EE "$EE" true
            require_success MSRV "$MSRV" true
            require_success MODEL "$MODEL" true
            require_success TEST "$TEST" true
          else
            require_success CE "$CE" false
            require_success EE "$EE" false
            require_success MSRV "$MSRV" false
            require_success MODEL "$MODEL" false
            require_success TEST "$TEST" false
          fi
          require_success PACKAGE_BUILD "$PACKAGE_BUILD" "$PACKAGE_BUILD_SELECTED"
          require_success PACKAGE "$PACKAGE_RESULT" "$PACKAGE"
          if selected "$PACKAGE_BUILD_SELECTED" && [[ "$FULL" == true || "$RUST" == true ]]; then
            [[ "$CE" == success && "$EE" == success && "$MSRV" == success ]] || {
              echo "package build prerequisites did not succeed" >&2
              exit 1
            }
          fi
