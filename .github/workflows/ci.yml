name: CI

# Covers this repository's layout: the root package (`yorishiro`) and `migration/`, with the paid
# edition compiled in as the `ee/` module rather than a package of its own.
# Deliberately minimal: cargo check/clippy/fmt-check runs once, then test runs in parallel
# for postgres and sqlite backends via a matrix.

on:
  push:
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, loco-rebuild]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        # TODO: unify cache key convention with test job (which uses matrix-scoped keys).
        # check currently uses the default key while test splits by backend to avoid
        # postgres/sqlite artifact collisions.

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check test harness usage
        run: |
          # Only tests/requests/mod.rs may call the raw loco helpers directly.
          # All other test files must use boot_request/boot_request_sqlite instead.
          if git grep -l 'request_with_create_db::<\|request_with_create_sqlite::<' tests/ | grep -v 'tests/requests/mod.rs'; then
            echo "ERROR: call boot_request/boot_request_sqlite instead of the raw loco helper directly"
            exit 1
          fi

      - name: Check for allow(dead_code)
        run: |
          # SeaORM FromQueryResult requires exact field names for column mapping,
          # so columns read from SQL but unused on the Rust side need a _ prefix.
          if git grep -n 'allow(dead_code)' -- src ee migration/src; then
            echo "ERROR: allow(dead_code) found above (except known entity_relations exception). Delete the unused item, don't remove it."
            exit 1
          fi

      - name: Check
        run: cargo check --locked --workspace

      - name: Check doc links
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

      - name: Clippy (tests + complexity report)
        # Merges the hard-fail lint gate (`-D warnings`) with the warn-only complexity
        # report (`cognitive_complexity`, `too_many_lines`) into a single invocation.
        # Both lints are nursery/pedantic, off by default, so --force-warn opts them in.
        # Step 3 (doc coverage) stays separate because `--lib` is a different target set
        # from `--tests` and does not fire missing_errors_doc/missing_panics_doc on lib code.
        run: cargo clippy --locked --workspace --tests -- -D warnings --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines

      - name: Clippy doc coverage report
        # Warn-only (see clippy.toml): ~200 existing violations of missing_errors_doc
        # and missing_panics_doc; new/changed code is expected to add those comments.
        run: cargo clippy --locked --workspace --lib -- --force-warn clippy::missing_errors_doc --force-warn clippy::missing_panics_doc

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            loco_env: test_postgres
            database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          - backend: sqlite
            loco_env: test_sqlite
            database_url: sqlite:///tmp/yorishiro.sqlite3?mode=rwc
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yorishiro
          POSTGRES_PASSWORD: yorishiro
          POSTGRES_DB: yorishiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorishiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate caches for each matrix entry so postgres and sqlite build artifacts don't
          # collide (they compile different feature combinations).
          key: ${{ github.job }}-${{ matrix.backend }}

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Install sea-orm-cli with postgres-vector feature
        run: cargo install sea-orm-cli --version 2.0.2 --features postgres-vector,sqlx-postgres,sqlx-sqlite

      - name: Install pgvector and pg_trgm (postgres only)
        if: matrix.backend == 'postgres'
        run: |
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c '\c template1' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run migrations (postgres)
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
          DB_CONNECT_TIMEOUT: "5000"
        run: ./target/debug/yorishiro db migrate

      - name: Run migrations (sqlite)
        if: matrix.backend == 'sqlite'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
        run: ./target/debug/yorishiro db migrate

      - name: Verify _entities/ matches a fresh regen
        if: matrix.backend == 'postgres'
        env:
          DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          LOCO_ENV: test_postgres
          DB_CONNECT_TIMEOUT: "5000"
        run: |
          # Diagnose: confirm the migration-created tables actually exist.
          # This is the branching point if db entities ever produces 0 files again.
          docker exec ${{ job.services.db.id }} psql -U yorishiro -d yorishiro -c '\dt' || true
          # Run db entities (the determinism check).
          count_before=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          rm -f src/models/_entities/*.rs
          ./target/debug/yorishiro db entities
          which sea-orm-cli || echo "ERROR: sea-orm-cli not found in PATH"
          count=$(ls src/models/_entities/*.rs 2>/dev/null | wc -l)
          if [ "$count" -lt 10 ]; then
            echo "ERROR: Expected 20+ entity files, got $count after db entities."
            exit 1
          fi
          echo "Generated $count entity files (had $count_before before)"
          # Skip entity_embeddings_*.rs — PgVector doesn't implement Eq, so
          # sea-orm-codegen omits ActiveModelBehavior, but DeriveEntityModel
          # requires it. Restore committed files and skip diff check.
          git checkout -- src/models/_entities/entity_embeddings_768.rs src/models/_entities/entity_embeddings_1024.rs src/models/_entities/entity_embeddings_1536.rs
          git diff --exit-code -- ':!src/models/_entities/entity_embeddings_768.rs' ':!src/models/_entities/entity_embeddings_1024.rs' ':!src/models/_entities/entity_embeddings_1536.rs'

      - name: Run tests
        env:
          LOCO_ENV: ${{ matrix.loco_env }}
          DATABASE_URL: ${{ matrix.database_url }}
          DB_MAX_CONNECTIONS: 100
          DB_CONNECT_TIMEOUT: 5000
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Install cargo-llvm-cov
        if: matrix.backend == 'postgres'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage report
        if: matrix.backend == 'postgres'
        run: cargo llvm-cov --locked --workspace --summary-only
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          LOCO_ENV: ${{ matrix.loco_env }}
