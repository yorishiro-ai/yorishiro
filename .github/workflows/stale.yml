name: Stale

on:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been inactive for 60 days. It will be closed in 14 days unless there is activity."
          stale-pr-message: "This PR has been inactive for 30 days. It will be closed in 14 days unless there is activity."
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
