name: Stale

on:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: "This PR has been inactive for 30 days. It will be closed in 14 days unless there is activity."
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
