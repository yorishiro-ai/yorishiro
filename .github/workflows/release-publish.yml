name: Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and publish (e.g. 0.16.3) -- without the leading v. The bump PR from release.yml must already be merged to master.'
        required: true
  # Merging a bump PR from release.yml is what normally publishes a release -- the bump always
  # touches Cargo.toml, so filtering on it is enough to catch every real release without needing
  # to match the squash-merge commit message (which the merger can edit freely).
  #
  # A Cargo.lock-only push (dependabot's usual shape) doesn't match this filter and never starts
  # a run. A Cargo.toml push that isn't a bump (a dependency version change, a metadata edit)
  # does start one, and `prepare` then finds the current version's tag already exists and skips
  # the whole publish -- see the tag-existence check below.
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yotsunagi/yorishiro

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.tag-check.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      # Manual dispatch takes the version from the input. The push trigger (a merged bump PR)
      # has no input to take it from, so it reads the version master's Cargo.toml was just
      # bumped to -- the same bump the tag-existence/publish check below is guarding.
      - name: Determine version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$(sed -n '0,/^version = "\(.*\)"$/s//\1/p' Cargo.toml | head -1)"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' is not in X.Y.Z format, aborting."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_ENV"
          echo "tag=v$version" >> "$GITHUB_ENV"

      # On workflow_dispatch, an existing tag means the user asked to (re-)publish a version
      # that's already out -- that's a mistake, so fail loudly. On push, an existing tag just
      # means this Cargo.toml change wasn't a version bump (a dependency bump, a metadata edit,
      # a bump for a version that's already published) -- that's normal, so skip quietly rather
      # than spamming a failed run on every unrelated master push that happens to touch Cargo.toml.
      #
      # Known gap: if a run fails anywhere *before* the Tag step below (a checkout failure, a
      # transient network error reaching the remote), master is left at a bumped version with no
      # tag pushed for it. This check can't tell that apart from a fresh bump, so the next
      # unrelated Cargo.toml merge finds no tag, passes here, and tags *that* commit as the
      # release. The window is narrow -- it needs a mid-run failure followed by an unrelated
      # Cargo.toml change before anyone notices.
      #
      # Manual workflow_dispatch does NOT close this gap: the version check below compares only
      # the version *string*, so it catches "the bump PR hasn't merged yet" but not "the version
      # is right and HEAD has moved past the bump commit" -- both paths tag whatever master's
      # HEAD is at the time. Whoever recovers from a failed run has to confirm master's HEAD is
      # the intended bump commit before dispatching, or move the tag afterwards.
      - name: Check if tag already exists
        id: tag-check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.tag }}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Tag ${{ env.tag }} already exists, aborting."
              exit 1
            fi
            echo "Tag ${{ env.tag }} already exists, nothing to publish for this push."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # master's HEAD here is whatever the bump PR's squash merge produced -- not the commit
      # release.yml's `prepare` job built. Without this check, tagging master's HEAD blindly
      # would tag whatever happened to land there (a later, unrelated merge) as this release.
      # On push this is trivially true (the version came from this same Cargo.toml), but the
      # guard stays unconditional -- it's the only thing standing between workflow_dispatch and
      # tagging the wrong commit, so it isn't worth weakening for the push case's benefit.
      - name: Verify master HEAD is at the expected version
        run: |
          actual="$(sed -n '0,/^version = "\(.*\)"$/s//\1/p' Cargo.toml | head -1)"
          if [ "$actual" != "$version" ]; then
            echo "Cargo.toml's workspace.package.version is '$actual', expected '$version'."
            echo "Has the v$version bump PR from release.yml been merged to master yet?"
            exit 1
          fi

      - name: Set output
        id: version
        if: steps.tag-check.outputs.should_publish == 'true'
        run: |
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ env.tag }}" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.tag-check.outputs.should_publish == 'true'
        run: |
          git config user.name "tier940"
          git config user.email "tier940@protonmail.com"
          git tag "${{ env.tag }}"
          git push origin "${{ env.tag }}"

  binary:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            arch: amd64
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      # The action exports SCCACHE_PATH but not RUSTC_WRAPPER, so cargo has to be pointed at
      # sccache explicitly, and that happens after rust-cache below since rust-cache folds
      # RUST*-prefixed env vars into its cache key. Linux legs only -- the $GITHUB_ENV append is
      # bash syntax and this matrix also runs on windows-latest.
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - name: Route rustc through sccache
        if: runner.os == 'Linux'
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p yorishiro-server

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/yorishiro-server-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" \
            -C target/release yorishiro-server

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "target/release/yorishiro-server.exe" `
            -DestinationPath "dist/yorishiro-server-${{ needs.prepare.outputs.tag }}-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [docker, prepare]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch was pushed as its own tag by the (native, no-QEMU) `docker` job above;
      # this merges them into one multi-arch manifest under the version and `latest` tags.
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-amd64" \
            "${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-arm64"

  github-release:
    needs: [binary, prepare]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
