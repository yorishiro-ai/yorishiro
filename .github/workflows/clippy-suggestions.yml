name: Clippy Suggestions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io
          # Same shared-key as ci.yml's `check` job: this workflow only ever runs on PRs, so it
          # could never populate its own job-scoped cache key on master. Sharing the key lets it
          # restore what ci.yml saves on master instead of building cold every time.
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # No DB service or migrations here: this repo has zero sqlx::query!/query_as! macros (all
      # queries are built dynamically via sea-query + query_as_with), so clippy -- a compile-time
      # lint that only needs the code to type-check, not a live Postgres -- never touches
      # DATABASE_URL. Verified by running clippy with DATABASE_URL unset and no Postgres reachable
      # before removing this job's db service/migration steps (they were copy-pasted from ci.yml's
      # `check` job, where cargo test --all's #[sqlx::test] integration tests genuinely need one).
      - uses: giraffate/clippy-action@v1
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clippy_flags: --all-targets --all-features -- -D warnings
