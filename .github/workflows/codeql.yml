name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - uses: actions/checkout@v7
        with:
          # This job holds security-events: write, and CodeQL's rust extractor evaluates
          # build.rs from the checked-out tree; persist-credentials: false keeps that
          # write-scoped token out of reach of anything running as part of the checkout.
          persist-credentials: false

      - name: Restore patched Loco source
        run: python3 patches/loco-rs/verify.py --prepare

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - tests/**

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
