name: CodeQL

# Replaces GitHub's default CodeQL setup, which analyzed javascript-typescript alongside rust: this branch's tree carries zero .js/.ts/.tsx/.jsx files (ee/web, master's frontend, isn't part of this rebuild yet), so that language's job always failed with "CodeQL could not process any code written in JavaScript/TypeScript" rather than reporting a clean scan.
# rust is the only language actually present, so it's the only one analyzed here.
# If a future SSR/UI PR adds JS/TS back to the tree, add it to the matrix below in that same PR, so the workflow content and the tree it's analyzing change together.

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ee/docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - uses: actions/checkout@v7
        with:
          # This job holds security-events: write, and CodeQL's rust extractor evaluates
          # build.rs from the checked-out tree; persist-credentials: false keeps that
          # write-scoped token out of reach of anything running as part of the checkout.
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
