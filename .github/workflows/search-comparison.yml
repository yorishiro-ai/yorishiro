name: Search comparison diagnostic

# Temporary, bounded issue 599 experiment, not another routine test owner.
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/search-comparison.yml
      - scripts/search_comparison.py
      - tests/requests/mcp.rs

permissions:
  contents: read

jobs:
  comparison:
    if: github.event.pull_request.number == 606 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LOCO_ENV: test_postgres
      DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
      DB_MAX_CONNECTIONS: '100'
      DB_CONNECT_TIMEOUT: '5000'
      YORISHIRO_EMBEDDING_PROVIDER: none
      YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --init
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: search-comparison-release
      - name: Prepare non-superuser PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d template1 \
            -c 'CREATE EXTENSION vector;' -c 'CREATE EXTENSION pg_trgm;'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE ROLE yorishiro LOGIN PASSWORD 'yorishiro' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;" \
            -c 'CREATE DATABASE yorishiro OWNER yorishiro;'
          # Plans of slow statements explain the final-ranking variance seen in matched runs.
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "ALTER SYSTEM SET session_preload_libraries = 'auto_explain'" \
            -c "ALTER SYSTEM SET auto_explain.log_min_duration = '700ms'" \
            -c "ALTER SYSTEM SET auto_explain.log_analyze = on" \
            -c "ALTER SYSTEM SET auto_explain.log_buffers = on" \
            -c 'SELECT pg_reload_conf()'
      - name: Compare identical release workloads in ABBA order
        run: python3 scripts/search_comparison.py
      - name: Collect slow-statement plans
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker logs "$POSTGRES_CONTAINER" 2>&1 | grep -A60 'duration: ' > "$RUNNER_TEMP/search-comparison/postgres-slow-plans.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-comparison-diagnostic
          path: ${{ runner.temp }}/search-comparison/*.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-comparison-summary
          path: |
            ${{ runner.temp }}/search-comparison/results.json
            ${{ runner.temp }}/search-comparison/compiler.txt
