name: Coverage

# Informational weekly report; changes to this execution path also prove it on the PR.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/coverage.yml

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}
      DB_MAX_CONNECTIONS: "100"
      DB_CONNECT_TIMEOUT: "5000"
      RUST_BACKTRACE: "1"
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Require the signed licence
        run: test -n "$YORISHIRO_LICENSE_KEY"
      - name: Bootstrap PostgreSQL without bypassing application RLS
        env:
          POSTGRES_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d template1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE ROLE yorishiro LOGIN PASSWORD 'yorishiro' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;" \
            -c 'CREATE DATABASE yorishiro OWNER yorishiro;' \
            -c "ALTER SYSTEM SET log_statement = 'ddl'" -c 'SELECT pg_reload_conf()'
      - name: Run the enterprise suite under coverage
        env:
          DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
        run: |
          ignore='(^|/)src/models/_entities/|(^|/)migration/src/|(^|/)src/bin/'
          cargo llvm-cov --locked --workspace --features enterprise --ignore-filename-regex "$ignore" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$ignore" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
