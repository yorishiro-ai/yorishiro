name: Coverage

# Informational weekly report; changes to this execution path also prove it on the PR.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/coverage.yml

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: nightly
      YORISHIRO_LICENSE_KEY: ${{ secrets.YORISHIRO_LICENSE_KEY }}
      DB_MAX_CONNECTIONS: "100"
      DB_CONNECT_TIMEOUT: "5000"
      RUST_BACKTRACE: "1"
      EMBEDDING_MODEL_SHA256: a18a44fad1d0b46ded15928144138cff1135d5cc8233bdd90be5f18822de09a7
      EMBEDDING_TOKENIZER_SHA256: 62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb75626
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Set up nightly branch instrumentation
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Require the signed licence
        run: test -n "$YORISHIRO_LICENSE_KEY"
      - name: Bootstrap PostgreSQL without bypassing application RLS
        env:
          POSTGRES_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d template1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE ROLE yorishiro LOGIN PASSWORD 'yorishiro' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;" \
            -c 'CREATE DATABASE yorishiro OWNER yorishiro;' \
            -c "ALTER SYSTEM SET log_statement = 'ddl'" -c 'SELECT pg_reload_conf()'
      - name: Run the enterprise suite under coverage
        env:
          DATABASE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
          QUEUE_URL: postgres://yorishiro:yorishiro@localhost:5432/yorishiro
        run: |
          ignore='(^|/)src/models/_entities/|(^|/)migration/src/|(^|/)src/bin/'
          cargo +nightly llvm-cov --locked --workspace --features enterprise --branch --ignore-filename-regex "$ignore" --lcov --output-path coverage/lcov.info
          cargo +nightly llvm-cov report --ignore-filename-regex "$ignore" | tee coverage/summary.txt
      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/summary.txt
          if-no-files-found: error
