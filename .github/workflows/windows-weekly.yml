name: Windows (weekly)

# Windows is only exercised at release time (release.yml's `binary` job builds a windows-latest
# leg), which only runs on a `v*.*.*` tag push -- so a Windows-only build regression wouldn't
# surface until the moment a release is being cut. This runs the same build on a schedule so a
# regression is caught days before it would otherwise block a release. Weekly rather than daily
# (contrast MulmoTerminal's windows-daily.yaml): yorishiro releases far less often than daily, so
# a week-old signal is still well ahead of the next tag push.
#
# Build-only, no test run: sqlx's query building here is entirely dynamic (sea-query +
# query_as_with, no sqlx::query!/query_as! macros), so this doesn't need a database to compile --
# same reason release.yml's windows-latest leg builds without one. Running the test suite would
# additionally require a Windows Postgres service, which is a heavier lift for a check whose only
# job is "does this still build on Windows."

on:
  schedule:
    - cron: "0 18 * * 1" # 18:00 UTC Monday = 03:00 JST Tuesday
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      # The library, not the binary: this job exists to catch Windows-only compile breakage, and
      # the binary additionally embeds `ee/web/dist`, which would drag a node/pnpm stage onto a
      # Windows runner for no extra coverage. `release.yml` builds the full binary for Windows.
      - name: Build
        run: cargo build --release --lib -p yorishiro-server
