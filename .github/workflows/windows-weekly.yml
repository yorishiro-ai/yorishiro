name: Windows (weekly)

# This job is the only thing that builds Yorishiro on Windows.
# The release ships Linux packages and a container image, so no job in release.yml compiles for Windows, and without this schedule a Windows-only build regression would sit undetected for as long as nobody tried one.
#
# Weekly rather than daily: no release depends on the answer, so a week-old signal is enough to say whether the tree still builds there.
#
# Build-only, no test run: sqlx's query building here is entirely dynamic (sea-query + query_as_with, no sqlx::query!/query_as! macros), so this compiles without a database.
# Running the test suite would additionally require a Windows Postgres service, which is a heavier lift for a check whose only job is "does this still build on Windows."

on:
  schedule:
    - cron: "0 18 * * 1" # 18:00 UTC Monday = 03:00 JST Tuesday
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      # The library, not the binary: this job exists to catch Windows-only compile breakage, and the
      # lib carries both editions since `ee/` compiles into this crate rather than its own.
      - name: Build
        run: cargo build --release --lib -p yorishiro
