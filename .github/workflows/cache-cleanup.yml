name: Cache Cleanup

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    steps:
      - name: Delete caches for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number" >&2
            exit 1
          fi
          gh cache delete --all --ref "refs/pull/$PR_NUMBER/merge" --repo "$REPO" --succeed-on-no-caches
