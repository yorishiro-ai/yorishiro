name: Dependency Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The action exports SCCACHE_PATH but not RUSTC_WRAPPER, so cargo has to be pointed at
      # sccache explicitly or it's installed and never used. The pointing happens after
      # rust-cache below, since rust-cache folds RUST*-prefixed env vars into its cache key.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          # This workflow runs on a schedule, never on a PR, so it's always safe to save.
          # A scheduled run's `github.ref` is the default branch, so the condition names develop:
          # pinned to master it was permanently false and this cache was never written.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Route rustc through sccache
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: Install tools
        run: cargo install cargo-audit cargo-outdated
      # `cargo audit` exits 0 when it ran and found nothing, and 1 when it ran and has something
      # to report (an advisory, or a warning such as an unmaintained or yanked crate): valid
      # JSON on stdout either way. A higher code means it never ran at all: a bad flag, a missing
      # Cargo.lock, a failed advisory-db fetch. Those leave stdout empty, which is why this step
      # gates on the report parsing rather than on the exit code alone.
      #
      # This step distinguishes "no vulnerabilities" from "audit never ran": a failure to run
      # fails the job and the reason stays in the log, while a finding exits 0 here so the
      # issue below gets filed rather than turning the run red.
      - name: Run audit
        id: audit
        run: |
          status=0
          cargo audit --json > /tmp/audit.json || status=$?
          if [ "$status" -gt 1 ] || ! jq -e . /tmp/audit.json >/dev/null 2>&1; then
            echo "::error::cargo audit did not produce a report (exit $status) -- see the step log above. Not reporting this as 'no vulnerabilities'."
            exit 1
          fi

          jq -r '.vulnerabilities.list[]?.advisory.id' /tmp/audit.json > /tmp/vulns.txt
          if [ -s /tmp/vulns.txt ]; then
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
          fi
      # Same shape as the audit step: `cargo outdated`'s exit code isn't a reliable
      # found/not-found signal, so the report's own validity is what's checked. An unparseable
      # or absent report fails the job rather than passing as "nothing outdated".
      #
      # `--format json` emits one JSON object per workspace member (concatenated, not an array),
      # so every jq expression here uses `-s` (slurp) to gather them before counting/flattening.
      #
      # `--workspace` is what makes that "per workspace member" true. Without it `cargo outdated`
      # reports only the manifest it is invoked on, and this repository's root manifest is both
      # the workspace root and a package, so the run produced a single `yorishiro` object and
      # never looked at `migration`. A member with nothing outdated emits `"dependencies": []`
      # rather than omitting the key, so the validity check below still passes when every
      # member is current.
      #
      # `!cancelled()` rather than the default `success()` so a broken audit doesn't also suppress
      # the outdated report: the two checks are independent, and the issue-filing steps below
      # gate on their own step's output, so each half still reports whatever it collected.
      # `!cancelled()` rather than `always()` so cancelling the run actually stops it.
      - name: Run outdated
        id: outdated
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo outdated --workspace --root-deps-only --format json > /tmp/outdated.json || status=$?
          if ! jq -se 'length > 0 and all(.[]; has("dependencies"))' /tmp/outdated.json >/dev/null 2>&1; then
            echo "::error::cargo outdated did not produce a report (exit $status) -- see the step log above. Not reporting this as 'nothing outdated'."
            exit 1
          fi

          if [ "$(jq -s '[.[].dependencies[]] | length' /tmp/outdated.json)" -gt 0 ]; then
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
            jq -sr '.[].dependencies[] | "- \(.name): \(.project) → \(.latest)"' /tmp/outdated.json > /tmp/outdated.txt
          fi
      # `!cancelled() &&` so that one half failing (or finding nothing) doesn't suppress the other
      # half's issue (each of these gates only on the output of the step it reports for), while
      # still not filing issues on a cancelled run, since creating one is an API write.
      - name: Create issue for vulnerabilities
        if: ${{ !cancelled() && steps.audit.outputs.has_vulns == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const vulns = fs.readFileSync('/tmp/vulns.txt', 'utf8').trim();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: ${vulns.split('\n').length} advisory(ies) found`,
              body: `## Security Advisories\n\n${vulns}\n\nRun \`cargo audit\` for details.`,
              labels: ['security', 'dependencies']
            });
      - name: Create issue for outdated deps
        if: ${{ !cancelled() && steps.outdated.outputs.has_outdated == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const deps = fs.readFileSync('/tmp/outdated.txt', 'utf8').trim();
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'dependencies', state: 'open'
            });
            if (!existing.data.some(i => i.title.includes('Outdated dependencies'))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Outdated dependencies (${new Date().toISOString().slice(0,10)})`,
                body: `## Outdated Dependencies\n\n${deps}\n\nAll listed versions are stable releases.`,
                labels: ['dependencies']
              });
            }
