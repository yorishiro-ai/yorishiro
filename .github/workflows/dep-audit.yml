name: Dependency Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tools
        run: cargo install cargo-audit cargo-outdated
      - name: Run audit
        id: audit
        continue-on-error: true
        run: |
          cargo audit --json 2>/dev/null | jq -r '.vulnerabilities.list[]?.advisory.id' > /tmp/vulns.txt || true
          if [ -s /tmp/vulns.txt ]; then
            echo "has_vulns=true" >> $GITHUB_OUTPUT
          fi
      - name: Run outdated
        id: outdated
        continue-on-error: true
        run: |
          cargo outdated --root-deps-only --format json 2>/dev/null > /tmp/outdated.json || true
          count=$(jq '.dependencies | length' /tmp/outdated.json 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            jq -r '.dependencies[] | "- \(.name): \(.project) → \(.latest)"' /tmp/outdated.json > /tmp/outdated.txt
          fi
      - name: Create issue for vulnerabilities
        if: steps.audit.outputs.has_vulns == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const vulns = fs.readFileSync('/tmp/vulns.txt', 'utf8').trim();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: ${vulns.split('\n').length} advisory(ies) found`,
              body: `## Security Advisories\n\n${vulns}\n\nRun \`cargo audit\` for details.`,
              labels: ['security', 'dependencies']
            });
      - name: Create issue for outdated deps
        if: steps.outdated.outputs.has_outdated == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const deps = fs.readFileSync('/tmp/outdated.txt', 'utf8').trim();
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'dependencies', state: 'open'
            });
            if (!existing.data.some(i => i.title.includes('Outdated dependencies'))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Outdated dependencies (${new Date().toISOString().slice(0,10)})`,
                body: `## Outdated Dependencies\n\n${deps}\n\nAll listed versions are stable releases.`,
                labels: ['dependencies']
              });
            }
