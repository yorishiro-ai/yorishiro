name: Prepare PostgreSQL test database
description: Install template extensions and create the non-superuser test role.
inputs:
  container:
    description: PostgreSQL service container ID.
    required: true
  database:
    description: Name of the owned test database.
    default: yorishiro
  log-ddl:
    description: Enable DDL logging for coverage diagnostics.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.container }}
        TEST_DATABASE: ${{ inputs.database }}
        LOG_DDL: ${{ inputs.log-ddl }}
      run: |
        options=(-f -)
        if [[ "$LOG_DDL" == true ]]; then
          options+=(-c "ALTER SYSTEM SET log_statement = 'ddl'" -c 'SELECT pg_reload_conf()')
        fi
        docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 \
          -v "test_database=$TEST_DATABASE" -U postgres -d postgres "${options[@]}" \
          < scripts/init-test-postgres.sql
