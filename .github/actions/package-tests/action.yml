name: Package tests
description: Verifies the built packages and installs them in containers (checkout stays in each caller)

inputs:
  version:
    description: Version in the package file names, without any v prefix
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: dist
        pattern: binary-*
        merge-multiple: true

    - name: Install package tooling
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev rpm

    - name: Assert exact artifacts and metadata
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: ./packaging/test-artifacts.sh dist "$VERSION"

    - name: Verify artifact metadata checks reject invalid packages
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: ./packaging/test-artifacts-self.sh dist "$VERSION"

    - name: Verify installed-path policy allows the optional admin override
      shell: bash
      run: ./packaging/test-install-paths-self.sh

    - name: Test package transitions and co-install refusal
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: ./packaging/test-transitions.sh dist "$VERSION"

    - name: Test representative installed packages
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        ./packaging/test-install.sh "dist/yorishiro-ce-${VERSION}-amd64.deb"
        ./packaging/test-systemd.sh "dist/yorishiro-ee-${VERSION}-amd64.deb"

    - name: Test Docker configuration ownership and fallback
      shell: bash
      run: |
        docker build --build-arg EDITION=ce -t yorishiro-package-test:${{ inputs.version }} .
        make package-docker-check IMAGE=yorishiro-package-test:${{ inputs.version }}
