name: Package tests
description: Verifies the built packages and installs them in containers (checkout stays in each caller)

inputs:
  version:
    description: Package manager version
    required: true
  file-version:
    description: Public filename version, if different from the package manager version
    default: ''
  image-tag:
    description: Docker-safe validation tag, when the package version contains characters such as tilde
    default: ''
  docker-validation:
    description: Run Docker ownership checks here (CI runs them in parallel instead)
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: 'yorishiro-*.{tar.gz,deb,rpm}'
        merge-multiple: true

    - name: Install package tooling
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev rpm

    - name: Assert exact artifacts and metadata
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FILE_VERSION: ${{ inputs.file-version || inputs.version }}
      run: ./.github/packaging/test-artifacts.sh dist "$VERSION" "$FILE_VERSION"

    - name: Verify artifact metadata checks reject invalid packages
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FILE_VERSION: ${{ inputs.file-version || inputs.version }}
      run: ./.github/packaging/test-artifacts-self.sh dist "$VERSION" "$FILE_VERSION"

    - name: Verify installed-path policy allows the optional admin override
      shell: bash
      run: ./.github/packaging/test-install-paths-self.sh

    - name: Test current package lifecycle and co-install refusal
      shell: bash
      env:
        FILE_VERSION: ${{ inputs.file-version || inputs.version }}
      run: ./.github/packaging/test-package-lifecycle.sh dist "$FILE_VERSION"

    - name: Test representative installed packages
      shell: bash
      env:
        FILE_VERSION: ${{ inputs.file-version || inputs.version }}
      run: |
        ./.github/packaging/test-install.sh "dist/yorishiro-ce-${FILE_VERSION}-amd64.deb"
        ./.github/packaging/test-systemd.sh "dist/yorishiro-ee-${FILE_VERSION}-amd64.deb"

    - name: Write release checksums
      shell: bash
      working-directory: dist
      run: sha256sum -- *.tar.gz *.deb *.rpm > checksums.txt

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: checksums.txt
        path: dist/checksums.txt
        archive: false
        overwrite: true
        if-no-files-found: error

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: inputs.docker-validation == 'true'

    - name: Test Docker configuration ownership and fallback
      if: inputs.docker-validation == 'true'
      shell: bash
      env:
        TAG: ${{ inputs.image-tag || inputs.file-version || inputs.version }}
      run: |
        IMAGE=yorishiro-package-test EDITION=ce docker buildx bake -f .github/docker/docker-bake.hcl --load app
        make package-docker-check IMAGE="yorishiro-package-test:$TAG"
