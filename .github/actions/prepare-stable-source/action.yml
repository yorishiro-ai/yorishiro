name: Prepare stable source
description: Apply the stable version and compute the same release commit on every runner

inputs:
  version:
    description: Stable version without the v prefix
    required: true

outputs:
  commit:
    description: Commit containing the versioned build inputs
    value: ${{ steps.prepare.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Prepare the release snapshot
      id: prepare
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      run: |
        python3 scripts/release_version.py --set-stable "$VERSION"
        git add -- Cargo.toml Cargo.lock
        commit=$(git rev-parse HEAD)
        if ! git diff --cached --quiet; then
          # Use the parent timestamp so independent checkouts produce the same commit.
          export GIT_AUTHOR_DATE GIT_COMMITTER_DATE
          GIT_AUTHOR_DATE=$(git show -s --format=%cI HEAD)
          GIT_COMMITTER_DATE=$GIT_AUTHOR_DATE
          commit=$(git -c commit.gpgsign=false commit-tree "$(git write-tree)" -p HEAD -m "Bump version to v${VERSION}")
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
