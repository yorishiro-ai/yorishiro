name: Build Docker image
description: Builds, and optionally pushes, both editions for one native architecture

inputs:
  image:
    description: Image repository without a tag (e.g. ghcr.io/org/name)
    required: true
  tag:
    description: Release tag
    required: true
  source:
    description: Source commit recorded in image provenance
    required: true
  arch:
    description: Image architecture, amd64 or arm64
    required: true
  push:
    description: Push the image when 'true', build only otherwise
    required: true
  token:
    description: Registry token, required when push is 'true'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      id: bake
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        IMAGE: ${{ inputs.image }}
        TAG: candidate-${{ github.run_id }}
        ARCH: ${{ inputs.arch }}
        BUILD_SHA: ${{ inputs.tag }}
      with:
        source: .
        files: .github/docker/docker-bake.hcl
        targets: release
        push: ${{ inputs.push == 'true' }}

    - name: Record immutable build digests
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        METADATA: ${{ steps.bake.outputs.metadata }}
        IMAGE: ${{ inputs.image }}
        SOURCE: ${{ inputs.source }}
        ARCH: ${{ inputs.arch }}
        RUN_ID: ${{ github.run_id }}
      run: |
        printf '%s' "$METADATA" > "$RUNNER_TEMP/bake-metadata.json"
        python3 scripts/release_images.py record --image "$IMAGE" --source "$SOURCE" --run-id "$RUN_ID" --arch "$ARCH" --metadata "$RUNNER_TEMP/bake-metadata.json" --directory "$RUNNER_TEMP/release-images"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: ${{ inputs.push == 'true' }}
      with:
        name: release-images-${{ inputs.arch }}
        path: ${{ runner.temp }}/release-images/*.json
        if-no-files-found: error
        overwrite: true
