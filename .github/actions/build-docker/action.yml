name: Build Docker image
description: Builds, and optionally pushes, one edition and architecture of the image (checkout stays in each caller)

inputs:
  image:
    description: Image repository without a tag (e.g. ghcr.io/org/name)
    required: true
  tag:
    description: Release tag
    required: true
  edition:
    description: Edition, ce or ee
    required: true
  arch:
    description: Image architecture, amd64 or arm64
    required: true
  push:
    description: Push the image when 'true', build only otherwise
    required: true
  token:
    description: Registry token, required when push is 'true'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Read the pinned Rust version
      id: rust
      shell: bash
      run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        provenance: false
        build-args: |
          EDITION=${{ inputs.edition }}
          RUST_VERSION=${{ steps.rust.outputs.version }}
        tags: ${{ inputs.image }}:${{ inputs.tag }}-${{ inputs.edition }}-${{ inputs.arch }}
        cache-from: type=gha,scope=${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.arch }}
