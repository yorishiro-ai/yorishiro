name: Build Docker image
description: Builds, and optionally pushes, both editions for one native architecture

inputs:
  image:
    description: Image repository without a tag (e.g. ghcr.io/org/name)
    required: true
  tag:
    description: Release tag
    required: true
  arch:
    description: Image architecture, amd64 or arm64
    required: true
  push:
    description: Push the image when 'true', build only otherwise
    required: true
  token:
    description: Registry token, required when push is 'true'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        ARCH: ${{ inputs.arch }}
      with:
        source: .
        files: .github/docker/docker-bake.hcl
        targets: release
        push: ${{ inputs.push == 'true' }}
