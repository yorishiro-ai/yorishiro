name: Build and push Docker image
description: Builds a multi-arch Docker image for the given edition

inputs:
  edition:
    description: Edition (ce or ee)
    required: true
    default: ce
  tag:
    description: Release tag
    required: true
    default: ''
  arch:
    description: Architecture (amd64 or arm64)
    required: true
    default: amd64
  push:
    description: Whether to push (true) or not (dry run)
    required: true
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.inputs.ref }}
        persist-credentials: false

    - uses: docker/setup-buildx-action@v5

    - uses: docker/login-action@v5
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Read the pinned Rust version
      id: rust
      shell: bash
      run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        provenance: false
        build-args: |
          EDITION=${{ inputs.edition }}
          RUST_VERSION=${{ steps.rust.outputs.version }}
        tags: ghcr.io/yorishiro-ai/yorishiro:${{ inputs.tag }}-${{ inputs.edition }}-${{ inputs.arch }}
        cache-from: type=gha,scope=${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.arch }}
