name: Build Docker image
description: Builds, and optionally pushes, one edition and architecture of the image (checkout stays in each caller)

inputs:
  image:
    description: Image repository without a tag (e.g. ghcr.io/org/name)
    required: true
  tag:
    description: Release tag
    required: true
  edition:
    description: Edition, ce or ee
    required: true
  arch:
    description: Image architecture, amd64 or arm64
    required: true
  push:
    description: Push the image when 'true', build only otherwise
    required: true
  token:
    description: Registry token, required when push is 'true'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # master
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}-${{ inputs.edition }}-${{ inputs.arch }}
        EDITION: ${{ inputs.edition }}
      with:
        source: .
        files: .github/docker/docker-bake.hcl
        targets: app
        push: ${{ inputs.push == 'true' }}
        set: |
          app.platform=linux/${{ inputs.arch }}
          app.cache-from=type=gha,scope=${{ inputs.edition }}-${{ inputs.arch }}
          app.cache-to=type=gha,mode=max,scope=${{ inputs.edition }}-${{ inputs.arch }}
