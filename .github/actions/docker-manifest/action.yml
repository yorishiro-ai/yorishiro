name: Create Docker manifest
description: Creates multi-arch Docker manifest for an edition

inputs:
  tag:
    description: Release tag
    required: true
    default: ''
  edition:
    description: Edition (ce or ee)
    required: true
    default: ce

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest
      env:
        TAG: ${{ inputs.tag }}
        EDITION: ${{ inputs.edition }}
      shell: bash
      run: |
        docker buildx imagetools create \
           -t "ghcr.io/yorishiro-ai/yorishiro:${TAG}-${EDITION}" \
           "ghcr.io/yorishiro-ai/yorishiro:${TAG}-${EDITION}-amd64" \
           "ghcr.io/yorishiro-ai/yorishiro:${TAG}-${EDITION}-arm64"
