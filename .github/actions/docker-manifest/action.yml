name: Docker manifest
description: Joins the per-architecture images of one edition into a multi-arch tag

inputs:
  image:
    description: Image repository without a tag (e.g. ghcr.io/org/name)
    required: true
  source:
    description: Prepared source commit
    required: true
  edition:
    description: Edition, ce or ee
    required: true
  token:
    description: Registry token
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-images-*
        path: ${{ runner.temp }}/release-images
        merge-multiple: true

    - name: Create multi-arch manifest from immutable digests
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SOURCE: ${{ inputs.source }}
        RUN_ID: ${{ github.run_id }}
        EDITION: ${{ inputs.edition }}
      run: |
        python3 scripts/release_images.py join --image "$IMAGE" --source "$SOURCE" --run-id "$RUN_ID" --edition "$EDITION" --directory "$RUNNER_TEMP/release-images"

    - uses: actions/upload-artifact@v7
      with:
        name: release-manifest-${{ inputs.edition }}
        path: ${{ runner.temp }}/release-images/manifest-${{ inputs.edition }}.json
        if-no-files-found: error
        overwrite: true
