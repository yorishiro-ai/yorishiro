name: sea-orm-cli
description: Installs the sea-orm-cli version Cargo.lock resolves, which `db entities` shells out to (checkout stays in each caller)

runs:
  using: composite
  steps:
    - name: Resolve sea-orm-cli version
      id: version
      shell: bash
      run: |
        version="$(awk '/^name = "sea-orm-cli"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)"
        if [ -z "$version" ]; then
          echo "::error::Cargo.lock has no sea-orm-cli package" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Prebuilt release binaries lack postgres-vector, so cache the source build instead.
    - name: Restore sea-orm-cli
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ env.CARGO_HOME }}/bin/sea-orm-cli
        key: sea-orm-cli-local-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-postgres-vector-sqlx-postgres-sqlx-sqlite

    - name: Install sea-orm-cli with postgres-vector feature
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install sea-orm-cli --locked --version "${{ steps.version.outputs.version }}" --features postgres-vector,sqlx-postgres,sqlx-sqlite
