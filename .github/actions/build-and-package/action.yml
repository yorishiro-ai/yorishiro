name: Build and package
description: Builds and uploads a Linux binary archive, deb and rpm for one edition and architecture

inputs:
  edition:
    description: Edition, ce or ee
    required: true
  target:
    description: Rust target triple (e.g. x86_64-unknown-linux-gnu)
    required: true
  arch:
    description: Package architecture, amd64 or arm64
    required: true
  version:
    description: Package manager version
    required: true
  file-version:
    description: Public filename version, if different from the package manager version
    default: ''
  build-tag:
    description: Value exported to the build as BUILD_SHA
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        targets: ${{ inputs.target }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: package-almalinux10-${{ inputs.arch }}-${{ hashFiles('Dockerfile') }}

    - name: Build
      shell: bash
      env:
        BUILD_SHA: ${{ inputs.build-tag }}
        EDITION: ${{ inputs.edition }}
      run: |
        RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
        mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
        docker build --target package-builder -t yorishiro-package-builder .
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -v "$RUSTUP_HOME:/usr/local/rustup:ro" \
          -v "$HOME/.cargo/bin:/usr/local/cargo/bin:ro" \
          -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
          -v "$HOME/.cargo/git:/usr/local/cargo/git" \
          -w "$GITHUB_WORKSPACE" \
          -e RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | cut -d ' ' -f1)" \
          -e CARGO_HOME=/usr/local/cargo -e BUILD_SHA -e EDITION \
          yorishiro-package-builder bash -euc '
            if [ "$EDITION" = ce ]; then
              cargo build --locked --no-default-features --features community --release --bin yorishiro
            else
              cargo build --locked --features enterprise --release --bin yorishiro
            fi
            manifest_version=$(sed -n '\''s/^version = "\([^"]*\)"$/\1/p'\'' Cargo.toml)
            test "$(target/release/yorishiro version)" = "$manifest_version ($BUILD_SHA)"
            sections=$(readelf -SW target/release/yorishiro)
            if grep -Eq "\.(symtab|debug_[[:alnum:]_]+)[[:space:]]" <<< "$sections"; then
              echo "Release binary contains static symbols or debug information" >&2
              exit 1
            fi
          '

    - uses: ./.github/actions/install-nfpm

    - name: Package (tar.gz, deb and rpm)
      id: package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FILE_VERSION: ${{ inputs.file-version || inputs.version }}
        ARCH: ${{ inputs.arch }}
        EDITION: ${{ inputs.edition }}
      run: |
        set -euo pipefail
        mkdir -p dist
        filename="yorishiro-${EDITION}-${FILE_VERSION}-${ARCH}"
        stem="dist/$filename"
        for pkg in deb rpm; do
          cat .github/packaging/nfpm-common.yaml ".github/packaging/nfpm-yorishiro-${EDITION}.yaml" |
            nfpm package --config /dev/stdin --packager "$pkg" --target "${stem}.${pkg}"
        done
        licenses=(LICENSE)
        if [ "$EDITION" = ee ]; then
          licenses+=(ee/LICENSE)
        fi
        tar -czf "${stem}.tar.gz" -C "$PWD/target/release" yorishiro -C "$PWD" "${licenses[@]}"
        echo "filename=$filename" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.package.outputs.filename }}.tar.gz
        path: dist/${{ steps.package.outputs.filename }}.tar.gz
        archive: false
        overwrite: true
        if-no-files-found: error

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.package.outputs.filename }}.deb
        path: dist/${{ steps.package.outputs.filename }}.deb
        archive: false
        overwrite: true
        if-no-files-found: error

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.package.outputs.filename }}.rpm
        path: dist/${{ steps.package.outputs.filename }}.rpm
        archive: false
        overwrite: true
        if-no-files-found: error
