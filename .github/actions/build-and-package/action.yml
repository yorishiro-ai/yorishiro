name: Build and package
description: Builds one edition of yorishiro for one architecture and packages it as deb and rpm (checkout stays in each caller)

inputs:
  edition:
    description: Edition, ce or ee
    required: true
  target:
    description: Rust target triple (e.g. x86_64-unknown-linux-gnu)
    required: true
  arch:
    description: Package architecture, amd64 or arm64
    required: true
  version:
    description: Version used in package metadata and file names, without any v prefix
    required: true
  build-tag:
    description: Value exported to the build as BUILD_SHA
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        targets: ${{ inputs.target }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build
      shell: bash
      env:
        BUILD_SHA: ${{ inputs.build-tag }}
        EDITION: ${{ inputs.edition }}
      run: |
        if [ "$EDITION" = ce ]; then
          cargo build --locked --no-default-features --features community --release --bin yorishiro
        else
          cargo build --locked --features enterprise --release --bin yorishiro
        fi

    - uses: ./.github/actions/install-nfpm

    - name: Package (deb and rpm)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
        EDITION: ${{ inputs.edition }}
      run: |
        set -euo pipefail
        mkdir -p dist
        case "$ARCH" in amd64) deb_arch=amd64; rpm_arch=x86_64 ;; arm64) deb_arch=arm64; rpm_arch=aarch64 ;; *) echo "unsupported package architecture: $ARCH" >&2; exit 2 ;; esac
        for pkg in deb rpm; do
          nfpm package --config ".github/packaging/nfpm-yorishiro-${EDITION}.yaml" --packager "$pkg" --target dist/
          if [ "$pkg" = deb ]; then
            source="dist/yorishiro-${EDITION}_${VERSION}_${ARCH}.deb"
          else
            source="dist/yorishiro-${EDITION}-${VERSION}-1.${rpm_arch}.rpm"
          fi
          mv "$source" "dist/yorishiro-${EDITION}-${VERSION}-${ARCH}.${pkg}"
        done
        ls -1 dist/

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: binary-linux-${{ inputs.edition }}-${{ inputs.arch }}
        path: dist/*
