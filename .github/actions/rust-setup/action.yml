name: Rust toolchain
description: Shared Rust toolchain + sccache setup (checkout stays in each caller)

inputs:
  components:
    description: Extra rustup components (empty for query-only jobs; "rustfmt, clippy" for check)
    required: false
  use-sccache:
    description: Whether to install sccache (false for windows-weekly.yml where caching doesn't pay off)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Run sccache-action
      if: inputs.use-sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11
