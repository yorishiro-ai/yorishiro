name: Rust toolchain
description: Shared Rust toolchain setup (checkout stays in each caller)

inputs:
  components:
    description: Extra rustup components (empty for query-only jobs; "rustfmt, clippy" for check)
    required: false
    default: ''
  targets:
    description: Rust targets to add (e.g. x86_64-unknown-linux-musl)
    required: false
    default: ''
  toolchain:
    description: Rust toolchain to install. Empty means rust-version from Cargo.toml.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore patched Loco source
      shell: bash
      run: python3 patches/loco-rs/verify.py --prepare

    - name: Resolve the toolchain
      id: resolve
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        toolchain="${TOOLCHAIN:-$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)}"
        if [ -z "$toolchain" ]; then
          echo "::error::no toolchain input and no rust-version in Cargo.toml" >&2
          exit 1
        fi
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Add targets
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}

    - name: Install Linux linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes mold
        mold --version

    # Prebuilt binary: building it from source took about four minutes in every job.
    - name: Install sccache
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
