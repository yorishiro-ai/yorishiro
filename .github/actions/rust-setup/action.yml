name: Rust toolchain
description: Shared Rust toolchain setup (checkout stays in each caller)

inputs:
  components:
    description: Extra rustup components (empty for query-only jobs; "rustfmt, clippy" for check)
    required: false
    default: ''
  targets:
    description: Rust targets to add (e.g. x86_64-unknown-linux-musl)
    required: false
    default: ''
  # Kept as a no-op input for callers that still pass it (windows-weekly.yml).
  # Sccache was replaced by Swatinem/rust-cache in ci.yml and release.yml.
  use-sccache:
    description: No-op (sccache removed)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Add targets
      shell: bash
      run: rustup target add ${{ inputs.targets }}
