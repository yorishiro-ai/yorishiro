name: Rust toolchain
description: Shared Rust toolchain setup (checkout stays in each caller)

inputs:
  components:
    description: Extra rustup components (empty for query-only jobs; "rustfmt, clippy" for check)
    required: false
    default: ''
  targets:
    description: Rust targets to add (e.g. x86_64-unknown-linux-musl)
    required: false
    default: ''
  toolchain:
    description: Rust toolchain to install. Empty means channel from rust-toolchain.toml.
    required: false
    default: ''
  cache-key:
    description: Shared Cargo cache key. Empty disables this cache.
    default: ''
runs:
  using: composite
  steps:
    - name: Restore patched Loco source
      shell: bash
      run: python3 patches/loco-rs/verify.py --prepare

    - name: Resolve the toolchain
      id: resolve
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        toolchain="${TOOLCHAIN:-$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)}"
        if [ -z "$toolchain" ]; then
          echo "::error::no toolchain input and no channel in rust-toolchain.toml" >&2
          exit 1
        fi
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Use repository-local Cargo storage
      shell: bash
      run: |
        echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-cache" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/.cargo-cache/bin"
        echo "$GITHUB_WORKSPACE/.cargo-cache/bin" >> "$GITHUB_PATH"

    - name: Add targets
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}

    - name: Install Linux linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install --yes mold
        mold --version

    # Prebuilt binary: building it from source took about four minutes in every job.
    - name: Install sccache
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0

    - name: Restore the Cargo cache
      if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/develop' }}
