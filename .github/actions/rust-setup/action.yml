name: Rust toolchain
description: Shared Rust toolchain setup (checkout stays in each caller)

inputs:
  components:
    description: Extra rustup components (empty for query-only jobs; "rustfmt, clippy" for check)
    required: false
    default: ''
  targets:
    description: Rust targets to add (e.g. x86_64-unknown-linux-musl)
    required: false
    default: ''
  toolchain:
    description: Rust toolchain to install
    required: false
    default: '1.97.0'
runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Add targets
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}

    - name: Install Linux linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes mold
        mold --version

    - name: Install sccache
      shell: bash
      run: |
        if ! command -v sccache >/dev/null 2>&1; then
          RUSTC_WRAPPER= RUSTFLAGS= cargo install sccache --locked --version 0.10.0
        fi
        sccache --version
