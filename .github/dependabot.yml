version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # sea-query-binder's latest stable release (0.7.0) requires sea-query ^0.32.
      # The only published version accepting sea-query 1.0.x is 0.8.0-rc.7, a release candidate with no stable release yet.
      # Taking sea-query 1.0 means pinning that rc as this workspace's core query-building dependency (see PR #203, closed 2026-08-21 with the measured facts).
      # Revisit once sea-query-binder ships a stable release supporting sea-query 1.0.
      - dependency-name: "sea-query"
        versions: [">=1.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]