# Merge shared metadata without depending on the edition fragment's key order.
<<:
  arch: ${ARCH}
  platform: linux
  version: ${VERSION}
  # Preserve date-based prerelease versions instead of normalizing them as SemVer.
  version_schema: none
  section: net
  priority: optional
  maintainer: Yorishiro Contributors
  description: An MCP-native, multi-tenant knowledge store with user-defined schemas.
  vendor: Yorishiro
  homepage: https://github.com/yorishiro-ai/yorishiro

  # The CI build uses AlmaLinux 10 so its glibc floor also works on supported Ubuntu deployments.
  # Do not derive this floor from a developer binary linked against a newer host runtime.
  overrides:
    deb:
      depends:
        - ca-certificates
        - libc6 (>= 2.39)
        - libgcc-s1
        - libstdc++6
    rpm:
      depends:
        - ca-certificates
        - libc.so.6(GLIBC_2.39)(64bit)
        - libgcc
        - libstdc++

  scripts:
    preinstall: ./.github/packaging/preinstall.sh
    postinstall: ./.github/packaging/postinstall.sh
