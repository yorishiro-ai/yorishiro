core:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "Cargo.toml"]
server:
  - changed-files:
      - any-glob-to-any-file: "src/bin/**"
# `ee/web` is deferred, not abandoned: this rule starts matching when the SPA lands.
web-ui:
  - changed-files:
      - any-glob-to-any-file: "ee/web/**"
ee:
  - changed-files:
      - any-glob-to-any-file: "ee/**"
docs:
  - changed-files:
      - any-glob-to-any-file: "docs/**"
migrations:
  - changed-files:
      - any-glob-to-any-file: "migration/**"
ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
