# Excludes rust/hard-coded-cryptographic-value repository-wide.
#
# All 23 alerts were the same test password ("hunter2-hunter2") passed as a direct literal in tests/ request fixtures.
# The query does not fire on the same literal when it appears inside a serde_json::json!{...} call,
# which is why the alert count (23) never matched the literal's actual occurrence count (30).
# Inline suppression (`// codeql[...]`) does not exist for Rust: every other language CodeQL supports has it, but Rust does not.
# The cost of this exclusion: real hardcoded keys/passwords/IVs/salts in src/ or ee/ production code would no longer be caught by this rule either, repository-wide.
# No other built-in CodeQL Rust query covers the same ground (rust/cleartext-storage-database and rust/cleartext-transmission detect sensitive-value dataflow into storage or over the network, not a literal assigned as a credential), and no secret-scanning tool runs in this repository's CI.
# That gap is accepted here, not solved by it.
#
# Excludes rust/cleartext-logging repository-wide.
#
# It fired on three sites and each one is correct: none of them is a log.
# src/tasks/list_members.rs prints a member table to the terminal of the operator who ran `admin list-members`, and the email address is the answer to the question that command exists to answer.
# src/tasks/add_member.rs prints the confirmation of the membership the operator just created.
# tests/requests/oauth.rs interpolates a value into a `panic!` message in a test assertion.
# The query detects sensitive data reaching an output sink and cannot distinguish a log shipped somewhere from stdout read by the person who asked for it.
# The one fix draft for list_members.rs masked `user_id` as well as the email, leaving `admin list-members` printing a table identifying nobody, and its `mask_email` sliced with `&local[..1]`, a byte offset into a `&str` that splits a multi-byte character: compiled as proposed, it panics on an address like `тест@example.com`.
#
# The cost of this exclusion: a genuine cleartext log of sensitive data anywhere in src/ or ee/ would no longer be caught by this rule either, repository-wide.
# No other built-in CodeQL Rust query covers logging as a sink, so nothing else would catch it.
# That gap is accepted here, not solved by it, the same way the exclusion above accepts its own.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
  - exclude:
      id: rust/cleartext-logging
