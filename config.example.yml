# Optional alternative to .env.example. Every setting below has an equivalent environment
# variable (named in the comments); a set environment variable always wins over the value here.
# Copy this file to config.yml (or point YORISHIRO_CONFIG_PATH elsewhere) and fill in what you need --
# a missing file, or a missing key within it, is not an error.

# database_url: postgres://yorishiro:yorishiro@localhost:5432/yorishiro  # DATABASE_URL
# bind: 0.0.0.0:8080                                                    # YORISHIRO_BIND
# cors_origins: ""                                                      # YORISHIRO_CORS_ORIGINS

# Deployment-wide cap on the number of tenants `admin create-tenant` may create. Defaults to 1
# (single-tenant) if unset -- set to 0 for unlimited, or to a higher number to allow that many
# tenants. See .env.example for the full explanation (same setting, YORISHIRO_MAX_TENANTS).
# max_tenants: 1

# The setup/login web UI's static files are compiled into the binary and served at "/" by
# default. Set this to serve them from a real directory on disk instead (e.g. to iterate on
# web/ without rebuilding).
# web_dir: web                                                          # YORISHIRO_WEB_DIR

# rust_log: info                                                        # RUST_LOG

# auth_rate_limit:
#   max: 10                                                             # YORISHIRO_AUTH_RATE_LIMIT_MAX
#   window_secs: 60                                                     # YORISHIRO_AUTH_RATE_LIMIT_WINDOW_SECS

# search_tokens_per_minute: 100000                                      # YORISHIRO_SEARCH_TOKENS_PER_MINUTE

# Days a batch migration stays undoable; 0 keeps every before-image forever.
# snapshot_retention_days: 30                                           # YORISHIRO_SNAPSHOT_RETENTION_DAYS

# embedding:
#   provider: local                                                     # YORISHIRO_EMBEDDING_PROVIDER
#   dimensions: 1024                                                    # YORISHIRO_EMBEDDING_DIMENSIONS (must match model output)
#   # --- when provider: local (ONNX export, the default) ---
#   onnx_model_path: models/model.onnx                                  # YORISHIRO_ONNX_MODEL_PATH
#   onnx_tokenizer_path: models/tokenizer.json                          # YORISHIRO_ONNX_TOKENIZER_PATH
#   onnx_max_sequence_length: 512                                       # YORISHIRO_ONNX_MAX_SEQUENCE_LENGTH
#   onnx_pooling: mean                                                  # YORISHIRO_ONNX_POOLING (mean | last_token)
#   onnx_query_instruction: Retrieve relevant documents                 # YORISHIRO_ONNX_QUERY_INSTRUCTION (queries only)
#   # --- when provider: openai (e.g. Ollama, LM Studio, OpenAI) ---
#   base_url: http://localhost:11434/v1                                 # YORISHIRO_EMBEDDING_BASE_URL
#   model: nomic-embed-text                                             # YORISHIRO_EMBEDDING_MODEL
#   api_key: ""                                                         # YORISHIRO_EMBEDDING_API_KEY
#   send_dimensions_param: true                                         # YORISHIRO_EMBEDDING_SEND_DIMENSIONS_PARAM

# Drops the deployment to read-only while the database is under sustained load, and restores it
# when the load falls away. Off unless threshold is a positive number.
# db_load_guard:
#   threshold: 0                                                        # YORISHIRO_DB_LOAD_THRESHOLD (0 disables)
#   sustain_secs: 30                                                    # YORISHIRO_DB_LOAD_SUSTAIN_SECS
#   poll_secs: 5                                                        # YORISHIRO_DB_LOAD_POLL_SECS

# logging:
#   target: stdout                                                      # YORISHIRO_LOG_TARGET (stdout | single | daily | syslog)
#   dir: .                                                               # YORISHIRO_LOG_DIR (when target: single or daily)
#   syslog_socket: /dev/log                                             # YORISHIRO_SYSLOG_SOCKET (when target: syslog)
