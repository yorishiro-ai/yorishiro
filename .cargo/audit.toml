# Advisories to ignore in cargo-audit. These are transitive dependencies
# that we cannot update directly.

[advisories]
# paste (unmaintained): transitive dep of tokenizers. tokenizers hasn't
# migrated to pastey yet. No security vulnerability, just maintenance status.
# rsa (Marvin Attack): transitive dep of rmcp, no patched version exists
# rkyv (uninit-vec read/write, RUSTSEC-2026-0235): Cargo.lock lists it as an
# optional dependency of rust_decimal, but `cargo tree -p rust_decimal` shows
# this workspace never enables rust_decimal's rkyv feature, so it is not part
# of the compiled dependency graph.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2023-0071", "RUSTSEC-2026-0235"]

[yanked]
# spin 0.9.8 is yanked but pulled by a transitive dependency. No replacement
# version is available in our dependency graph.
enabled = false
